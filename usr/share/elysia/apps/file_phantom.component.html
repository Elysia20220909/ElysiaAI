<div class="h-full flex flex-col p-6 glass-omega text-white select-none">
    <!-- 📂 Header -->
    <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="text-3xl text-green-400">📂</div>
            <div>
                <h2 class="text-xs font-black tracking-[0.3em] text-green-400">FILE_PHANTOM // DATA_EXPEDITION</h2>
                <p class="text-[8px] opacity-40 uppercase" x-text="'PWD: ' + currentPath"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <input type="text" x-model="search" placeholder="NEURAL_SEARCH..." class="bg-black/40 border border-white/10 px-3 py-1 text-[9px] focus:border-green-500/50 outline-none w-48 font-mono">
        </div>
    </div>

    <!-- 🏗️ File Grid -->
    <div class="flex-1 flex gap-4 min-h-0">
        <!-- Explorer Tree -->
        <div class="w-2/3 overflow-y-auto pr-2 scrollbar-hide space-y-1">
            <template x-for="f in filteredFiles" :key="f.name">
                <div @click="selectFile(f)" 
                     :class="selectedFile?.name === f.name ? 'bg-green-500/20 border-green-500/30' : 'bg-white/5 border-white/5 opacity-70 hover:opacity-100'"
                     class="flex items-center justify-between p-3 border rounded cursor-pointer transition-all">
                    <div class="flex items-center gap-2">
                        <span x-text="f.type === 'directory' ? '📁' : '📄'"></span>
                        <span class="text-[10px] font-mono" x-text="f.name"></span>
                    </div>
                    <span class="text-[8px] opacity-40 font-mono" x-text="f.size"></span>
                </div>
            </template>
        </div>

        <!-- Binary Phantom Preview -->
        <div class="w-1/3 bg-black/40 border border-white/10 rounded p-4 flex flex-col gap-3 font-mono">
            <h3 class="text-[8px] opacity-40 uppercase tracking-widest text-green-400">PHANTOM_PREVIEW</h3>
            <div class="flex-1 overflow-hidden opacity-60 text-[7px] leading-tight break-all">
                <template x-if="selectedFile">
                    <div>
                        <div class="mb-4">
                             <p class="text-white">NAME: <span x-text="selectedFile.name"></span></p>
                             <p>STATUS: DECRYPTED_READABLE</p>
                        </div>
                        <div class="grid grid-cols-4 gap-1">
                            <template x-for="i in 32">
                                <span class="hover:text-green-400" x-text="Math.floor(Math.random()*256).toString(16).padStart(2, '0').toUpperCase()"></span>
                            </template>
                        </div>
                    </div>
                </template>
                <template x-if="!selectedFile">
                    <div class="h-full flex items-center justify-center text-center opacity-20">
                        SELECT_DATA_NODE_FOR_INSPECTION
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        return {
            currentPath: 'C:\\Users\\elysia\\os_root',
            search: '',
            selectedFile: null,
            files: [
                { name: 'kernel.py', type: 'file', size: '28KB' },
                { name: 'soul.json', type: 'file', size: '12KB' },
                { name: 'deep_web', type: 'directory', size: '--' },
                { name: 'abyssrtos.c', type: 'file', size: '42KB' },
                { name: 'config.json', type: 'file', size: '4KB' },
                { name: 'boot.ps1', type: 'file', size: '7KB' },
                { name: 'backups', type: 'directory', size: '--' }
            ],
            get filteredFiles() {
                return this.files.filter(f => f.name.toLowerCase().includes(this.search.toLowerCase()));
            },
            selectFile(f) {
                this.selectedFile = f;
            }
        }
    </script>
</div>
