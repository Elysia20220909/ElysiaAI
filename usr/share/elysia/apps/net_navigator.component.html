<div class="h-full flex flex-col bg-black text-red-500 font-mono p-4 overflow-hidden border-2 border-red-900 shadow-[0_0_20px_rgba(255,0,0,0.3)]">
    <div class="flex justify-between items-center border-b border-red-900 pb-2 mb-4">
        <h2 class="text-xs tracking-widest animate-pulse">ICE_BREAKER // NETRUNNER_TERMINAL-v0.9</h2>
        <span class="text-[10px] bg-red-900 text-black px-2 py-0.5">LOCAL_DEPTH: <span x-text="$parent.netDepth"></span></span>
    </div>

    <div class="flex-1 flex gap-4 min-h-0">
        <!-- 🚥 Level Selector -->
        <div class="w-1/3 flex flex-col gap-2 overflow-y-auto scrollbar-hide">
            <template x-for="i in [0,1,2,3,4,5,6]" :key="i">
                <button 
                    @click="dive(i)"
                    :class="$parent.netDepth === i ? 'bg-red-500 text-black' : 'border border-red-900 hover:bg-red-900/20'"
                    class="w-full py-2 px-3 text-left transition-all flex justify-between items-center group"
                >
                    <div class="flex flex-col">
                        <span class="text-[10px] opacity-50">LAYER_0<span x-text="i"></span></span>
                        <span class="font-bold text-xs" x-text="getLayerName(i)"></span>
                    </div>
                    <span class="text-xs group-hover:translate-x-1 transition-transform">>></span>
                </button>
            </template>
        </div>

        <!-- 🧬 Information Matrix -->
        <div class="flex-1 border border-red-900 p-4 bg-red-950/10 flex flex-col">
            <div class="flex-1">
                <h3 class="text-xs font-bold mb-2 border-b border-red-900/50 pb-1">LAYER_METADATA</h3>
                <p class="text-xs leading-relaxed mb-4 italic" x-text="getLayerDesc($parent.netDepth)"></p>
                
                <h3 class="text-xs font-bold mb-2 border-b border-red-900/50 pb-1">FORBIDDEN_DATA_SNIPPET</h3>
                <div class="bg-black/50 p-3 border-l-2 border-red-500 text-[10px] line-clamp-6 leading-relaxed">
                    <span class="opacity-50" x-text="'[' + new Date().toISOString() + '] ENTROPY_LEVEL: ' + (0.1 + ($parent.netDepth * 0.15)).toFixed(2)"></span><br><br>
                    <span x-text="getLayerLore($parent.netDepth)"></span>
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-red-900 flex justify-end">
                <button @click="revert()" class="text-[10px] hover:underline opacity-50">SYNC_RESTORE_STABILITY</button>
            </div>
        </div>
    </div>

    <script>
        return {
            layers: [],
            async init() {
                try {
                    const res = await fetch('etc/elysia/lore/deep_web.json');
                    const data = await res.json();
                    this.layers = data.layers;
                    console.log("Deep Web Lore Matrix Synchronized.");
                } catch(e) {
                    console.error("Lore sync failed", e);
                }
            },
            getLayerName(d) {
                return (this.layers[d] || {}).name || 'UNKNOWN';
            },
            getLayerDesc(d) {
                return (this.layers[d] || {}).description || 'No metadata found for this depth.';
            },
            getLayerLore(d) {
                return (this.layers[d] || {}).lore || 'DATA_CORRUPTED';
            },
            async dive(d) {
                // If Blackwall is not active, prompt to breach first
                if (!this.$parent.blackwallActive) {
                    this.$parent.showToast("ICE STILL ACTIVE - BREACH BLACKWALL FIRST", "🩹");
                    return;
                }
                
                this.$parent.showToast(`DIVING TO LAYER ${d}...`, "🧬");
                const chatRes = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: [{role: 'user', content: `<skill:dive_layer(depth=${d})>`}],
                        session_id: 'internal_nav'
                    })
                });
                // The monitor loop will pick up the state change
            },
            async revert() {
                this.$parent.showToast("RESTORING STABILITY...", "🩹");
                await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: [{role: 'user', content: `<skill:trigger_blackwall_protocol(active=false)>`}],
                        session_id: 'internal_nav'
                    })
                });
            }
        }
    </script>
</div>
