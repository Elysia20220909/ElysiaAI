<div class="h-full flex flex-col bg-[#050505] text-[#00ff41] font-mono p-4 overflow-hidden border border-[#003b00] shadow-[0_0_15px_rgba(0,255,65,0.1)]">
    <!-- 🟢 Header -->
    <div class="flex justify-between items-center border-b border-[#003b00] pb-2 mb-4">
        <div class="flex items-center gap-3">
            <span class="animate-pulse">●</span>
            <h2 class="text-xs tracking-[0.2em] font-bold">ABYSS_KERNEL_WORKBENCH // V_O_I_D-OS_v1.3</h2>
        </div>
        <div class="flex gap-2">
            <button @click="build('qemu')" class="text-[10px] border border-[#00ff41] px-2 py-0.5 hover:bg-[#00ff41] hover:text-black transition-all">BUILD_QEMU</button>
            <button @click="build('rpi4')" class="text-[10px] border border-[#00ff41] px-2 py-0.5 hover:bg-[#00ff41] hover:text-black transition-all">BUILD_RPi4</button>
            <button @click="runQemu()" class="text-[10px] bg-[#00ff41] text-black px-2 py-0.5 hover:bg-[#003b00] hover:text-[#00ff41] transition-all">MANIFEST_ABYSS</button>
        </div>
    </div>

    <!-- 🟡 Telemetry HUD (New) -->
    <div class="grid grid-cols-4 gap-4 mb-4">
        <div class="bg-black/60 border border-[#00ff41]/30 p-2 text-center">
            <div class="text-[8px] opacity-40">UPTIME</div>
            <div class="text-sm font-bold" x-text="telemetry.uptime || '00000'"></div>
        </div>
        <div class="bg-black/60 border border-[#00ff41]/30 p-2 text-center">
            <div class="text-[8px] opacity-40">HUMAN_SCORE</div>
            <div class="text-sm font-bold" x-text="(telemetry.human_score || 0) + '%'"></div>
        </div>
        <div class="bg-black/60 border border-[#00ff41]/30 p-2 text-center">
            <div class="text-[8px] opacity-40">TASKS_ACTIVE</div>
            <div class="text-sm font-bold" x-text="telemetry.tasks || '0'"></div>
        </div>
        <div class="bg-black/60 border border-[#00ff41]/30 p-2 text-center">
            <div class="text-[8px] opacity-40">LOAD_RESONANCE</div>
            <div class="text-sm font-bold" x-text="(telemetry.load || 0) + '%'"></div>
        </div>
    </div>

    <!-- 🟢 Main Workspace -->
    <div class="flex-1 flex gap-4 min-h-0">
        <!-- Explorer -->
        <div class="w-48 flex flex-col gap-1 text-[10px] border-r border-[#003b00] pr-4">
            <span class="opacity-30 mb-2">/usr/src/abyssrtos/</span>
            <template x-for="file in files" :key="file">
                <button @click="selectedFile = file" :class="selectedFile === file ? 'bg-[#00ff41]/10 text-white border-l-2 border-[#00ff41]' : 'opacity-60 hover:opacity-100'" class="text-left pl-2 py-1">
                    <span x-text="file"></span>
                </button>
            </template>
        </div>

        <!-- Code/Terminal View -->
        <div class="flex-1 flex flex-col gap-4">
            <div class="flex-1 bg-black/40 border border-[#003b00] p-4 text-[11px] overflow-auto whitespace-pre-wrap leading-relaxed opacity-80">
                <code x-text="sourceCode"></code>
            </div>
            
            <!-- Terminal Output -->
            <div class="h-1/3 bg-[#0a0a0a] border border-[#003b00] p-3 text-[10px] overflow-y-auto overflow-x-hidden flex flex-col-reverse">
                <div class="flex flex-col gap-1">
                    <template x-for="log in logs" :key="log.timestamp">
                        <div class="flex gap-2">
                            <span class="opacity-30" x-text="log.timestamp.split('T')[1].split('.')[0]"></span>
                            <span :class="log.type === 'error' ? 'text-red-500' : 'text-green-500'" x-text="log.msg"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        return {
            files: ['abyssrtos.c', 'Makefile', 'linker.ld'],
            selectedFile: 'abyssrtos.c',
            sourceCode: '// LOADING_ENCRYPTED_SECTOR...',
            logs: [],
            telemetry: {},
            eventSource: null,
            async init() {
                this.addLog("WORKBENCH_INITIALIZED: Resonance established.", "info");
                this.$watch('selectedFile', async (val) => {
                    await this.loadSource(val);
                });
                await this.loadSource(this.selectedFile);
                this.startTelemetryStream();
            },
            startTelemetryStream() {
                if (this.eventSource) this.eventSource.close();
                this.eventSource = new EventSource('http://localhost:8000/system/abyss/telemetry');
                this.eventSource.onmessage = (e) => {
                    this.telemetry = JSON.parse(e.data);
                };
            },
            async loadSource(file) {
                try {
                    const res = await fetch(`http://localhost:8000/system/read_src?file=${file}`);
                    const data = await res.json();
                    this.sourceCode = data.content;
                } catch(e) {
                    this.addLog(`ERR: Could not read ${file}`, "error");
                }
            },
            addLog(msg, type = "info") {
                this.logs.unshift({ timestamp: new Date().toISOString(), msg, type });
            },
            async build(platform) {
                this.addLog(`INITIATING_BUILD: Target=${platform}...`, "info");
                try {
                    const res = await fetch('http://localhost:8000/system/abyss/build', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ platform })
                    });
                    const data = await res.json();
                    this.addLog(data.output, data.status === 'success' ? 'info' : 'error');
                } catch(e) {
                    this.addLog("BUILD_CRITICAL_FAILURE: Resonance breakdown.", "error");
                }
            },
            async runQemu() {
                this.addLog("MANIFESTING_QEMU_ENVIRONMENT...", "info");
                await fetch('http://localhost:8000/system/abyss/run');
            }
        }
    </script>
</div>
