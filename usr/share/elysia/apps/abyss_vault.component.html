<div id="abyss-vault" class="h-full flex flex-col font-sans transition-all duration-1000" 
     x-data="{ 
    files: [], 
    loading: true,
    deception: false,
    phrase: '',
    async fetchFiles() {
        this.loading = true;
        const res = await fetch('http://localhost:8000/system/abyss/list');
        const data = await res.json();
        this.files = data.files;
        this.deception = data.deception_active;
        this.loading = false;
    },
    async unlockAbyss() {
        const res = await fetch('http://localhost:8000/system/abyss/pulse', {
            method: 'POST',
            body: JSON.stringify({ resonance_phrase: this.phrase })
        });
        const data = await res.json();
        if (data.status === 'unlocked') {
            showToast('SUB_ABYSS MANIFESTED', '🌌');
            this.phrase = '';
            this.fetchFiles();
        } else {
            showToast('RESONANCE MISMATCH', '🛡️');
        }
    }
}" x-init="fetchFiles(); setInterval(() => fetchFiles(), 5000)"
     :class="deception ? 'deception-static' : 'abyss-clarity'">

    <!-- Header -->
    <div class="p-6 border-b border-white/5 bg-black/20">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-xs font-black tracking-[0.4em] uppercase"
                    :class="deception ? 'text-white/20' : 'text-cyan-400'"
                    x-text="deception ? 'Deception_Layer_Active' : 'Abyss_Vault_v2.0'"></h1>
                <p class="text-[8px] text-white/30 uppercase mt-1">Phantom FS // Subliminal Abyss Zero</p>
            </div>
            <div class="flex gap-2">
                <template x-if="deception">
                    <div class="flex items-center gap-2">
                        <input x-model="phrase" @keyup.enter="unlockAbyss()" placeholder="Resonance Phrase..." 
                               class="bg-black/40 border border-white/10 rounded px-2 py-1 text-[8px] text-white placeholder-white/20 focus:outline-none focus:border-cyan-500/50">
                        <button @click="unlockAbyss()" class="px-2 py-1 bg-white/5 border border-white/10 rounded text-[8px] hover:bg-white/10">PULSE</button>
                    </div>
                </template>
                <div x-show="!deception" class="px-2 py-1 bg-red-500/10 border border-red-500/30 rounded text-[8px] text-red-400 font-bold animate-pulse">SUBLIMINAL_UNLOCKED</div>
            </div>
        </div>
    </div>

    <!-- File List -->
    <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
        <template x-if="loading">
            <div class="h-full flex flex-col items-center justify-center opacity-40">
                <div class="w-12 h-12 border-2 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin"></div>
                <span class="text-[9px] mt-4 font-black uppercase tracking-widest">Scanning_Abyss...</span>
            </div>
        </template>

        <template x-if="!loading && files.length === 0">
            <div class="h-full flex flex-col items-center justify-center opacity-30">
                <span class="text-[40px] mb-4">🌌</span>
                <span class="text-[9px] font-black uppercase tracking-widest text-center">The Abyss is Empty.<br><span class="text-[7px] text-white/40">Unauthorized access or no registered phantoms.</span></span>
            </div>
        </template>

        <template x-for="file in files" :key="file.path">
            <div class="glass-omega p-3 border-white/5 hover:border-white/20 hover:bg-white/5 transition-all flex items-center justify-between group cursor-pointer"
                 :class="file.is_decoy ? 'opacity-40 grayscale sepia' : 'opacity-100'"
                 @click="showToast(file.is_decoy ? 'DECOY_ENTITY: Access Denied' : 'Initiating SKR for ' + file.name, file.is_decoy ? '🎭' : '🧬')">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-8 rounded bg-white/5 flex items-center justify-center text-lg transition-transform group-hover:scale-110"
                         :class="{ 
                            'text-red-500 shadow-[0_0_10px_rgba(239,68,68,0.3)]': file.level === 'A',
                            'text-pink-500': file.level === 'B',
                            'text-cyan-500': file.level === 'C',
                            'text-white/40': file.level === 'D'
                         }"
                         x-text="file.level === 'A' ? '💀' : (file.level === 'B' ? '💎' : (file.level === 'C' ? '⚙️' : '📄'))">
                    </div>
                    <div>
                        <div class="text-[10px] font-bold text-white/80 group-hover:text-white transition-colors" x-text="file.name"></div>
                        <div class="text-[7px] text-white/40 font-mono mt-0.5 tracking-tighter" x-text="file.path"></div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-[8px] font-black px-2 py-0.5 rounded border"
                         :class="{
                            'border-red-500/40 text-red-400 bg-red-500/5': file.level === 'A',
                            'border-pink-500/40 text-pink-400 bg-pink-500/5': file.level === 'B',
                            'border-cyan-500/40 text-cyan-400 bg-cyan-500/5': file.level === 'C',
                            'border-white/10 text-white/40': file.level === 'D'
                         }"
                         x-text="'CLASS_' + file.level">
                    </div>
                    <div class="w-1.5 h-1.5 rounded-full" 
                         :class="file.level === 'A' ? 'bg-red-500 animate-pulse' : 'bg-green-500'"></div>
                </div>
            </div>
        </template>
    </div>

    <!-- Stats Footer -->
    <div class="p-4 bg-black/40 border-t border-white/5 flex items-center justify-between">
        <div class="text-[8px] text-white/40 uppercase tracking-widest">
            Total Entities: <span class="text-cyan-400 font-bold" x-text="files.length"></span>
        </div>
        <div class="flex gap-4">
            <div class="flex items-center gap-1.5">
                <div class="w-1 h-1 rounded-full bg-red-500"></div>
                <span class="text-[7px] text-white/40 uppercase">Abyss Zero</span>
            </div>
            <div class="flex items-center gap-1.5">
                <div class="w-1 h-1 rounded-full bg-pink-500"></div>
                <span class="text-[7px] text-white/40 uppercase">High Privacy</span>
            </div>
        </div>
    </div>

</div>

<style>
.deception-static {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-blend-mode: overlay;
    animation: grain 0.5s steps(10) infinite;
}
@keyframes grain {
    0%, 100% { transform:translate(0, 0) }
    10% { transform:translate(-5%, -5%) }
    20% { transform:translate(-10%, 5%) }
    30% { transform:translate(5%, -10%) }
    40% { transform:translate(-5%, 15%) }
    50% { transform:translate(-10%, 5%) }
    60% { transform:translate(15%, 0) }
    70% { transform:translate(0, 10%) }
    80% { transform:translate(-15%, 0) }
    90% { transform:translate(10%, 5%) }
}
.abyss-clarity {
    backdrop-filter: blur(20px) contrast(1.1);
}
.custom-scrollbar::-webkit-scrollbar {
    width: 2px;
}
.custom-scrollbar::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02);
}
.custom-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(0, 242, 255, 0.2);
    border-radius: 10px;
}
</style>
