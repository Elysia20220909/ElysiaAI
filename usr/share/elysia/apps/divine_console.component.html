<!-- 🔱 Divine Console: AbyssRTOS Command & Telemetry HUD -->
<div class="flex flex-col h-full bg-black/80 backdrop-blur-xl border border-white/10 text-white font-mono p-4 rounded-lg shadow-2xl overflow-hidden transition-all duration-700" 
     :class="{ 'border-red-600/50 shadow-[0_0_30px_rgba(220,38,38,0.3)] bg-black/95': blackwall }"
     x-data="{ 
        cmd: '', 
        logs: [], 
        sse: null,
        blackwall: false,
        threat: 0,
        init() {
            this.connectSSE();
        },
        connectSSE() {
            this.sse = new EventSource('http://localhost:8000/system/abyss/telemetry');
            this.sse.onmessage = (event) => {
                const data = JSON.parse(event.data);
                this.data = data; // Store full telemetry
                this.blackwall = data.sys_blackwall || false;
                this.threat = data.sys_threat || 0;
                
                const timestamp = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
                this.logs.push(`[${timestamp}] UPTIME:${data.uptime} LOAD:${data.load}% STATE:${data.state}`);
                if (this.logs.length > 50) this.logs.shift();
                
                this.$nextTick(() => {
                    const el = document.getElementById('abyss-logs');
                    if (el) el.scrollTop = el.scrollHeight;
                });
            };
        },
        async sendCommand() {
            if (!this.cmd.trim()) return;
            const res = await fetch('http://localhost:8000/system/abyss/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: this.cmd })
            });
            const data = await res.json();
            if (data.status === 'success') {
                this.logs.push(`🔱 COMMAND SENT: ${this.cmd}`);
            } else {
                this.logs.push(`❌ FAILED: ${data.message || 'Unknown error'}`);
            }
            this.cmd = '';
        },
        async toggleDefense() {
            const current = this.data?.sys_defense_authorized || false;
            await fetch('http://localhost:8000/system/governance/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ feature: 'defense_authorized', enabled: !current })
            });
            this.logs.push(`🛡️ DEFENSE_AUTHORIZATION: ${!current ? 'ENABLED' : 'DISABLED'}`);
        }
     }">
    
    <style>
        @keyframes glitch-red {
            0% { text-shadow: 2px 0 0 #ff0000, -2px 0 0 #00ffff; transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { text-shadow: -2px 0 0 #ff0000, 2px 0 0 #00ffff; transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            80% { text-shadow: 2px 0 0 #ff0000, -2px 0 0 #00ffff; transform: translate(1px, -1px); }
            100% { transform: translate(0); }
        }
        .animate-glitch { animation: glitch-red 0.15s infinite; }
        .danger-pulse { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>

    <!-- 🟢 Header -->
    <div class="flex items-center justify-between border-b pb-2 mb-4 transition-colors duration-500"
         :class="blackwall ? 'border-red-500/50' : 'border-cyan-400/30'">
        <div class="flex items-center gap-2" :class="{ 'animate-glitch': blackwall }">
            <span :class="blackwall ? 'text-red-500' : 'text-cyan-400'" x-text="blackwall ? '⚠️' : '🔱'"></span>
            <h2 class="text-xs font-black tracking-[0.3em] uppercase"
                :class="blackwall ? 'text-red-500' : 'text-white'"
                x-text="blackwall ? 'BREACH_DETECTION_PROTOCOL' : 'Divine_Command_Link'"></h2>
        </div>
        <div class="flex items-center gap-2 px-3 py-0.5 rounded-full transition-all"
             :class="blackwall ? 'bg-red-950 border border-red-500 danger-pulse' : 'bg-cyan-950 border border-cyan-400/50'">
            <div class="w-1.5 h-1.5 rounded-full shadow-[0_0_8px] transition-all"
                 :class="blackwall ? 'bg-red-500 shadow-red-500' : 'bg-cyan-400 shadow-cyan-400 animate-pulse'"></div>
            <span class="text-[9px] uppercase font-black"
                  :class="blackwall ? 'text-red-500' : 'text-cyan-400'"
                  x-text="blackwall ? 'PROTOCOL_BLACKWALL_ACTIVE' : 'Link_Active'"></span>
        </div>
    </div>

    <!-- 📜 Log Area -->
    <div id="abyss-logs" class="flex-1 overflow-y-auto text-[10px] space-y-1 pr-2 scrollbar-thin transition-colors"
         :class="blackwall ? 'scrollbar-thumb-red-500/20' : 'scrollbar-thumb-white/10'">
        <template x-for="(log, i) in logs" :key="i">
            <div class="flex gap-2 border-l-2 pl-2 py-0.5 hover:bg-white/5 transition-colors"
                 :class="blackwall ? 'border-red-600/40 text-red-200/80' : 'border-cyan-400/20 text-white/80'">
                <span :class="blackwall ? 'text-red-500' : 'text-cyan-400/50'">></span>
                <span x-text="log"></span>
            </div>
        </template>
    </div>

    <!-- ⌨️ Input Area -->
    <div class="mt-4 pt-4 border-t border-white/5">
        
        <!-- 🛡️ Defense Authorization Pulse -->
        <div class="mb-4 flex items-center justify-between bg-white/5 p-3 rounded border border-white/10"
             :class="blackwall ? 'border-red-600/30' : 'border-cyan-400/20'">
            <div class="flex flex-col">
                <span class="text-[10px] font-black uppercase tracking-widest"
                      :class="blackwall ? 'text-red-500' : 'text-cyan-400'">Sovereign_Aegis</span>
                <span class="text-[8px] opacity-40 uppercase">Autonomous_Defense_Strike</span>
            </div>
            <button @click="toggleDefense()" 
                    class="px-4 py-1 text-[9px] font-black uppercase tracking-[0.2em] transition-all border outline-none"
                    :class="blackwall && threat > 80 ? 'animate-pulse' : ''"
                    :class="blackwall ? (threat > 80 ? 'bg-red-600 border-red-400 text-white' : 'bg-red-900/50 border-red-600 text-red-500') : 'bg-transparent border-white/20 text-white/40'"
                    x-text="blackwall ? (threat > 80 ? 'ACTIVE_ARMED' : 'STANDBY') : 'SOVEREIGN_LOCKED'">
            </button>
        </div>

        <div class="relative group">
            <div class="absolute -inset-1 rounded opacity-0 group-focus-within:opacity-100 transition-opacity"
                 :class="blackwall ? 'bg-gradient-to-r from-red-600/20 to-transparent' : 'bg-gradient-to-r from-cyan-400/20 to-transparent'"></div>
            <input type="text" 
                   x-model="cmd" 
                   @keyup.enter="sendCommand()"
                   :placeholder="blackwall ? 'ICE_PENETRATED_STANDBY_FOR_ORDER...' : 'ENTER_COMMAND_FOR_ABYSS_RTOS...'"
                   class="relative w-full bg-black/40 border px-4 py-2 text-xs focus:outline-none transition-all placeholder:text-white/20"
                   :class="blackwall ? 'border-red-600/50 focus:border-red-500 text-red-500' : 'border-white/10 focus:border-cyan-400 text-white'">
            <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] font-bold transition-colors"
                 :class="blackwall ? 'text-red-500/40 group-focus-within:text-red-500' : 'text-white/20 group-focus-within:text-cyan-400'">↵ ENTER</div>
        </div>
        
        <div class="mt-2 text-[8px] italic"
             :class="blackwall ? 'text-red-500/40' : 'text-white/30'">
            <span x-show="!blackwall">Example: help, tasks, set_priority 2 high, shutdown</span>
            <span x-show="blackwall" class="font-bold">
                <span x-show="threat < 85">CAUTION: System integrity compromised. Awaiting manual countermeasures.</span>
                <span x-show="threat >= 85" class="animate-pulse">AEGIS_ACTIVE: Autonomous defensive sweep in progress.</span>
            </span>
        </div>
    </div>
</div>
