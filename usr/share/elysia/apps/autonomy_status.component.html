<div class="h-full flex flex-col bg-black/80 text-cyan-400 font-mono p-4 border border-cyan-900 shadow-[0_0_15px_rgba(0,255,255,0.1)]">
    <!-- 💠 Header -->
    <div class="flex items-center gap-2 border-b border-cyan-900 pb-2 mb-4">
        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></div>
        <h2 class="text-xs font-bold tracking-widest">SOVEREIGN_AUTONOMY_PULSE</h2>
    </div>

    <!-- 💠 Stats Grid -->
    <div class="flex-1 flex flex-col gap-3">
        <div class="flex justify-between items-center text-[10px]">
            <span class="opacity-50">ENGINE_STATUS:</span>
            <span class="text-green-400 font-bold">STABLE // RUNNING</span>
        </div>
        
        <div class="bg-cyan-950/20 border border-cyan-900/50 p-2 flex flex-col gap-2">
            <div class="flex justify-between items-center text-[10px]">
                <span>ANOMALIES_RESOLVED:</span>
                <span class="text-xl font-bold" x-text="stats.anomalies_fixed || 0"></span>
            </div>
            <div class="h-1 bg-cyan-900 rounded-full overflow-hidden">
                <div class="h-full bg-cyan-400" :style="`width: ${Math.min((stats.anomalies_fixed || 0) * 10, 100)}%`"></div>
            </div>
        </div>

        <div class="mt-auto">
            <h3 class="text-[9px] opacity-40 mb-1">LAST_SYNC_SIGNAL:</h3>
            <div class="text-[10px] bg-black p-2 border border-cyan-900/30 truncate">
                <span x-text="stats.last_pulse || 'WAITING_FOR_INITIAL_PULSE...'"></span>
            </div>
        </div>
    </div>

    <script>
        return {
            stats: {},
            async init() {
                this.refresh();
                setInterval(() => this.refresh(), 10000); // 10s UI Sync
            },
            async refresh() {
                try {
                    const res = await fetch('http://localhost:8000/system/monitor');
                    const data = await res.json();
                    this.stats = data.elysia.soul_resonance.autonomy_stats || {};
                } catch(e) {
                    console.error("Autonomy refresh fail", e);
                }
            }
        }
    </script>
</div>
