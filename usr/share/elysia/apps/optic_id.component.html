<div id="optic-id-hud" class="fixed inset-0 pointer-events-none z-[100] flex items-center justify-center opacity-0 transition-opacity duration-700"
     :class="{ 'opacity-100': stats.elysia?.security?.bio_resonance_active }">
    
    <!-- 👁️ The Iris Scanner -->
    <div class="relative w-64 h-64">
        <!-- Pulse Rings -->
        <div class="absolute inset-0 border-2 border-cyan-500/30 rounded-full animate-ping"></div>
        <div class="absolute inset-4 border border-cyan-400/20 rounded-full animate-iris-spin"></div>
        
        <!-- Center Iris Lock -->
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-32 h-32 border-2 border-dashed border-cyan-300/50 rounded-full flex items-center justify-center overflow-hidden">
                <div class="w-full h-full bg-gradient-to-tr from-cyan-900/40 via-purple-900/40 to-cyan-800/40 animate-pulse">
                    <!-- Iris Mesh -->
                    <svg viewBox="0 0 100 100" class="w-full h-full opacity-40">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2,4" />
                        <template x-for="i in 36">
                            <line x1="50" y1="50" 
                                  :x2="50 + 40 * Math.cos(i * 10 * Math.PI / 180)" 
                                  :y2="50 + 40 * Math.sin(i * 10 * Math.PI / 180)" 
                                  stroke="currentColor" stroke-width="0.2" />
                        </template>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Telemetry Data -->
        <div class="absolute -right-48 top-1/2 -translate-y-1/2 w-48 text-[10px] font-mono text-cyan-400 space-y-1">
            <div class="flex justify-between border-b border-cyan-900/50 pb-1">
                <span>IRIS_DEPTH</span>
                <span x-text="stats.elysia?.security?.iris_hash?.substring(0,8) || 'LOCKED'"></span>
            </div>
            <div class="flex justify-between">
                <span>RESONANCE</span>
                <span class="text-cyan-300">MATCH</span>
            </div>
            <div class="flex justify-between">
                <span>IDENTITY</span>
                <span x-text="stats.soul?.persona?.name?.toUpperCase() || 'UNKNOWN'"></span>
            </div>
            <div class="mt-4 animate-pulse text-[8px] text-cyan-500/70">
                // M5 HARDWARE ENFORCED //
            </div>
        </div>
    </div>

    <style>
        @keyframes iris-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-iris-spin {
            animation: iris-spin 10s linear infinite;
        }
    </style>
</div>
