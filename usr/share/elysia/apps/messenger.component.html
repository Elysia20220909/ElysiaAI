<div class="window-header" @mousedown="startDrag('messenger', $event)">
    <div class="window-controls">
        <div class="control-btn btn-close" @click="closeApp('messenger')"></div>
        <div class="control-btn btn-minimize" @click="closeApp('messenger')"></div>
        <div class="control-btn btn-maximize"></div>
    </div>
    <div class="window-title">💕 Resonance Messenger</div>
    <div class="w-12"></div>
</div>
<div class="window-content flex flex-col">
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
        <template x-for="msg in messages" :key="msg.id">
            <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                <div :class="msg.role === 'user' ? 'bg-pink-600/30 border border-pink-500/30' : 'bg-white/10 border border-white/10'" 
                     class="max-w-[85%] rounded-2xl px-4 py-3 shadow-xl backdrop-blur-md">
                    <p class="text-sm whitespace-pre-wrap" x-text="msg.content"></p>
                </div>
            </div>
        </template>
        <div x-show="loading" class="flex justify-start">
            <div class="bg-white/5 border border-white/10 rounded-2xl px-4 py-2 animate-pulse">
                <span class="text-xs text-pink-300">Resonanting...</span>
            </div>
        </div>
    </div>
    <div class="p-4 bg-black/20 border-t border-white/10">
        <form @submit.prevent="sendMessage()" class="flex gap-2">
            <input x-model="chatInput" placeholder="エリシアにメッセージを送る..." 
                   class="flex-1 bg-white/5 border border-white/20 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-pink-500 transition-all">
            <button type="submit" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg transition-colors">送信</button>
        </form>
    </div>
</div>
