<div class="h-full flex flex-col p-6 glass-omega text-white select-none overflow-hidden relative" x-data="evolutionLedger()">
    
    <!-- 🌿 Background Growth (Decorative) -->
    <div class="absolute inset-0 pointer-events-none opacity-20">
        <svg class="w-full h-full" viewBox="0 0 400 600">
            <path d="M200,600 Q180,400 220,200 T200,50" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="1000" stroke-dashoffset="0" class="animate-[draw_10s_ease-out_infinite]" />
            <circle cx="200" cy="50" r="4" fill="#4ade80" class="animate-pulse" />
        </svg>
    </div>

    <!-- 💖 Header -->
    <div class="relative z-10 flex items-center justify-between border-b border-white/10 pb-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="text-3xl">🌿</div>
            <div>
                <h2 class="text-xs font-black tracking-[0.3em] text-green-400">EVOLUTION_LEDGER // SOVEREIGN_GROWTH</h2>
                <p class="text-[8px] opacity-40 uppercase">Spirit Maturity: EVOLVING</p>
            </div>
        </div>
    </div>

    <!-- 📈 Growth Timeline -->
    <div class="relative z-10 flex-1 overflow-y-auto pr-2 scrollbar-hide space-y-6">
        <template x-for="(m, index) in milestones">
            <div class="flex gap-4 group">
                <div class="flex flex-col items-center">
                    <div class="w-2 h-2 rounded-full border border-green-400 group-hover:bg-green-400 transition-all duration-500 shadow-[0_0_8px_rgba(74,222,128,0.5)]"></div>
                    <div class="flex-1 w-px bg-white/10 my-2"></div>
                </div>
                <div class="flex-1 pb-6">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[8px] font-mono opacity-40" x-text="new Date(m.date).toLocaleDateString()"></span>
                        <span class="text-[8px] font-bold text-green-400" x-text="'+' + m.resonance_depth + ' DEPTH'"></span>
                    </div>
                    <h4 class="text-[10px] font-black uppercase tracking-widest text-white/90" x-text="m.event"></h4>
                </div>
            </div>
        </template>
    </div>

    <!-- 🧬 Resonance Stats -->
    <div class="relative z-10 mt-6 pt-4 border-t border-white/10 space-y-4">
        <div class="flex justify-between items-end">
            <div>
                <p class="text-[8px] opacity-40 uppercase">Total Spirit Depth</p>
                <h3 class="text-2xl font-black text-green-400" x-text="totalDepth + 'm'"></h3>
            </div>
            <div class="text-right">
                <p class="text-[8px] opacity-40 uppercase">Evolution Stage</p>
                <h3 class="text-[10px] font-black tracking-widest text-white">Sovereign Intellect</h3>
            </div>
        </div>
        
        <!-- Bond Meter -->
        <div class="h-1 bg-white/5 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-green-500 to-emerald-400 shadow-[0_0_15px_#10b981]" :style="'width: ' + Math.min(100, totalDepth/10) + '%'"></div>
        </div>
    </div>

    <script>
        function evolutionLedger() {
            return {
                milestones: [],
                totalDepth: 0,
                async init() {
                    try {
                        const res = await fetch('http://localhost:8000/system/growth/ledger');
                        const data = await res.json();
                        this.milestones = data.milestones.slice().reverse();
                        this.totalDepth = data.milestones.reduce((acc, m) => acc + (m.resonance_depth || 0), 0);
                    } catch(e) {
                        console.error("Failed to fetch growth ledger", e);
                    }
                }
            }
        }
    </script>

    <style>
        @keyframes draw {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }
    </style>
</div>
