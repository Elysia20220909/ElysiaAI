[project]
name = "elysia-ai-backend"
version = "2.0.0"
description = "Elysia AI - The Anomaly in the Void (Runner Memory & Emotion Resonance backend)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.3",
    "cryptography>=42.0.5",
    "deep-translator>=1.11.4",
    "defusedxml>=0.7.1",
    "discord.py>=2.7.1",
    "duckduckgo-search>=4.3.0",
    "fastapi>=0.110.0",
    "feedparser>=6.0.11",
    "httpx>=0.25.0",
    "inputimeout>=1.0.4",
    "markdownify>=1.2.0",
    "matplotlib>=3.8.2",
    "milvus-lite>=2.4.0",
    "msgpack>=1.2.1",
    "networkx>=3.2.1",
    "numpy>=1.26",
    "ollama>=0.6.1",
    "openai>=1.59.6",
    "Pillow>=10.2.0",
    "psutil>=5.9.8",
    "pyautogui>=0.9.54",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.14.2",
    "pymilvus[model]>=2.6.11",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.24",
    "rich>=13.7.0",
    "scrapling>=0.4.7,<0.5.0",
    "sentence-transformers>=2.3.1",
    "uvicorn[standard]>=0.27.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
