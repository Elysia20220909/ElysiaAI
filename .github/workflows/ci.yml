name: ElysiaAI CI (Guardian)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-check:
    name: "✨ 楽園のコードチェック"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==============================
      # 1. Bun & TypeScript (ElysiaJS)
      # ==============================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install JS/TS Dependencies
        run: bun install

      - name: Run Biome (Format & Lint Check)
        run: bun run lint
        continue-on-error: true

      - name: Run Bun Tests
        run: bun test

      - name: Bun Audit (Dependency Check)
        run: bun pm audit

      # ==============================
      # 2. Python (FastAPI & OS)
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python Dependencies (with uv)
        run: |
          uv pip install --system -r requirements.txt
          # Alternatively, use uv pip install --system -r requirements.lock for strict locking

      - name: Run Ruff (Linter)
        run: uv run ruff check .
        continue-on-error: true

      - name: Run Black (Formatter Check)
        run: uv run black --check .
        continue-on-error: true

      - name: Run Python Tests (Pytest)
        run: |
          uv run pytest tests/python/ --junitxml=pytest-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-report.xml

      # ==============================
      # 3. Rust (Shield Agent)
      # ==============================
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cargo Check (Sovereign Shield)
        run: cd packages/shield-agent && cargo check

      # ==============================
      # 4. Security Governance
      # ==============================
      - name: Secret Scan (Lightweight)
        run: bash scripts/scan-secrets.sh
