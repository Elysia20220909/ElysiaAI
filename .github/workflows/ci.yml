name: ElysiaAI CI (Guardian)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: "✨ 楽園のコードチェック"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install JS/TS Dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi

      - name: Git Hygiene Guard
        run: bun run check:git-hygiene

      - name: Dependency Alignment Guard
        run: bun run check:deps

      - name: Run Biome (Format & Lint Check)
        run: bun run lint

      - name: Run Bun Tests
        run: bun run test

      - name: Generate Bun Coverage
        run: bun run test --coverage

      - name: Upload Bun Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-coverage
          path: coverage/

      - name: Bun Audit (Dependency Check)
        run: bun audit

      - name: Smoke Test (Server Startup)
        run: |
          PORT=3000 SESSION_SECRET=ci_secret REDIS_ENABLED=false bun run start &
          sleep 5
          curl -f http://localhost:3000/ping || exit 1
          pkill -f "bun.*packages/server/src/index.ts" || true

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Encoding Guard
        run: python scripts/tests/check-encoding.py

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python Dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Run Ruff (Linter)
        run: |
          python -m ruff check \
            python/fastapi_server.py \
            kernel \
            usr \
            tests/test_kernel.py \
            tests/python \
            scripts/security/audit_dependencies.py \
            scripts/tests/check-encoding.py

      - name: Run Formatter Check
        run: |
          python -m ruff format --check \
            python/fastapi_server.py \
            kernel \
            usr \
            tests/test_kernel.py \
            tests/python \
            scripts/security/audit_dependencies.py \
            scripts/tests/check-encoding.py

      - name: Run Python Tests (Pytest)
        env:
          ELYSIA_TEST_MODE: "1"
        run: |
          python -m pytest tests/python tests/test_kernel.py --junitxml=pytest-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-results
          path: pytest-report.xml

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cargo Check (Sovereign Shield)
        run: cargo check --manifest-path packages/shield-agent/Cargo.toml

      - name: Secret Scan (Lightweight)
        run: bun run security:glassworm -- --ci
