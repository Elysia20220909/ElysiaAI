name: ElysiaAI CI (Guardian)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-and-check:
    name: "✨ 楽園のコードチェック"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # ==============================
      # 1. Bun & TypeScript (ElysiaJS)
      # ==============================
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS/TS Dependencies
        run: bun install

      - name: Git Hygiene Guard
        run: bun run check:git-hygiene

      - name: Dependency Alignment Guard
        run: bun run check:deps

      - name: Prisma Schema Validate
        run: bun run db:validate

      - name: Run Biome (Format & Lint Check)
        run: bun run lint

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run Bun Tests
        run: bun run test

      - name: Generate Bun Coverage
        run: bun run test --coverage

      - name: Upload Bun Coverage
        uses: actions/upload-artifact@v7
        with:
          name: bun-coverage
          path: coverage/

      - name: Bun Audit (Dependency Check)
        run: bun audit

      - name: Smoke Test (Server Startup)
        run: |
          PORT=3000 SESSION_SECRET=ci_secret REDIS_ENABLED=false bun run start &
          sleep 5
          curl -f http://localhost:3000/ping || exit 1
          pkill -f "bun.*packages/server/src/index.ts" || true

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================
      # 2. Python (FastAPI & OS)
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Encoding Guard
        run: python scripts/tests/check-encoding.py

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python Dependencies (with uv)
        run: |
          uv pip install --system -r requirements.txt
          # Alternatively, use uv pip install --system -r requirements.lock for strict locking

      - name: Run Ruff (Linter)
        run: uv run ruff check .
        continue-on-error: true

      - name: Run Formatter Check
        run: uv run ruff format --check .
        continue-on-error: true

      - name: Run Python Tests (Pytest)
        env:
          ELYSIA_TEST_MODE: "1"
        run: |
          uv run pytest tests/python tests/test_kernel.py --junitxml=pytest-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-report.xml

      # ==============================
      # 3. Rust (Shield Agent)
      # ==============================
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cargo Format Check (Sovereign Shield)
        run: cd packages/shield-agent && cargo fmt --check

      - name: Cargo Check (Sovereign Shield)
        run: cd packages/shield-agent && cargo check

      # ==============================
      # 4. Security Governance
      # ==============================
      - name: Repository Security Audit
        run: bun run security:audit

      - name: Secret Scan (Lightweight)
        run: bun run security:glassworm -- --ci
