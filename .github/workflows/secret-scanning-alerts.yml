name: Secret Scanning Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  security-events: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SECRET_ALERT_WEBHOOK: ${{ secrets.SECRET_ALERT_WEBHOOK }}
    steps:
      - name: Check open secret scanning alerts
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          status="$(
            curl -sS \
              -o alerts.json \
              -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPOSITORY}/secret-scanning/alerts?state=open&per_page=20"
          )"

          if [ "${status}" = "404" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::secret scanning API returned HTTP ${status}"
            exit 1
          fi

          count="$(jq 'length' alerts.json)"
          {
            echo "enabled=true"
            echo "count=${count}"
          } >> "${GITHUB_OUTPUT}"

          jq -r '
            .[0:10]
            | map("#\(.number) \(.state) \(.secret_type_display_name // .secret_type) \(.html_url)")
            | join("\n")
          ' alerts.json > alert-summary.txt

      - name: Post alert summary to Slack
        if: steps.alerts.outputs.enabled == 'true' && steps.alerts.outputs.count != '0' && env.SECRET_ALERT_WEBHOOK != ''
        env:
          COUNT: ${{ steps.alerts.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail

          summary="$(cat alert-summary.txt)"
          text="$(printf '[SecretScan] %s: %s open alert(s)\n%s' "${GITHUB_REPOSITORY}" "${COUNT}" "${summary}")"
          payload="$(jq -n --arg text "${text}" '{text: $text}')"

          curl -fsS \
            -X POST \
            -H "Content-type: application/json" \
            --data "${payload}" \
            "${SECRET_ALERT_WEBHOOK}"

      - name: Report disabled secret scanning
        if: steps.alerts.outputs.enabled == 'false'
        run: echo "::notice::Secret scanning is disabled or unavailable for this repository."

      - name: Report missing webhook
        if: steps.alerts.outputs.enabled == 'true' && steps.alerts.outputs.count != '0' && env.SECRET_ALERT_WEBHOOK == ''
        run: echo "::warning::SECRET_ALERT_WEBHOOK is not configured; secret scanning alerts were not forwarded."
