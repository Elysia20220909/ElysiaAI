name: 🛡️ Sovereign Security & Integrity Tests

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日深夜に実行
  workflow_dispatch:      # 手動実行
  push:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'packages/**'
      - 'python/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'requirements.txt'
      - 'package.json'
      - 'bun.lock'
      - 'prisma/**'
      - '.github/workflows/**'

jobs:
  security-audit:
    name: "🔍 セキュリティ監査 (Audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun Audit (JS/TS)
        run: bun audit

      - name: GlassWorm Supply Chain Scan
        run: bun run security:glassworm -- --ci

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Python Safety Check
        run: |
          uv pip install safety
          uv run safety check

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: elysia-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: elysia-sbom.spdx.json

  unit-tests:
    name: "🧪 統合テスト (Tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS Dependencies
        run: bun install

      - name: Run Bun Tests with Coverage
        run: bun run test --coverage

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Python Tests with Coverage
        run: pytest --cov=python --cov-report=term-missing tests/python tests/test_kernel.py

  zap-scan:
    name: "🛡️ OWASP ZAP Security Scan"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies & Setup Env
        run: |
          bun install
          cp .env.example .env
          # Use a mock secret for testing if needed
          sed -i 's/JWT_SECRET=.*/JWT_SECRET=zap-scan-secret-key/' .env

      - name: Start Server in Background
        run: |
          bun scripts/manage.ts dev:ci &
          # Wait for server to be ready (Base health)
          timeout 60s bash -c 'until curl -s http://localhost:3000/health; do sleep 2; done'
          # Verify Auth path (Should return 400 or 401, but not 404/500)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/auth/token | grep -qE "400|401"
          # Verify AI path
          curl -f http://localhost:3000/api/health || exit 1

      - name: ZAP Scan
        uses: zaproxy/action-baseline@903697920364e8333538c642823a17082f66a24 # v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  report:
    name: "📡 Meteor Status Report"
    runs-on: ubuntu-latest
    if: always()
    needs: [security-audit, unit-tests, zap-scan]
    steps:
      - name: Notify Meteor#6267
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Skipping notification: DISCORD_WEBHOOK_URL not set."
            exit 0
          fi
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"username\": \"Meteor#6267\", \"content\": \"🛡️ **Security Audit Complete**\nAudit: ${{ needs.security-audit.result }}\nTests: ${{ needs.unit-tests.result }}\nZAP: ${{ needs.zap-scan.result }}\nTimestamp: $(date)\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
