name: 🛡️ Sovereign Security & Integrity Tests

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日深夜に実行
  workflow_dispatch:      # 手動実行
  push:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/security-tests.yml'

jobs:
  security-audit:
    name: "🔍 セキュリティ監査 (Audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@28935578f7e7191638217316717a61f364003d15 # v2.0.1

      - name: Bun Audit (JS/TS)
        run: bun pm audit

      - name: Setup Python
        uses: actions/setup-python@f6742a91b3c76390a3c94444657152f20703664d # v5.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Python Safety Check
        run: |
          uv pip install safety
          uv run safety check

  unit-tests:
    name: "🧪 統合テスト (Tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Bun
        uses: oven-sh/setup-bun@28935578f7e7191638217316717a61f364003d15 # v2.0.1

      - name: Install JS Dependencies
        run: bun install

      - name: Run Bun Tests
        run: bun test

      - name: Setup Python
        uses: actions/setup-python@f6742a91b3c76390a3c94444657152f20703664d # v5.1.0
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Tests (Pytest)
        run: pytest tests/

  zap-scan:
    name: "🛡️ OWASP ZAP Security Scan"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Bun
        uses: oven-sh/setup-bun@28935578f7e7191638217316717a61f364003d15 # v2.0.1

      - name: Install Dependencies & Setup Env
        run: |
          bun install
          cp .env.example .env
          # Use a mock secret for testing if needed
          sed -i 's/JWT_SECRET=.*/JWT_SECRET=zap-scan-secret-key/' .env

      - name: Start Server in Background
        run: |
          bun scripts/manage.ts dev &
          # Wait for server to be ready
          timeout 60s bash -c 'until curl -s http://localhost:3000/health; do sleep 2; done'

      - name: ZAP Scan
        uses: zaproxy/action-baseline@903697920364e8333538c642823a17082f66a24 # v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  report:
    name: "📡 Meteor Status Report"
    runs-on: ubuntu-latest
    if: always()
    needs: [security-audit, unit-tests, zap-scan]
    steps:
      - name: Notify Meteor#6267
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Skipping notification: DISCORD_WEBHOOK_URL not set."
            exit 0
          fi
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"username\": \"Meteor#6267\", \"content\": \"🛡️ **Security Audit Complete**\nAudit: ${{ needs.security-audit.result }}\nTests: ${{ needs.unit-tests.result }}\nZAP: ${{ needs.zap-scan.result }}\nTimestamp: $(date)\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
