name: 🛡️ Sovereign Security & Integrity Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'packages/**'
      - 'python/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'prisma/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: "🔍 セキュリティ監査 (Audit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install JS Dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi

      - name: Bun Audit (JS/TS)
        run: bun audit

      - name: GlassWorm Supply Chain Scan
        run: bun run security:glassworm -- --ci

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Python Safety Check
        run: |
          uv pip install --system "safety<4"
          if [ -f requirements.lock ]; then
            python -m safety check -r requirements.lock --full-report
          else
            python -m safety check -r requirements.txt --full-report
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: spdx-json
          output-file: elysia-sbom.spdx.json

      - name: Generate SBOM Digest
        run: sha256sum elysia-sbom.spdx.json > elysia-sbom.spdx.json.sha256

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: |
            elysia-sbom.spdx.json
            elysia-sbom.spdx.json.sha256
          retention-days: 90

  unit-tests:
    name: "🧪 統合テスト (Tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install JS Dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi

      - name: Run Bun Tests with Coverage
        run: bun run test --coverage

      - name: Upload Bun Coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-security-test-coverage
          path: coverage/
          retention-days: 14

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest-cov

      - name: Run Python Tests with Coverage
        run: python -m pytest --cov=python --cov-report=term-missing tests/python tests/test_kernel.py

  zap-scan:
    name: "🛡️ OWASP ZAP Security Scan"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Dependencies & Setup Env
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi
          cp .env.example .env
          sed -i 's/JWT_SECRET=.*/JWT_SECRET=zap-scan-secret-key/' .env

      - name: Start Server in Background
        run: |
          bun scripts/manage.ts dev:ci &
          timeout 60s bash -c 'until curl -s http://localhost:3000/health; do sleep 2; done'
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/auth/token | grep -qE "400|401"
          curl -f http://localhost:3000/api/health || exit 1

      - name: ZAP Scan
        uses: zaproxy/action-baseline@903697920364e8333538c642823a17082f66a24
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

  report:
    name: "📡 Meteor Status Report"
    runs-on: ubuntu-latest
    if: always()
    needs: [security-audit, unit-tests, zap-scan]

    steps:
      - name: Notify Meteor#6267
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Skipping notification: DISCORD_WEBHOOK_URL not set."
            exit 0
          fi
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"username\": \"Meteor#6267\", \"content\": \"🛡️ **Security Audit Complete**\nAudit: ${{ needs.security-audit.result }}\nTests: ${{ needs.unit-tests.result }}\nZAP: ${{ needs.zap-scan.result }}\nTimestamp: $(date)\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
