name: Security Baseline

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master", "main", "dev" ]
  push:
    branches: [ "master", "main", "dev" ]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  id-token: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Scan CI workflows for poisoning indicators
        run: bun run security:ci-workflows --strict-pinning

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install Python audit tooling
        run: python -m pip install "pip-audit>=2.9,<3"

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: GlassWorm supply-chain scan
        run: bun run security:glassworm -- --ci

      - name: Cross-language dependency audit
        run: bun run security:audit
