name: 🚀 Release & Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "📦 Create GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          set -euo pipefail
          echo "## What's Changed" > release_notes.md
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          if [ -n "$previous_tag" ]; then
            git log "${previous_tag}..HEAD" --oneline --pretty=format:"* %s" >> release_notes.md
          else
            echo "_No previous tag found. Showing the latest 50 commits._" >> release_notes.md
            git log --oneline --pretty=format:"* %s" -n 50 >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "## Verification" >> release_notes.md
          echo "- Generated by GitHub Actions for ${GITHUB_REF_NAME}" >> release_notes.md
          sha256sum release_notes.md > release_notes.md.sha256

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes-${{ github.ref_name }}
          path: |
            release_notes.md
            release_notes.md.sha256
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
