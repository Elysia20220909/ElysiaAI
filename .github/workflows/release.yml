name: 🚀 Release & Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: "🖥️ Build & Sign Desktop App (${{ matrix.platform }})"
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CODESIGN_CERTS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install JS/TS Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python (for Sidecar build)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Python Sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-python-sidecar.ps1

      - name: Build Python Sidecar (macOS/Linux)
        if: matrix.platform == 'macos'
        run: |
          chmod +x ./scripts/build-python-sidecar.sh
          ./scripts/build-python-sidecar.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Import macOS Certificates (macOS)
        if: matrix.platform == 'macos' && env.HAS_APPLE_CODESIGN_CERTS == 'true'
        uses: apple-actions/import-codesign-certs@f4150529d8926de27d04a60181512dbcc6bb1bdf
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write Tauri sidecar config
        run: bun scripts/write-tauri-sidecar-config.ts

      - name: Build Tauri Desktop Client
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ElysiaAI v__VERSION__"
          releaseBody: "See release notes for changes."
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.sidecar.conf.json

  linux-advisory-record:
    name: "🐧 Linux Advisory Record"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install JS/TS Dependencies
        run: bun install --frozen-lockfile

      - name: Record Linux advisory gate
        run: bun run desktop:check:linux:beta
