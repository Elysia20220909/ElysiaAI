name: Sovereign Sentinel (Cloud Monitor)

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write         # Required to push state updates

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Sentinel Action
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/sentinel_action.py
          python scripts/bungie_broadcast.py
          python scripts/marathon_hook_monitor.py

      - name: Commit State Changes
        run: |
          git config --global user.name "Meteor#6267"
          git config --global user.email "meteor@elysia.ai"
          git add data/sentinel_state.json data/bungie_state.json data/marathon_hook_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sentinel): update intelligence state [skip ci]" && git push)
