name: Sovereign Sentinel (Cloud Monitor)

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sovereign-sentinel.yml"
      - "scripts/marathon/**"
      - "scripts/marathon_templates.py"
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:      # Manual trigger

permissions:
  contents: read
  id-token: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Required to push state updates
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv httpx feedparser

      - name: Run Sentinel Action
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MARATHON_WEBHOOK_URL: ${{ secrets.MARATHON_WEBHOOK_URL }}
          ABYSSAL_WEBHOOK_URL: ${{ secrets.ABYSSAL_WEBHOOK_URL }}
        run: |
          python scripts/marathon/marathon_hook_monitor.py --once

      - name: Commit State Changes
        run: |
          git config --global user.name "Meteor#6267"
          git config --global user.email "meteor@elysia.ai"
          git add data/marathon_hook_state.json
          [ -f data/seen_marathon_news.json ] && git add data/seen_marathon_news.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sentinel): update intelligence state [skip ci]" && git push)
