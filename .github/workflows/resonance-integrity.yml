name: Resonance Integrity (CI)

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

permissions:
  contents: read

jobs:
  backend-integrity:
    name: Backend & UI (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install
      - name: Git Hygiene Guard
        run: bun run check:git-hygiene
      - name: Lint & Format Check (Biome)
        run: bun run lint
      - name: Run Bun Tests
        run: bun run test

  kernel-integrity:
    name: AI Kernel (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Encoding Guard
        run: python scripts/tests/check-encoding.py
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Lint Check (Ruff)
        run: ruff check python tests/python tests/test_kernel.py
      - name: Type Check
        run: ruff check --select F python tests/python tests/test_kernel.py
      - name: Run Python Tests
        run: pytest tests/python tests/test_kernel.py
 # 基本的な整合性チェック
