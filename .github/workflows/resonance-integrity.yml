name: Resonance Integrity (CI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  id-token: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integrity:
    name: Backend & UI (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi
      - name: Git Hygiene Guard
        run: bun run check:git-hygiene
      - name: Lint & Format Check (Biome)
        run: bun run lint
      - name: Run Bun Tests
        run: bun run test

  kernel-integrity:
    name: AI Kernel (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Encoding Guard
        run: python scripts/tests/check-encoding.py
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Lint Check (Ruff)
        run: ruff check python tests/python tests/test_kernel.py
      - name: Type Check
        run: ruff check --select F python tests/python tests/test_kernel.py
      - name: Run Python Tests
        run: pytest tests/python tests/test_kernel.py
 # 基本的な整合性チェック
