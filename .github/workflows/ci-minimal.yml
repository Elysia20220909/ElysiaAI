name: CI (minimal permissions)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish from main using OIDC trusted publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elysiaai-build-${{ github.sha }}
          path: |
            dist/**
            build/**
            coverage/**
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Setup Node for npm publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi

      - name: Build
        run: bun run build

      - name: Guard npm publish surface
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (pkg.private === true) {
            throw new Error("Refusing to publish because package.json has private: true.");
          }

          const hasFilesAllowlist = Array.isArray(pkg.files) && pkg.files.length > 0;
          if (!hasFilesAllowlist && !fs.existsSync(".npmignore")) {
            throw new Error("Refusing to publish without package.json files or .npmignore.");
          }
          NODE

      - name: npm publish (OIDC)
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Temporary token fallback, if OIDC trusted publishing is not ready yet:
      # - name: npm publish (temporary token)
      #   run: npm publish --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
