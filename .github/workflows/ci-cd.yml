name: CI/CD

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

permissions:
  contents: read

jobs:
  security:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: bun install
      - name: Git Hygiene Guard
        run: bun run check:git-hygiene
      - name: Encoding Guard
        run: python scripts/tests/check-encoding.py
      - name: Secret Scan
        run: bun run security:glassworm -- --ci
      - name: Bun Audit
        run: bun audit

  build-and-test:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Type Check
        run: bun run typecheck
      - name: Test
        run: bun run test
