name: Takumi Guard Check

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Setup Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: "3.3"
      - run: bun install --frozen-lockfile
      - run: pip install -r requirements.txt
      - name: Run Python tests
        env:
          ELYSIA_TEST_MODE: "1"
        run: python -m pytest
      - if: hashFiles('Gemfile') != ''
        run: bundle install
      - if: hashFiles('Gemfile') != '' && hashFiles('spec/**/*.rb') != ''
        run: bundle exec rspec
      - run: bun run test

  guarded-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Takumi Guard OIDC on trusted events.
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Setup Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: "3.3"
      - uses: flatt-security/setup-takumi-guard-npm@b32fa78ac6c5507152b0470604b0b546fa2b8521 # v1
        with:
          bot-id: "BT01KRE9NS68JGFQ28QS1F4BVRA0" # Elysia20220909
      - run: bun install --frozen-lockfile
      - uses: flatt-security/setup-takumi-guard-pypi@733047c120b6377fa05fb77f714df8d8cd3a41a9 # v1
        with:
          bot-id: "BT01KRE9NS68JGFQ28QS1F4BVRA0" # Elysia20220909
      - run: pip install -r requirements.txt
      - name: Run Python tests
        env:
          ELYSIA_TEST_MODE: "1"
        run: python -m pytest
      - uses: flatt-security/setup-takumi-guard-rubygems@ce18aae2e17e26d6510008ada35a08fff356179a # v1
        with:
          bot-id: "BT01KRE9NS68JGFQ28QS1F4BVRA0" # Elysia20220909
      - if: hashFiles('Gemfile') != ''
        run: bundle install
      - if: hashFiles('Gemfile') != '' && hashFiles('spec/**/*.rb') != ''
        run: bundle exec rspec
      - run: bun run test
