name: 🌸 Elysia OS Resonance Verification (CI)

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

permissions:
  contents: read

jobs:
  resonance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ⚙️ Setup Environment (Python & Bun)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint (Python)
        run: |
          ruff check python tests/python tests/test_kernel.py

      - name: 🧪 Unit Tests (Python Kernel)
        run: |
          pytest tests/python tests/test_kernel.py

      - name: 📦 Install Bun Dependencies
        run: bun install

      - name: 🧪 Unit Tests (Frontend/UI)
        run: bun run test
