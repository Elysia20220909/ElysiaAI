name: 🌸 Elysia OS Resonance Verification (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resonance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: ⚙️ Setup Environment (Python & Bun)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint (Python)
        run: |
          ruff check python tests/python tests/test_kernel.py

      - name: 🧪 Unit Tests (Python Kernel)
        run: |
          pytest tests/python tests/test_kernel.py

      - name: 📦 Install Bun Dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "::warning::No Bun lockfile found. Falling back to bun install"
            bun install
          fi

      - name: 🧪 Unit Tests (Frontend/UI)
        run: bun run test
