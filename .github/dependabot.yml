      day: "sunday"
      time: "04:00"
      timezone: "Asia/Tokyo"
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: "deps(pip)"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
