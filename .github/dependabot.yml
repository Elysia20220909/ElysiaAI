version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    allow:
      - dependency-type: "direct"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(npm)"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/packages/server"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:10"
      timezone: "Asia/Tokyo"
    allow:
      - dependency-type: "direct"
    groups:
      server-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(server)"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/packages/shared"
    schedule:
