name: Feature request
description: Suggest a focused improvement for ElysiaAI
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for focused feature requests. Keep the scope narrow and avoid including private data.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
      placeholder: Describe the user or maintainer pain clearly.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
      placeholder: Describe the smallest useful solution.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docs
        - CI / release
        - Security
        - Backend
        - Python kernel
        - Rust shield-agent
        - UI / desktop
        - RAG / memory
        - Integration
        - Unknown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?

  - type: textarea
    id: risks
    attributes:
      label: Risks and safety notes
      description: Mention privacy, secret handling, RAG safety, external actions, or rollback concerns.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This request has a narrow scope.
          required: true
        - label: This request does not include secrets or private RAG content.
          required: true
        - label: I considered whether documentation alone would solve the problem.
          required: false
