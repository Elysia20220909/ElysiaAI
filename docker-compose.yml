services:
  # --- [1] ElysiaAI Core Kernel ---
  app:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.production
    container_name: elysia-app
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    depends_on:
      - db
      - redis
    restart: always

  # --- [2] Database Layer ---
  db:
    image: postgres:15-alpine
    container_name: elysia-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # --- [3] Cache & Intelligence Bridge ---
  redis:
    image: redis:7-alpine
    container_name: elysia-redis
    restart: always

  # --- [4] Self-hosted X (Twitter) Bridge ---
  nitter:
    image: zedeus/nitter:latest
    container_name: elysia-nitter
    volumes:
      - ./deploy/nitter/nitter.conf:/src/nitter.conf:ro
#      - ./deploy/nitter/sessions.jsonl:/src/sessions.jsonl:ro
    depends_on:
      - nitter-redis
    restart: always

  nitter-redis:
    image: redis:6-alpine
    container_name: elysia-nitter-redis
    restart: always

  # --- [5] Sovereign Defense Monitor ---
  shield-agent:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.shield
    container_name: elysia-shield
    depends_on:
      - app
    volumes:
      - ./logs:/app/logs:ro
      - ./config/defense:/app/config/defense:rw
    restart: always

  # --- [6] Automation Monitor (Marathon) ---
  # Note: Runs as a sidecar to monitor posts
  marathon-monitor:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.production
    container_name: elysia-marathon-monitor
    entrypoint: ["python"]
    command: ["scripts/marathon_hook_monitor.py", "--loop"]
    depends_on:
      - nitter
    restart: on-failure
    environment:
      - NITTER_HOST=${NITTER_HOST}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - MARATHON_WEBHOOK_URL=${MARATHON_WEBHOOK_URL}
      - ABYSSAL_WEBHOOK_URL=${ABYSSAL_WEBHOOK_URL}
      - MARATHON_MONITOR_INTERVAL_SECONDS=${MARATHON_MONITOR_INTERVAL_SECONDS:-900}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data:rw

  # --- [7] Local Ollama Engine (Optional for container-only setups) ---
  # To use this, uncomment the service below and update OLLAMA_BASE_URL to http://elysia-ollama:11434
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: elysia-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: always

volumes:
  postgres_data:
  # ollama_data:
