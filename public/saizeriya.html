<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Saizeriya Custom Client</title>
		<style>
			:root {
				color-scheme: light;
				--background: #f5f5f7;
				--surface: rgba(255, 255, 255, 0.76);
				--surface-strong: rgba(255, 255, 255, 0.92);
				--line: rgba(0, 0, 0, 0.09);
				--line-strong: rgba(0, 0, 0, 0.15);
				--text: #1d1d1f;
				--muted: #6e6e73;
				--muted-2: #86868b;
				--blue: #0071e3;
				--blue-strong: #0066cc;
				--blue-soft: rgba(0, 113, 227, 0.1);
				--warning: #b26b00;
				--warning-bg: #fff7e6;
				--danger: #b42318;
				--danger-bg: #fff1f0;
				--radius-lg: 28px;
				--radius-md: 20px;
				--radius-sm: 14px;
				--shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
				font-family:
					-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
					"Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
				background: var(--background);
				color: var(--text);
			}

			* {
				box-sizing: border-box;
			}

			html {
				scroll-behavior: smooth;
			}

			body {
				min-width: 320px;
				margin: 0;
				background: var(--background);
				color: var(--text);
				letter-spacing: 0;
			}

			button,
			input {
				font: inherit;
			}

			button {
				appearance: none;
				border: 0;
				cursor: pointer;
			}

			button:focus-visible,
			input:focus-visible {
				outline: 3px solid rgba(0, 113, 227, 0.28);
				outline-offset: 2px;
			}

			.app {
				width: min(1440px, 100%);
				margin: 0 auto;
				padding: 28px;
			}

			.topbar {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 20px;
				align-items: end;
				margin-bottom: 18px;
			}

			.eyebrow {
				display: block;
				margin-bottom: 8px;
				color: var(--muted);
				font-size: 0.78rem;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			h1,
			h2,
			h3,
			p {
				margin: 0;
			}

			h1 {
				font-size: clamp(2.1rem, 4vw, 4.8rem);
				font-weight: 760;
				line-height: 1.02;
				letter-spacing: 0;
			}

			.lead {
				max-width: 680px;
				margin-top: 14px;
				color: var(--muted);
				font-size: 1rem;
				line-height: 1.7;
			}

			.status-pill {
				display: inline-flex;
				align-items: center;
				min-height: 36px;
				padding: 0 14px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.56);
				color: var(--muted);
				font-size: 0.86rem;
				font-weight: 650;
				backdrop-filter: blur(18px);
				white-space: nowrap;
			}

			.summary-dock {
				position: sticky;
				top: 12px;
				z-index: 20;
				display: grid;
				grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
				gap: 12px;
				align-items: center;
				margin-bottom: 22px;
				padding: 12px;
				border: 1px solid var(--line);
				border-radius: var(--radius-lg);
				background: rgba(255, 255, 255, 0.74);
				box-shadow: 0 12px 34px rgba(0, 0, 0, 0.07);
				backdrop-filter: blur(22px) saturate(1.2);
			}

			.metric {
				min-width: 0;
				padding: 10px 14px;
				border-radius: 20px;
				background: rgba(255, 255, 255, 0.68);
			}

			.metric span {
				display: block;
				color: var(--muted);
				font-size: 0.78rem;
				font-weight: 700;
			}

			.metric strong {
				display: block;
				margin-top: 3px;
				font-size: clamp(1.35rem, 2.5vw, 2.1rem);
				line-height: 1.05;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}

			.people-control {
				display: grid;
				grid-template-columns: 42px 78px 42px;
				align-items: center;
				gap: 8px;
				padding: 8px;
				border-radius: 22px;
				background: rgba(255, 255, 255, 0.72);
			}

			.icon-button {
				display: inline-grid;
				width: 42px;
				height: 42px;
				place-items: center;
				border: 1px solid var(--line);
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.76);
				color: var(--text);
				font-size: 1.22rem;
				font-weight: 720;
				line-height: 1;
			}

			.icon-button:hover {
				background: #fff;
				border-color: var(--line-strong);
			}

			.people-value {
				text-align: center;
				color: var(--muted);
				font-size: 0.78rem;
				font-weight: 700;
			}

			.people-value strong {
				display: block;
				color: var(--text);
				font-size: 1.18rem;
				line-height: 1.1;
				font-variant-numeric: tabular-nums;
			}

			.shell {
				display: grid;
				grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
				gap: 22px;
				align-items: start;
			}

			.stack {
				display: grid;
				gap: 20px;
			}

			.surface {
				border: 1px solid var(--line);
				border-radius: var(--radius-lg);
				background: var(--surface);
				box-shadow: var(--shadow);
				backdrop-filter: blur(22px) saturate(1.16);
			}

			.toolbar {
				display: grid;
				gap: 16px;
				padding: 18px;
			}

			.search-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 12px;
				align-items: center;
			}

			.search-box {
				position: relative;
				display: flex;
				align-items: center;
				min-height: 52px;
				padding: 0 14px;
				border: 1px solid var(--line);
				border-radius: 18px;
				background: rgba(255, 255, 255, 0.82);
			}

			.search-symbol {
				margin-right: 10px;
				color: var(--muted-2);
				font-size: 1rem;
			}

			.search-box input {
				width: 100%;
				min-width: 0;
				border: 0;
				background: transparent;
				color: var(--text);
				font-size: 1rem;
			}

			.search-box input::placeholder {
				color: var(--muted-2);
			}

			.clear-search {
				display: none;
				width: 30px;
				height: 30px;
				place-items: center;
				border-radius: 50%;
				background: #e8e8ed;
				color: var(--muted);
				font-weight: 760;
			}

			.clear-search.is-visible {
				display: grid;
			}

			.toggle {
				display: inline-flex;
				align-items: center;
				min-height: 48px;
				gap: 10px;
				padding: 0 14px;
				border: 1px solid var(--line);
				border-radius: 18px;
				background: rgba(255, 255, 255, 0.72);
				color: var(--muted);
				font-size: 0.9rem;
				font-weight: 680;
				white-space: nowrap;
			}

			.toggle-indicator {
				position: relative;
				width: 40px;
				height: 24px;
				border-radius: 999px;
				background: #d2d2d7;
				transition: background 0.2s ease;
			}

			.toggle-indicator::after {
				position: absolute;
				top: 3px;
				left: 3px;
				width: 18px;
				height: 18px;
				border-radius: 50%;
				background: #fff;
				box-shadow: 0 2px 7px rgba(0, 0, 0, 0.22);
				content: "";
				transition: transform 0.2s ease;
			}

			.toggle[aria-pressed="true"] .toggle-indicator {
				background: var(--blue);
			}

			.toggle[aria-pressed="true"] .toggle-indicator::after {
				transform: translateX(16px);
			}

			.segmented {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				padding: 6px;
				border: 1px solid var(--line);
				border-radius: 18px;
				background: rgba(242, 242, 247, 0.72);
				overflow: visible;
			}

			.segmented button {
				flex: 1 1 78px;
				min-height: 38px;
				padding: 0 12px;
				border-radius: 13px;
				background: transparent;
				color: var(--muted);
				font-size: 0.86rem;
				font-weight: 700;
				white-space: nowrap;
			}

			.segmented button[aria-pressed="true"] {
				background: #fff;
				color: var(--text);
				box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
			}

			.error-region {
				display: none;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 12px;
				align-items: center;
				padding: 14px;
				border: 1px solid rgba(180, 35, 24, 0.16);
				border-radius: 18px;
				background: var(--danger-bg);
				color: var(--danger);
			}

			.error-region.is-visible {
				display: grid;
			}

			.error-region strong {
				display: block;
				margin-bottom: 2px;
				font-size: 0.95rem;
			}

			.error-region p {
				color: #7a271a;
				font-size: 0.9rem;
				line-height: 1.5;
			}

			.recommendation {
				display: grid;
				gap: 16px;
				padding: 20px;
			}

			.section-head {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 14px;
				align-items: end;
			}

			.section-head h2 {
				font-size: 1.28rem;
				font-weight: 760;
				line-height: 1.2;
			}

			.section-head p,
			.count-label {
				color: var(--muted);
				font-size: 0.9rem;
				line-height: 1.5;
			}

			.budget-row {
				display: grid;
				grid-template-columns: minmax(160px, 220px) minmax(0, 1fr) auto;
				gap: 12px;
				align-items: center;
			}

			.input-field {
				display: grid;
				gap: 6px;
			}

			.input-field span {
				color: var(--muted);
				font-size: 0.78rem;
				font-weight: 700;
			}

			.input-field input {
				width: 100%;
				min-height: 44px;
				padding: 0 13px;
				border: 1px solid var(--line);
				border-radius: 15px;
				background: rgba(255, 255, 255, 0.82);
				color: var(--text);
				font-variant-numeric: tabular-nums;
			}

			.primary-button,
			.secondary-button,
			.ghost-button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 42px;
				padding: 0 16px;
				border-radius: 999px;
				font-size: 0.9rem;
				font-weight: 720;
				white-space: nowrap;
			}

			.primary-button {
				background: var(--blue);
				color: #fff;
				box-shadow: 0 8px 20px rgba(0, 113, 227, 0.18);
			}

			.primary-button:hover {
				background: var(--blue-strong);
			}

			.secondary-button {
				border: 1px solid rgba(0, 113, 227, 0.24);
				background: var(--blue-soft);
				color: var(--blue-strong);
			}

			.ghost-button {
				border: 1px solid var(--line);
				background: rgba(255, 255, 255, 0.66);
				color: var(--text);
			}

			.combo-panel {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 14px;
				align-items: center;
				padding-top: 2px;
			}

			.combo-list {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
			}

			.combo-chip {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				max-width: 100%;
				min-height: 36px;
				padding: 0 12px;
				border: 1px solid var(--line);
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.68);
				color: var(--text);
				font-size: 0.86rem;
				font-weight: 650;
			}

			.combo-chip span {
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}

			.combo-total {
				display: grid;
				gap: 3px;
				min-width: 110px;
				text-align: right;
				font-variant-numeric: tabular-nums;
			}

			.combo-total span {
				color: var(--muted);
				font-size: 0.78rem;
				font-weight: 700;
			}

			.combo-total strong {
				font-size: 1.15rem;
			}

			.menu-section {
				display: grid;
				gap: 14px;
			}

			.menu-grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 14px;
			}

			.item-card {
				display: grid;
				min-height: 184px;
				padding: 18px;
				border: 1px solid var(--line);
				border-radius: var(--radius-md);
				background: rgba(255, 255, 255, 0.74);
				box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
				text-align: left;
			}

			.item-card:hover {
				border-color: rgba(0, 113, 227, 0.24);
				box-shadow: 0 16px 34px rgba(0, 0, 0, 0.08);
				transform: translateY(-1px);
			}

			.item-main {
				display: grid;
				gap: 10px;
			}

			.item-top {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 12px;
				align-items: start;
			}

			.item-name {
				font-size: 1.08rem;
				font-weight: 760;
				line-height: 1.35;
			}

			.price {
				color: var(--text);
				font-weight: 760;
				font-variant-numeric: tabular-nums;
				text-align: right;
				white-space: nowrap;
			}

			.meta-row {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}

			.badge {
				display: inline-flex;
				align-items: center;
				min-height: 25px;
				padding: 0 9px;
				border-radius: 999px;
				background: #f2f2f7;
				color: var(--muted);
				font-size: 0.76rem;
				font-weight: 700;
			}

			.badge.warning {
				background: var(--warning-bg);
				color: var(--warning);
			}

			.item-note {
				color: var(--muted);
				font-size: 0.87rem;
				line-height: 1.5;
			}

			.item-actions {
				display: flex;
				justify-content: space-between;
				gap: 10px;
				align-items: end;
				margin-top: 18px;
			}

			.detail-link {
				color: var(--blue-strong);
				background: transparent;
				font-size: 0.9rem;
				font-weight: 720;
			}

			.cart-panel {
				position: sticky;
				top: 128px;
				display: grid;
				gap: 16px;
				padding: 20px;
			}

			.cart-list {
				display: grid;
				gap: 10px;
			}

			.cart-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 12px;
				align-items: center;
				padding: 12px 0;
				border-bottom: 1px solid var(--line);
			}

			.cart-row:last-child {
				border-bottom: 0;
			}

			.cart-row h3 {
				font-size: 0.95rem;
				font-weight: 760;
				line-height: 1.35;
			}

			.cart-row p {
				margin-top: 4px;
				color: var(--muted);
				font-size: 0.82rem;
				font-variant-numeric: tabular-nums;
			}

			.cart-price {
				text-align: right;
				font-weight: 760;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}

			.qty-row {
				display: inline-grid;
				grid-template-columns: 34px 34px 34px;
				gap: 5px;
				align-items: center;
				justify-content: end;
				margin-top: 8px;
			}

			.qty-button {
				display: grid;
				width: 34px;
				height: 34px;
				place-items: center;
				border: 1px solid var(--line);
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.76);
				color: var(--text);
				font-weight: 760;
			}

			.qty-value {
				text-align: center;
				color: var(--muted);
				font-size: 0.9rem;
				font-weight: 720;
				font-variant-numeric: tabular-nums;
			}

			.empty-state {
				display: grid;
				gap: 10px;
				padding: 22px;
				border: 1px dashed var(--line-strong);
				border-radius: var(--radius-md);
				background: rgba(255, 255, 255, 0.48);
				color: var(--muted);
				line-height: 1.6;
			}

			.cart-footer {
				display: grid;
				gap: 10px;
				padding-top: 4px;
			}

			.footer-row {
				display: grid;
				grid-template-columns: 1fr auto;
				gap: 12px;
				color: var(--muted);
				font-size: 0.92rem;
			}

			.footer-row strong {
				color: var(--text);
				font-variant-numeric: tabular-nums;
				text-align: right;
			}

			.footer-row.total {
				padding-top: 10px;
				border-top: 1px solid var(--line);
				color: var(--text);
				font-size: 1.02rem;
				font-weight: 760;
			}

			.modal {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: none;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: rgba(245, 245, 247, 0.62);
				backdrop-filter: blur(18px);
			}

			.modal.is-open {
				display: flex;
			}

			.detail-panel {
				width: min(520px, 100%);
				max-height: min(720px, 88vh);
				overflow: auto;
				padding: 22px;
				border: 1px solid var(--line);
				border-radius: 30px;
				background: var(--surface-strong);
				box-shadow: 0 30px 90px rgba(0, 0, 0, 0.16);
			}

			.detail-head {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 14px;
				align-items: start;
				margin-bottom: 18px;
			}

			.detail-head h2 {
				margin-top: 8px;
				font-size: clamp(1.5rem, 4vw, 2.2rem);
				line-height: 1.15;
			}

			.detail-price {
				margin: 18px 0;
				padding: 16px;
				border: 1px solid var(--line);
				border-radius: 20px;
				background: rgba(255, 255, 255, 0.68);
				text-align: right;
				font-size: 1.8rem;
				font-weight: 780;
				font-variant-numeric: tabular-nums;
			}

			.detail-copy {
				color: var(--muted);
				line-height: 1.7;
			}

			.detail-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				margin-top: 20px;
			}

			.toast {
				position: fixed;
				right: 24px;
				bottom: 24px;
				z-index: 70;
				display: none;
				max-width: min(380px, calc(100vw - 48px));
				padding: 14px 16px;
				border: 1px solid var(--line);
				border-radius: 18px;
				background: rgba(29, 29, 31, 0.92);
				color: #fff;
				box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
				backdrop-filter: blur(18px);
				line-height: 1.5;
			}

			.toast.is-visible {
				display: block;
			}

			@media (max-width: 1180px) {
				.shell {
					grid-template-columns: 1fr;
				}

				.cart-panel {
					position: static;
				}
			}

			@media (max-width: 820px) {
				.app {
					padding: 18px 14px 96px;
				}

				.topbar {
					grid-template-columns: 1fr;
					align-items: start;
				}

				h1 {
					font-size: 2.35rem;
				}

				.summary-dock {
					top: 8px;
					grid-template-columns: 1fr 1fr;
					border-radius: 24px;
				}

				.people-control {
					grid-column: 1 / -1;
				}

				.search-row,
				.budget-row,
				.combo-panel,
				.section-head,
				.error-region {
					grid-template-columns: 1fr;
				}

				.segmented {
					flex-wrap: nowrap;
					overflow-x: auto;
					scrollbar-width: none;
				}

				.segmented::-webkit-scrollbar {
					display: none;
				}

				.segmented button {
					flex: 0 0 auto;
					min-width: 92px;
				}

				.menu-grid {
					grid-template-columns: 1fr;
				}

				.item-card {
					min-height: 0;
				}

				.combo-total {
					text-align: left;
				}
			}

			@media (max-width: 480px) {
				.app {
					padding-inline: 10px;
				}

				.summary-dock {
					padding: 9px;
				}

				.metric {
					padding: 9px 10px;
				}

				.metric strong {
					font-size: 1.28rem;
				}

				.toolbar,
				.recommendation,
				.cart-panel {
					padding: 14px;
					border-radius: 24px;
				}

				.item-actions,
				.detail-actions {
					align-items: stretch;
					flex-direction: column;
				}

				.primary-button,
				.secondary-button,
				.ghost-button {
					width: 100%;
				}

				.modal {
					align-items: flex-end;
					padding: 10px;
				}

				.detail-panel {
					max-height: 86vh;
					border-radius: 28px;
				}
			}

			@media (prefers-reduced-motion: no-preference) {
				.item-card,
				.primary-button,
				.secondary-button,
				.ghost-button,
				.icon-button,
				.qty-button {
					transition:
						background 0.18s ease,
						border-color 0.18s ease,
						box-shadow 0.18s ease,
						transform 0.18s ease;
				}
			}
		</style>
	</head>
	<body>
		<div class="app">
			<header class="topbar">
				<div>
					<span class="eyebrow">Saizeriya Custom</span>
					<h1>静かに選べる、サイゼリヤ注文メモ</h1>
					<p class="lead">
						メニューを探し、人数で割り、ほどよい組み合わせを決めるためのローカルUIです。
					</p>
				</div>
				<span class="status-pill" id="cartStatus">カート 0点</span>
			</header>

			<section class="summary-dock" aria-label="会計サマリー">
				<div class="metric">
					<span>合計</span>
					<strong id="summaryTotal">0円</strong>
				</div>
				<div class="metric">
					<span>1人あたり</span>
					<strong id="summaryPerPerson">0円</strong>
				</div>
				<div class="people-control" aria-label="人数調整">
					<button class="icon-button" type="button" data-action="people-down" aria-label="人数を減らす">−</button>
					<div class="people-value">
						<span>人数</span>
						<strong id="peopleValue">2</strong>
					</div>
					<button class="icon-button" type="button" data-action="people-up" aria-label="人数を増やす">＋</button>
				</div>
			</section>

			<main class="shell">
				<div class="stack">
					<section class="toolbar surface" aria-label="メニュー検索">
						<div class="search-row">
							<label class="search-box" for="searchInput">
								<span class="search-symbol" aria-hidden="true">⌕</span>
								<input
									id="searchInput"
									type="search"
									autocomplete="off"
									placeholder="ドリア、辛味、2101 など"
								/>
								<button class="clear-search" type="button" data-action="clear-search" aria-label="検索を消す">×</button>
							</label>
							<button class="toggle" type="button" id="includeCheckToggle" data-action="toggle-check" aria-pressed="false">
								<span class="toggle-indicator" aria-hidden="true"></span>
								<span>店舗確認も表示</span>
							</button>
						</div>
						<div class="segmented" id="categoryTabs" aria-label="カテゴリ"></div>
						<div class="error-region" id="errorRegion" role="status" aria-live="polite"></div>
					</section>

					<section class="recommendation surface" aria-label="おすすめセット">
						<div class="section-head">
							<div>
								<h2>おすすめセット</h2>
								<p>人数と予算に合わせて、主食を中心に組み合わせます。</p>
							</div>
							<button class="secondary-button" type="button" data-action="add-combo">セットを追加</button>
						</div>
						<div class="budget-row">
							<label class="input-field" for="budgetInput">
								<span>予算</span>
								<input id="budgetInput" type="number" inputmode="numeric" min="100" step="100" value="1000" />
							</label>
							<div class="combo-list" id="comboList"></div>
							<div class="combo-total">
								<span>セット合計</span>
								<strong id="comboTotal">0円</strong>
								<span id="comboPerPerson">1人 0円</span>
							</div>
						</div>
					</section>

					<section class="menu-section" aria-label="メニュー一覧">
						<div class="section-head">
							<div>
								<h2>メニュー一覧</h2>
								<p>価格は右側に揃え、迷わず比較できるようにしています。</p>
							</div>
							<span class="count-label" id="resultCount">0件</span>
						</div>
						<div class="menu-grid" id="menuGrid"></div>
					</section>
				</div>

				<aside class="cart-panel surface" aria-label="カート">
					<div class="section-head">
						<div>
							<h2>カート</h2>
							<p>合計と人数割りは画面上部にも固定表示されます。</p>
						</div>
						<button class="ghost-button" type="button" data-action="clear-cart">空にする</button>
					</div>
					<div class="cart-list" id="cartList"></div>
					<div class="cart-footer">
						<div class="footer-row">
							<span>商品数</span>
							<strong id="footerCount">0点</strong>
						</div>
						<div class="footer-row">
							<span>1人あたり</span>
							<strong id="footerPerPerson">0円</strong>
						</div>
						<div class="footer-row total">
							<span>合計</span>
							<strong id="footerTotal">0円</strong>
						</div>
					</div>
				</aside>
			</main>
		</div>

		<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
			<div class="detail-panel" id="detailPanel"></div>
		</div>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script>
			const menu = [
				{ code: "2101", name: "ミラノ風ドリア", category: "doria", priceYen: 300, tags: ["popular", "rice", "classic", "main"], aliases: ["ドリア", "ミラノ"] },
				{ code: "1202", name: "小エビのサラダ", category: "salad", priceYen: 350, tags: ["popular", "seafood", "fresh"], aliases: ["小エビ", "サラダ"] },
				{ code: "1401", name: "辛味チキン", category: "starter", priceYen: 300, tags: ["popular", "chicken", "share", "spicy"], aliases: ["辛味", "チキン"] },
				{ code: "2203", name: "バッファローモッツァレラのマルゲリータピザ", category: "pizza", priceYen: 400, tags: ["popular", "cheese", "main", "share"], aliases: ["マルゲリータ", "ピザ"] },
				{ code: "2402", name: "若鶏のディアボラ風", category: "meat", priceYen: 500, tags: ["popular", "chicken", "main"], aliases: ["ディアボラ", "若鶏"], availability: "check-store", note: "チキン系は店舗や時期で販売状況の確認がおすすめです" },
				{ code: "1307", name: "たまねぎのズッパ", category: "soup", priceYen: 300, tags: ["popular", "warm", "starter"], aliases: ["ズッパ", "たまねぎ"] },
				{ code: "2301", name: "タラコソースシシリー風", category: "pasta", priceYen: 400, tags: ["popular", "seafood", "main"], aliases: ["タラコ", "シシリー"] },
				{ code: "2406", name: "ハンバーグステーキ", category: "meat", priceYen: 400, tags: ["popular", "beef", "main"], aliases: ["ハンバーグ"] },
				{ code: "1403", name: "ほうれん草のソテー", category: "starter", priceYen: 200, tags: ["popular", "vegetable", "starter"], aliases: ["ほうれん草", "ソテー"] },
				{ code: "2303", name: "ペペロンチーノ", category: "pasta", priceYen: 300, tags: ["popular", "garlic", "main", "spicy"], aliases: ["ペペ", "ペペロン"] },
				{ code: "3206", name: "イタリアンプリン", category: "dessert", priceYen: 250, tags: ["popular", "dessert", "sweet"], aliases: ["プリン"] },
				{ code: "5101", name: "セットドリンクバー", category: "drink", priceYen: 200, tags: ["popular", "drink", "set"], aliases: ["ドリンクバー", "ドリバー"] },
				{ code: "1405", name: "エスカルゴのオーブン焼き", category: "starter", priceYen: 400, tags: ["signature", "share", "wine"], aliases: ["エスカルゴ"] },
				{ code: "2328", name: "イカの墨入りセピアソース", category: "pasta", priceYen: 500, tags: ["signature", "seafood", "main", "wine"], aliases: ["イカ墨", "セピア"] },
				{ code: "1425", name: "柔らか青豆の温サラダ", category: "starter", priceYen: 200, tags: ["signature", "vegetable", "warm"], aliases: ["青豆", "温サラダ"] },
				{ code: "2305", name: "カルボナーラ", category: "pasta", priceYen: 500, tags: ["signature", "main", "cheese"], aliases: ["カルボ"] },
				{ code: "3201", name: "ティラミス クラシコ", category: "dessert", priceYen: 300, tags: ["signature", "dessert", "sweet"], aliases: ["ティラミス"] },
				{ code: "3401", name: "グラスワイン 赤", category: "wine", priceYen: 100, tags: ["wine", "drink"], aliases: ["赤ワイン", "グラス赤"] },
				{ code: "3402", name: "グラスワイン 白", category: "wine", priceYen: 100, tags: ["wine", "drink"], aliases: ["白ワイン", "グラス白"] },
				{ code: "3413", name: "ドンラファエロ", category: "wine", priceYen: 1100, tags: ["wine", "bottle", "share"], aliases: ["発泡", "スパークリング"] },
			];

			const categories = [
				["all", "すべて"],
				["starter", "前菜"],
				["salad", "サラダ"],
				["soup", "スープ"],
				["pizza", "ピザ"],
				["doria", "ドリア"],
				["pasta", "パスタ"],
				["meat", "肉料理"],
				["dessert", "デザート"],
				["drink", "ドリンク"],
				["wine", "ワイン"],
			];
			const categoryLabel = Object.fromEntries(categories);
			const mainCategories = new Set(["doria", "pizza", "pasta", "meat"]);
			const storageKey = "elysia.saizeriya.client.cart";
			const peopleKey = "elysia.saizeriya.client.people";

			const state = {
				query: "",
				category: "all",
				includeCheckStore: false,
				budgetYen: 1000,
				people: readNumber(peopleKey, 2),
				cart: readCart(),
				combo: null,
				selectedCode: null,
			};

			const els = {
				categoryTabs: document.getElementById("categoryTabs"),
				searchInput: document.getElementById("searchInput"),
				clearSearch: document.querySelector(".clear-search"),
				includeCheckToggle: document.getElementById("includeCheckToggle"),
				errorRegion: document.getElementById("errorRegion"),
				budgetInput: document.getElementById("budgetInput"),
				comboList: document.getElementById("comboList"),
				comboTotal: document.getElementById("comboTotal"),
				comboPerPerson: document.getElementById("comboPerPerson"),
				menuGrid: document.getElementById("menuGrid"),
				resultCount: document.getElementById("resultCount"),
				cartList: document.getElementById("cartList"),
				cartStatus: document.getElementById("cartStatus"),
				summaryTotal: document.getElementById("summaryTotal"),
				summaryPerPerson: document.getElementById("summaryPerPerson"),
				peopleValue: document.getElementById("peopleValue"),
				footerCount: document.getElementById("footerCount"),
				footerPerPerson: document.getElementById("footerPerPerson"),
				footerTotal: document.getElementById("footerTotal"),
				detailModal: document.getElementById("detailModal"),
				detailPanel: document.getElementById("detailPanel"),
				toast: document.getElementById("toast"),
			};

			function normalizeText(value) {
				return String(value).normalize("NFKC").toLowerCase().replace(/\s+/g, "");
			}

			function yen(value) {
				return `${Number(value).toLocaleString("ja-JP")}円`;
			}

			function readNumber(key, fallback) {
				const value = Number(localStorage.getItem(key));
				return Number.isFinite(value) && value > 0 ? value : fallback;
			}

			function readCart() {
				try {
					const parsed = JSON.parse(localStorage.getItem(storageKey) || "[]");
					if (!Array.isArray(parsed)) return [];
					return parsed
						.filter((line) => getItem(line.code))
						.map((line) => ({
							code: String(line.code),
							quantity: Math.max(1, Math.floor(Number(line.quantity) || 1)),
						}));
				} catch {
					return [];
				}
			}

			function saveCart() {
				try {
					localStorage.setItem(storageKey, JSON.stringify(state.cart));
				} catch {
					showError(
						"保存できませんでした",
						"ブラウザの保存領域が使えません。今の画面は操作できますが、再読み込み前に内容を控えてください。",
						"了解",
						clearError,
					);
				}
			}

			function savePeople() {
				localStorage.setItem(peopleKey, String(state.people));
			}

			function getItem(code) {
				return menu.find((item) => item.code === String(code));
			}

			function filterMenu() {
				const query = normalizeText(state.query);
				return menu
					.filter((item) => state.category === "all" || item.category === state.category)
					.filter((item) => state.includeCheckStore || (item.availability || "regular") === "regular")
					.filter((item) => {
						if (!query) return true;
						const haystack = [
							item.code,
							item.name,
							item.category,
							...item.tags,
							...(item.aliases || []),
						].map(normalizeText).join(" ");
						return haystack.includes(query);
					})
					.sort((left, right) => left.priceYen - right.priceYen);
			}

			function summarizeCart() {
				const rows = state.cart.flatMap((line) => {
					const item = getItem(line.code);
					if (!item) return [];
					return [{ item, quantity: line.quantity, subtotalYen: item.priceYen * line.quantity }];
				});
				const totalYen = rows.reduce((sum, row) => sum + row.subtotalYen, 0);
				return {
					rows,
					totalYen,
					totalQuantity: rows.reduce((sum, row) => sum + row.quantity, 0),
					perPersonYen: Math.ceil(totalYen / Math.max(1, state.people)),
				};
			}

			function buildMainSets(items, people, startIndex = 0, current = [], results = []) {
				if (current.length === people) {
					results.push([...current]);
					return results;
				}
				for (let index = startIndex; index < items.length; index += 1) {
					current.push(items[index]);
					buildMainSets(items, people, index, current, results);
					current.pop();
				}
				return results;
			}

			function buildSideSets(items) {
				const sideSets = [[]];
				for (const item of items) sideSets.push([item]);
				for (let left = 0; left < items.length; left += 1) {
					for (let right = left + 1; right < items.length; right += 1) {
						sideSets.push([items[left], items[right]]);
					}
				}
				return sideSets;
			}

			function suggestCombo() {
				const usable = menu.filter((item) => state.includeCheckStore || (item.availability || "regular") === "regular");
				const mains = usable.filter((item) => mainCategories.has(item.category));
				const sides = usable.filter((item) => !mainCategories.has(item.category));
				const mainSets = buildMainSets(mains, Math.max(1, state.people));
				const sideSets = buildSideSets(sides);
				let best = null;
				for (const mainSet of mainSets) {
					for (const sideSet of sideSets) {
						const items = [...mainSet, ...sideSet];
						const totalYen = items.reduce((sum, item) => sum + item.priceYen, 0);
						if (totalYen > state.budgetYen) continue;
						const categoriesCount = new Set(items.map((item) => item.category)).size;
						const popular = items.filter((item) => item.tags.includes("popular")).length;
						const score = totalYen + categoriesCount * 35 + popular * 20 + sideSet.length * 15;
						if (!best || score > best.score) best = { items, totalYen, score };
					}
				}
				return best ? {
					items: best.items,
					totalYen: best.totalYen,
					perPersonYen: Math.ceil(best.totalYen / Math.max(1, state.people)),
				} : { items: [], totalYen: 0, perPersonYen: 0 };
			}

			function addToCart(code, quantity = 1) {
				const item = getItem(code);
				if (!item) {
					showError("追加できませんでした", "メニューが見つかりません。検索条件をリセットして、もう一度選んでください。", "条件をリセット", resetFilters);
					return;
				}
				const existing = state.cart.find((line) => line.code === item.code);
				if (existing) existing.quantity += Math.max(1, quantity);
				else state.cart.push({ code: item.code, quantity: Math.max(1, quantity) });
				saveCart();
				render();
				showToast(`${item.name}を追加しました`);
			}

			function changeQuantity(code, delta) {
				state.cart = state.cart
					.map((line) => line.code === code ? { ...line, quantity: line.quantity + delta } : line)
					.filter((line) => line.quantity > 0);
				saveCart();
				render();
			}

			function clearCart() {
				state.cart = [];
				saveCart();
				render();
				showToast("カートを空にしました");
			}

			function resetFilters() {
				state.query = "";
				state.category = "all";
				state.includeCheckStore = false;
				els.searchInput.value = "";
				clearError();
				render();
			}

			function showError(title, message, actionLabel, action) {
				els.errorRegion.classList.add("is-visible");
				els.errorRegion.innerHTML = `
					<div>
						<strong>${title}</strong>
						<p>${message}</p>
					</div>
					<button class="secondary-button" type="button" data-error-action>${actionLabel}</button>
				`;
				els.errorRegion.querySelector("[data-error-action]").addEventListener("click", action);
			}

			function clearError() {
				els.errorRegion.classList.remove("is-visible");
				els.errorRegion.innerHTML = "";
			}

			let toastTimer = 0;
			function showToast(message) {
				clearTimeout(toastTimer);
				els.toast.textContent = message;
				els.toast.classList.add("is-visible");
				toastTimer = window.setTimeout(() => els.toast.classList.remove("is-visible"), 1800);
			}

			function renderCategories() {
				els.categoryTabs.innerHTML = categories.map(([id, label]) => `
					<button type="button" data-category="${id}" aria-pressed="${state.category === id}">
						${label}
					</button>
				`).join("");
			}

			function renderCombo() {
				state.combo = suggestCombo();
				if (state.combo.items.length === 0) {
					els.comboList.innerHTML = `
						<div class="empty-state">
							<strong>予算内のセットが見つかりません</strong>
							<span>予算を100円上げるか、人数を減らすと候補が戻ります。</span>
							<button class="secondary-button" type="button" data-action="raise-budget">予算を上げる</button>
						</div>
					`;
					els.comboTotal.textContent = yen(0);
					els.comboPerPerson.textContent = `1人 ${yen(0)}`;
					return;
				}
				els.comboList.innerHTML = state.combo.items.map((item) => `
					<button class="combo-chip" type="button" data-action="detail" data-code="${item.code}">
						${item.name}
						<span>${yen(item.priceYen)}</span>
					</button>
				`).join("");
				els.comboTotal.textContent = yen(state.combo.totalYen);
				els.comboPerPerson.textContent = `1人 ${yen(state.combo.perPersonYen)}`;
			}

			function renderMenu() {
				const items = filterMenu();
				els.resultCount.textContent = `${items.length}件`;
				els.clearSearch.classList.toggle("is-visible", Boolean(state.query));
				if (items.length === 0) {
					els.menuGrid.innerHTML = `
						<div class="empty-state">
							<strong>該当するメニューがありません</strong>
							<span>検索語を短くするか、カテゴリを「すべて」に戻してください。</span>
							<button class="secondary-button" type="button" data-action="reset-filters">条件をリセット</button>
						</div>
					`;
					showError("候補がありません", "検索条件を少し緩めると見つかりやすくなります。", "条件をリセット", resetFilters);
					return;
				}
				if (els.errorRegion.classList.contains("is-visible")) clearError();
				els.menuGrid.innerHTML = items.map((item) => `
					<article class="item-card">
						<div class="item-main">
							<div class="item-top">
								<div>
									<h3 class="item-name">${item.name}</h3>
									<div class="meta-row">
										<span class="badge">${categoryLabel[item.category]}</span>
										${item.tags.slice(0, 2).map((tag) => `<span class="badge">${tag}</span>`).join("")}
										${item.availability === "check-store" ? `<span class="badge warning">店舗確認</span>` : ""}
									</div>
								</div>
								<div class="price">${yen(item.priceYen)}</div>
							</div>
							${item.note ? `<p class="item-note">${item.note}</p>` : `<p class="item-note">${item.aliases?.slice(0, 2).join(" / ") || "定番メニュー"}</p>`}
						</div>
						<div class="item-actions">
							<button class="detail-link" type="button" data-action="detail" data-code="${item.code}">詳細</button>
							<button class="primary-button" type="button" data-action="add" data-code="${item.code}">追加</button>
						</div>
					</article>
				`).join("");
			}

			function renderCart() {
				const summary = summarizeCart();
				els.summaryTotal.textContent = yen(summary.totalYen);
				els.summaryPerPerson.textContent = yen(summary.perPersonYen);
				els.peopleValue.textContent = state.people;
				els.cartStatus.textContent = `カート ${summary.totalQuantity}点`;
				els.footerCount.textContent = `${summary.totalQuantity}点`;
				els.footerPerPerson.textContent = yen(summary.perPersonYen);
				els.footerTotal.textContent = yen(summary.totalYen);
				if (summary.rows.length === 0) {
					els.cartList.innerHTML = `
						<div class="empty-state">
							<strong>カートは空です</strong>
							<span>メニュー一覧から「追加」を押すと、合計と人数割りがすぐ更新されます。</span>
						</div>
					`;
					return;
				}
				els.cartList.innerHTML = summary.rows.map((row) => `
					<div class="cart-row">
						<div>
							<h3>${row.item.name}</h3>
							<p>${yen(row.item.priceYen)} × ${row.quantity}</p>
							<div class="qty-row" aria-label="${row.item.name}の数量">
								<button class="qty-button" type="button" data-action="qty-down" data-code="${row.item.code}" aria-label="数量を減らす">−</button>
								<span class="qty-value">${row.quantity}</span>
								<button class="qty-button" type="button" data-action="qty-up" data-code="${row.item.code}" aria-label="数量を増やす">＋</button>
							</div>
						</div>
						<div class="cart-price">${yen(row.subtotalYen)}</div>
					</div>
				`).join("");
			}

			function renderDetail() {
				const item = getItem(state.selectedCode);
				if (!item) {
					els.detailModal.classList.remove("is-open");
					return;
				}
				const nextAction = item.availability === "check-store"
					? "店舗で販売状況を確認してから追加すると安心です。"
					: "問題なければこのままカートに追加できます。";
				els.detailPanel.innerHTML = `
					<div class="detail-head">
						<div>
							<span class="eyebrow">${item.code} / ${categoryLabel[item.category]}</span>
							<h2 id="detailTitle">${item.name}</h2>
						</div>
						<button class="icon-button" type="button" data-action="close-detail" aria-label="閉じる">×</button>
					</div>
					<div class="meta-row">
						${item.tags.map((tag) => `<span class="badge">${tag}</span>`).join("")}
						${item.availability === "check-store" ? `<span class="badge warning">店舗確認</span>` : ""}
					</div>
					<div class="detail-price">${yen(item.priceYen)}</div>
					<p class="detail-copy">${item.note || "サイゼリヤらしい定番候補です。ほかの一皿と合わせても、単品でも扱いやすい価格です。"}</p>
					<p class="detail-copy">${nextAction}</p>
					<div class="detail-actions">
						<button class="primary-button" type="button" data-action="add" data-code="${item.code}">カートに追加</button>
						<button class="ghost-button" type="button" data-action="close-detail">閉じる</button>
					</div>
				`;
				els.detailModal.classList.add("is-open");
			}

			function render() {
				renderCategories();
				els.includeCheckToggle.setAttribute("aria-pressed", String(state.includeCheckStore));
				els.budgetInput.value = String(state.budgetYen);
				renderCombo();
				renderMenu();
				renderCart();
				renderDetail();
			}

			document.addEventListener("click", (event) => {
				const categoryButton = event.target.closest("[data-category]");
				if (categoryButton) {
					state.category = categoryButton.dataset.category;
					render();
					return;
				}
				const actionEl = event.target.closest("[data-action]");
				if (!actionEl) return;
				const action = actionEl.dataset.action;
				const code = actionEl.dataset.code;
				if (action === "add") addToCart(code);
				if (action === "detail") {
					state.selectedCode = code;
					renderDetail();
				}
				if (action === "close-detail") {
					state.selectedCode = null;
					renderDetail();
				}
				if (action === "qty-up") changeQuantity(code, 1);
				if (action === "qty-down") changeQuantity(code, -1);
				if (action === "clear-cart") clearCart();
				if (action === "clear-search") {
					state.query = "";
					els.searchInput.value = "";
					render();
				}
				if (action === "toggle-check") {
					state.includeCheckStore = !state.includeCheckStore;
					render();
				}
				if (action === "people-up") {
					state.people = Math.min(20, state.people + 1);
					savePeople();
					render();
				}
				if (action === "people-down") {
					state.people = Math.max(1, state.people - 1);
					savePeople();
					render();
				}
				if (action === "add-combo") {
					if (!state.combo || state.combo.items.length === 0) {
						showError("セットを追加できません", "予算を上げてから、もう一度「セットを追加」を押してください。", "予算を上げる", () => {
							state.budgetYen += 100;
							render();
						});
						return;
					}
					for (const item of state.combo.items) addToCart(item.code);
					showToast("おすすめセットを追加しました");
				}
				if (action === "raise-budget") {
					state.budgetYen += 100;
					render();
				}
				if (action === "reset-filters") resetFilters();
			});

			els.searchInput.addEventListener("input", (event) => {
				state.query = event.target.value;
				render();
			});

			els.budgetInput.addEventListener("input", (event) => {
				const next = Number(event.target.value);
				state.budgetYen = Number.isFinite(next) ? Math.max(100, Math.floor(next)) : 1000;
				renderCombo();
			});

			els.detailModal.addEventListener("click", (event) => {
				if (event.target === els.detailModal) {
					state.selectedCode = null;
					renderDetail();
				}
			});

			document.addEventListener("keydown", (event) => {
				if (event.key === "Escape" && els.detailModal.classList.contains("is-open")) {
					state.selectedCode = null;
					renderDetail();
				}
			});

			render();
		</script>
	</body>
</html>
