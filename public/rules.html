<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ElysiaAI ルール管理</title>
		<style>
			:root {
				color-scheme: light;
				--ink: #172033;
				--muted: #5e6978;
				--line: #d9e0ea;
				--panel: #ffffff;
				--wash: #f4f7fb;
				--accent: #1d6682;
				--green: #2e6b46;
				--amber: #8a621f;
				--red: #98333a;
				--button: #172033;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family:
					"Segoe UI",
					system-ui,
					-apple-system,
					sans-serif;
				background: var(--wash);
				color: var(--ink);
				line-height: 1.6;
			}

			header {
				background: #edf3f7;
				border-bottom: 1px solid var(--line);
			}

			.nav,
			main {
				width: min(1180px, calc(100% - 32px));
				margin: 0 auto;
			}

			.nav {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				padding: 18px 0;
			}

			.brand {
				font-weight: 750;
				letter-spacing: 0.02em;
			}

			a {
				color: var(--accent);
				font-weight: 650;
				text-decoration: none;
			}

			main {
				padding: 36px 0 72px;
			}

			.topline {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 20px;
				align-items: end;
				margin-bottom: 22px;
			}

			h1 {
				margin: 0 0 8px;
				font-size: clamp(2rem, 5vw, 3.4rem);
				line-height: 1.08;
				letter-spacing: 0;
			}

			.lead {
				margin: 0;
				color: var(--muted);
				max-width: 720px;
			}

			.status {
				min-width: 240px;
				padding: 14px 16px;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
			}

			.status strong {
				display: block;
				font-size: 0.9rem;
			}

			.status span {
				color: var(--muted);
				font-size: 0.92rem;
			}

			.layout {
				display: grid;
				grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
				gap: 22px;
				align-items: start;
			}

			form,
			.panel,
			.rule {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
			}

			form {
				padding: 20px;
				position: sticky;
				top: 16px;
			}

			.field {
				margin-bottom: 14px;
			}

			label {
				display: block;
				font-size: 0.86rem;
				font-weight: 700;
				margin-bottom: 6px;
			}

			input,
			select,
			textarea {
				width: 100%;
				border: 1px solid #c7d1dd;
				border-radius: 6px;
				color: var(--ink);
				font: inherit;
				padding: 10px 11px;
				background: #fff;
			}

			textarea {
				min-height: 150px;
				resize: vertical;
			}

			.actions,
			.nav-links,
			.rule-actions,
			.stats {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
			}

			button {
				border: 1px solid transparent;
				border-radius: 6px;
				cursor: pointer;
				font: inherit;
				font-weight: 750;
				padding: 10px 14px;
			}

			button:disabled {
				cursor: not-allowed;
				opacity: 0.55;
			}

			.primary {
				background: var(--button);
				color: #fff;
			}

			.secondary {
				background: #fff;
				border-color: #b8c3d1;
				color: var(--ink);
			}

			.danger {
				background: #fff;
				border-color: #e2a4a8;
				color: var(--red);
			}

			.panel {
				padding: 18px;
				margin-bottom: 16px;
			}

			.stats {
				margin-top: 10px;
			}

			.stat {
				background: #f6f8fb;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 9px 12px;
			}

			.stat b {
				display: block;
				font-size: 1.25rem;
			}

			.stat span {
				color: var(--muted);
				font-size: 0.82rem;
			}

			.rule-list {
				display: grid;
				gap: 12px;
			}

			.rule {
				padding: 18px;
			}

			.rule-header {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				align-items: flex-start;
			}

			.rule h2 {
				margin: 0 0 8px;
				font-size: 1.08rem;
			}

			.rule p {
				margin: 0;
				color: #2e3746;
			}

			.badges {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-top: 12px;
			}

			.badge {
				border-radius: 999px;
				font-size: 0.78rem;
				font-weight: 750;
				padding: 3px 9px;
				background: #eef2f6;
				color: #394557;
			}

			.badge.critical {
				background: #f9e8ea;
				color: var(--red);
			}

			.badge.warning {
				background: #fff3d9;
				color: var(--amber);
			}

			.badge.active {
				background: #e6f2ea;
				color: var(--green);
			}

			.rule-actions {
				margin-top: 14px;
			}

			.message {
				margin: 0 0 16px;
				padding: 12px 14px;
				border-radius: 8px;
				border: 1px solid var(--line);
				background: #fff;
				color: var(--muted);
			}

			.message.error {
				border-color: #efb5b9;
				color: var(--red);
			}

			.message.success {
				border-color: #a7d0b4;
				color: var(--green);
			}

			.empty {
				padding: 28px;
				text-align: center;
				color: var(--muted);
				background: var(--panel);
				border: 1px dashed #bdc7d4;
				border-radius: 8px;
			}

			@media (max-width: 860px) {
				.topline,
				.layout {
					grid-template-columns: 1fr;
				}

				form {
					position: static;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<nav class="nav" aria-label="ルール管理ナビゲーション">
				<div class="brand">ElysiaAI</div>
				<div class="nav-links">
					<a href="/terms.html">利用規約</a>
					<a href="/privacy.html">プライバシー</a>
					<a href="/">ホーム</a>
				</div>
			</nav>
		</header>

		<main>
			<div class="topline">
				<div>
					<h1>ルール管理</h1>
					<p class="lead">
						開発、法務、セキュリティ、運用の約束事をローカルで管理します。大切な規約は、よく研いだ刃物のように静かで確かです。
					</p>
				</div>
				<div class="status" aria-live="polite">
					<strong id="auth-state">確認中</strong>
					<span id="source-state">ルールストアを読んでいます。</span>
				</div>
			</div>

			<div id="message" class="message" hidden></div>

			<div class="layout">
				<form id="rule-form">
					<input id="rule-id" type="hidden" />
					<div class="field">
						<label for="title">タイトル</label>
						<input id="title" name="title" maxlength="120" required />
					</div>
					<div class="field">
						<label for="scope">分類</label>
						<select id="scope" name="scope" required>
							<option value="engineering">Engineering</option>
							<option value="legal">Legal</option>
							<option value="security">Security</option>
							<option value="operations">Operations</option>
						</select>
					</div>
					<div class="field">
						<label for="severity">重要度</label>
						<select id="severity" name="severity" required>
							<option value="info">Info</option>
							<option value="warning">Warning</option>
							<option value="critical">Critical</option>
						</select>
					</div>
					<div class="field">
						<label for="status">状態</label>
						<select id="status" name="status" required>
							<option value="active">Active</option>
							<option value="disabled">Disabled</option>
						</select>
					</div>
					<div class="field">
						<label for="body">本文</label>
						<textarea id="body" name="body" maxlength="4000" required></textarea>
					</div>
					<div class="actions">
						<button class="primary" type="submit" id="save-button">保存</button>
						<button class="secondary" type="button" id="reset-button">新規</button>
						<button class="secondary" type="button" id="login-button">開発ログイン</button>
					</div>
				</form>

				<section aria-label="登録済みルール">
					<div class="panel">
						<strong>サマリー</strong>
						<div class="stats" id="stats"></div>
					</div>
					<div class="rule-list" id="rule-list">
						<div class="empty">読み込み中です。</div>
					</div>
				</section>
			</div>
		</main>

		<script>
			(() => {
				const cookieNames = { csrf: "elysia_csrf_token" };
				const state = {
					rules: [],
					csrfToken: readCookie(cookieNames.csrf),
					loading: false,
				};

				const elements = {
					form: requireElement("rule-form", HTMLFormElement),
					ruleId: requireElement("rule-id", HTMLInputElement),
					title: requireElement("title", HTMLInputElement),
					scope: requireElement("scope", HTMLSelectElement),
					severity: requireElement("severity", HTMLSelectElement),
					status: requireElement("status", HTMLSelectElement),
					body: requireElement("body", HTMLTextAreaElement),
					saveButton: requireElement("save-button", HTMLButtonElement),
					resetButton: requireElement("reset-button", HTMLButtonElement),
					loginButton: requireElement("login-button", HTMLButtonElement),
					ruleList: requireElement("rule-list", HTMLElement),
					stats: requireElement("stats", HTMLElement),
					message: requireElement("message", HTMLElement),
					authState: requireElement("auth-state", HTMLElement),
					sourceState: requireElement("source-state", HTMLElement),
				};

				function requireElement(id, expectedType) {
					const element = document.getElementById(id);
					if (!(element instanceof expectedType)) {
						throw new Error(`Missing element: ${id}`);
					}
					return element;
				}

				function readCookie(name) {
					const cookie = document.cookie
						.split(";")
						.map((part) => part.trim())
						.find((part) => part.startsWith(`${name}=`));
					if (!cookie) return null;
					return decodeURIComponent(cookie.slice(name.length + 1));
				}

				function csrfHeaders(method) {
					state.csrfToken = readCookie(cookieNames.csrf) || state.csrfToken;
					if (["GET", "HEAD", "OPTIONS"].includes(method.toUpperCase())) {
						return {};
					}
					return state.csrfToken ? { "x-csrf-token": state.csrfToken } : {};
				}

				function showMessage(message, type = "") {
					elements.message.textContent = message;
					elements.message.className = `message ${type}`.trim();
					elements.message.hidden = false;
				}

				function clearMessage() {
					elements.message.textContent = "";
					elements.message.hidden = true;
					elements.message.className = "message";
				}

				async function requestJson(url, init = {}) {
					const method = init.method || "GET";
					const headers = new Headers(init.headers || {});
					const legacyToken = localStorage.getItem("elysia_access_token");
					if (legacyToken) headers.set("authorization", `Bearer ${legacyToken}`);
					for (const [key, value] of Object.entries(csrfHeaders(method))) {
						headers.set(key, value);
					}
					const response = await fetch(url, {
						...init,
						method,
						headers,
						credentials: "same-origin",
					});
					const data = await response.json().catch(() => ({}));
					if (!response.ok) {
						const message = data.error || `Request failed (${response.status})`;
						throw new Error(message);
					}
					if (typeof data.csrfToken === "string") {
						state.csrfToken = data.csrfToken;
					}
					return data;
				}

				function setLoading(loading) {
					state.loading = loading;
					elements.saveButton.disabled = loading;
					elements.loginButton.disabled = loading;
				}

				function renderStats(summary) {
					elements.stats.replaceChildren();
					const entries = [
						["Total", summary.total],
						["Active", summary.active],
						["Disabled", summary.disabled],
						["Critical", summary.critical],
					];
					for (const [label, value] of entries) {
						const item = document.createElement("div");
						item.className = "stat";
						const number = document.createElement("b");
						number.textContent = String(value);
						const caption = document.createElement("span");
						caption.textContent = label;
						item.append(number, caption);
						elements.stats.append(item);
					}
				}

				function badge(text, modifier = "") {
					const node = document.createElement("span");
					node.className = `badge ${modifier}`.trim();
					node.textContent = text;
					return node;
				}

				function renderRules() {
					elements.ruleList.replaceChildren();
					if (state.rules.length === 0) {
						const empty = document.createElement("div");
						empty.className = "empty";
						empty.textContent = "登録済みルールはありません。";
						elements.ruleList.append(empty);
						return;
					}

					for (const rule of state.rules) {
						const article = document.createElement("article");
						article.className = "rule";

						const header = document.createElement("div");
						header.className = "rule-header";
						const titleGroup = document.createElement("div");
						const title = document.createElement("h2");
						title.textContent = rule.title;
						const body = document.createElement("p");
						body.textContent = rule.body;
						titleGroup.append(title, body);
						header.append(titleGroup);

						const badges = document.createElement("div");
						badges.className = "badges";
						badges.append(
							badge(rule.scope),
							badge(rule.severity, rule.severity),
							badge(rule.status, rule.status),
							badge(`v${rule.version}`),
						);

						const actions = document.createElement("div");
						actions.className = "rule-actions";
						const edit = document.createElement("button");
						edit.className = "secondary";
						edit.type = "button";
						edit.textContent = "編集";
						edit.addEventListener("click", () => fillForm(rule));
						const remove = document.createElement("button");
						remove.className = "danger";
						remove.type = "button";
						remove.textContent = "削除";
						remove.addEventListener("click", () => deleteRule(rule.id));
						actions.append(edit, remove);

						article.append(header, badges, actions);
						elements.ruleList.append(article);
					}
				}

				function fillForm(rule) {
					elements.ruleId.value = rule.id;
					elements.title.value = rule.title;
					elements.scope.value = rule.scope;
					elements.severity.value = rule.severity;
					elements.status.value = rule.status;
					elements.body.value = rule.body;
					elements.saveButton.textContent = "更新";
					clearMessage();
				}

				function resetForm() {
					elements.ruleId.value = "";
					elements.title.value = "";
					elements.scope.value = "engineering";
					elements.severity.value = "info";
					elements.status.value = "active";
					elements.body.value = "";
					elements.saveButton.textContent = "保存";
				}

				function readForm() {
					return {
						title: elements.title.value.trim(),
						body: elements.body.value.trim(),
						scope: elements.scope.value,
						severity: elements.severity.value,
						status: elements.status.value,
					};
				}

				async function loadRules() {
					setLoading(true);
					clearMessage();
					try {
						const [list, summary] = await Promise.all([
							requestJson("/api/rules"),
							requestJson("/api/rules/summary"),
						]);
						state.rules = list.rules || [];
						elements.authState.textContent = "認証済み";
						elements.sourceState.textContent =
							list.source === "file"
								? "ローカル保存済みルールを表示中です。"
								: "既定ルールを表示中です。";
						renderStats(summary);
						renderRules();
					} catch (error) {
						elements.authState.textContent = "認証が必要です";
						elements.sourceState.textContent =
							"ログイン後にルールを管理できます。";
						elements.ruleList.replaceChildren();
						const empty = document.createElement("div");
						empty.className = "empty";
						empty.textContent =
							error instanceof Error ? error.message : "読み込みに失敗しました。";
						elements.ruleList.append(empty);
						showMessage("ログインしてから再度お試しください。", "error");
					} finally {
						setLoading(false);
					}
				}

				async function saveRule(event) {
					event.preventDefault();
					const payload = readForm();
					if (!payload.title || !payload.body) {
						showMessage("タイトルと本文を入力してください。", "error");
						return;
					}

					setLoading(true);
					try {
						const id = elements.ruleId.value;
						if (id) {
							await requestJson(`/api/rules/${encodeURIComponent(id)}`, {
								method: "PUT",
								headers: { "content-type": "application/json" },
								body: JSON.stringify(payload),
							});
							showMessage("ルールを更新しました。", "success");
						} else {
							await requestJson("/api/rules", {
								method: "POST",
								headers: { "content-type": "application/json" },
								body: JSON.stringify(payload),
							});
							showMessage("ルールを作成しました。", "success");
						}
						resetForm();
						await loadRules();
					} catch (error) {
						showMessage(
							error instanceof Error ? error.message : "保存に失敗しました。",
							"error",
						);
					} finally {
						setLoading(false);
					}
				}

				async function deleteRule(id) {
					const rule = state.rules.find((item) => item.id === id);
					const title = rule ? rule.title : id;
					if (!window.confirm(`「${title}」を削除しますか。`)) return;

					setLoading(true);
					try {
						await requestJson(`/api/rules/${encodeURIComponent(id)}`, {
							method: "DELETE",
						});
						showMessage("ルールを削除しました。", "success");
						if (elements.ruleId.value === id) resetForm();
						await loadRules();
					} catch (error) {
						showMessage(
							error instanceof Error ? error.message : "削除に失敗しました。",
							"error",
						);
					} finally {
						setLoading(false);
					}
				}

				async function devLogin() {
					setLoading(true);
					try {
						await requestJson("/auth/dev-login", {
							method: "POST",
							headers: { "content-type": "application/json" },
						});
						showMessage("開発ログインに成功しました。", "success");
						await loadRules();
					} catch (error) {
						showMessage(
							error instanceof Error
								? error.message
								: "開発ログインに失敗しました。",
							"error",
						);
					} finally {
						setLoading(false);
					}
				}

				elements.form.addEventListener("submit", saveRule);
				elements.resetButton.addEventListener("click", () => {
					resetForm();
					clearMessage();
				});
				elements.loginButton.addEventListener("click", devLogin);

				loadRules();
			})();
		</script>
	</body>
</html>
