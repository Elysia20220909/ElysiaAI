<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ElysiaAI Status</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121a2e;
        --panel-strong: #17233b;
        --line: #2b3652;
        --text: #edf2ff;
        --muted: #9ca8c7;
        --up: #2dd4bf;
        --degraded: #f4c95d;
        --down: #fb7185;
        --disabled: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-strong);
        color: var(--text);
        cursor: pointer;
        padding: 0 14px;
        font-weight: 700;
      }

      button:hover {
        border-color: #5d6f9d;
      }

      .summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        margin-bottom: 16px;
      }

      .section {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 18px;
      }

      .section h2 {
        margin: 0 0 14px;
        font-size: 15px;
      }

      .status-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 12px 0 0;
        margin-top: 12px;
      }

      .status-line:first-of-type {
        border-top: 0;
        padding-top: 0;
        margin-top: 0;
      }

      .label {
        font-weight: 700;
      }

      .detail {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .badge {
        border-radius: 999px;
        border: 1px solid currentColor;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .up,
      .healthy,
      .online {
        color: var(--up);
      }

      .degraded {
        color: var(--degraded);
      }

      .down,
      .unhealthy,
      .offline {
        color: var(--down);
      }

      .disabled {
        color: var(--disabled);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .error {
        color: var(--down);
      }

      @media (max-width: 760px) {
        header,
        .summary {
          grid-template-columns: 1fr;
        }

        header {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>ElysiaAI Status</h1>
          <p>Core services and optional companion integrations</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </header>

      <div class="summary">
        <section class="section" aria-labelledby="core-title">
          <h2 id="core-title">ElysiaAI Core</h2>
          <div id="core-status"></div>
        </section>

        <section class="section" aria-labelledby="companion-title">
          <h2 id="companion-title">Companions</h2>
          <div id="companion-status"></div>
        </section>
      </div>

      <section class="section" aria-labelledby="system-title">
        <h2 id="system-title">Runtime</h2>
        <div id="runtime-status" class="meta">Loading...</div>
      </section>
    </main>

    <script>
      const coreStatus = document.getElementById("core-status");
      const companionStatus = document.getElementById("companion-status");
      const runtimeStatus = document.getElementById("runtime-status");
      const refresh = document.getElementById("refresh");

      function badge(status) {
        const value = status || "unknown";
        return `<span class="badge ${value}">${value}</span>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function serviceRow(name, service) {
        const response = Number.isFinite(service?.responseTime)
          ? `${Math.round(service.responseTime)} ms`
          : "no timing";
        const error = service?.error
          ? `<span class="detail error">${escapeHtml(service.error)}</span>`
          : "";
        return `
          <div class="status-line">
            <div>
              <span class="label">${escapeHtml(name)}</span>
              <span class="detail">${escapeHtml(response)}</span>
              ${error}
            </div>
            ${badge(service?.status)}
          </div>
        `;
      }

      function renderHealth(data) {
        coreStatus.innerHTML = `
          <div class="status-line">
            <div>
              <span class="label">Overall</span>
              <span class="detail">Core health summary</span>
            </div>
            ${badge(data.status)}
          </div>
          ${serviceRow("Redis", data.services.redis)}
          ${serviceRow("FastAPI Kernel", data.services.fastapi)}
          ${serviceRow("Ollama", data.services.ollama)}
        `;

        companionStatus.innerHTML = serviceRow(
          "Open-LLM-VTuber",
          data.companions?.openLlmVtuber ?? {
            status: "disabled",
            error: "Companion status not reported",
          },
        );

        const memory = data.system?.memory ?? {};
        runtimeStatus.innerHTML = `
          <span>Uptime: ${escapeHtml(Math.round(data.uptime))}s</span>
          <span>Heap: ${escapeHtml(memory.used ?? "?")} / ${escapeHtml(memory.total ?? "?")} MB</span>
          <span>Memory: ${escapeHtml(memory.percentage ?? "?")}%</span>
          <span>Updated: ${escapeHtml(new Date(data.timestamp).toLocaleString())}</span>
        `;
      }

      async function fetchHealth() {
        coreStatus.textContent = "Loading...";
        companionStatus.textContent = "Loading...";
        runtimeStatus.textContent = "Loading...";
        try {
          const response = await fetch("/health", {
            headers: { accept: "application/json" },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          renderHealth(await response.json());
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          coreStatus.innerHTML = `<span class="error">Failed to load: ${escapeHtml(message)}</span>`;
          companionStatus.textContent = "Unavailable";
          runtimeStatus.textContent = "Unavailable";
        }
      }

      refresh.addEventListener("click", fetchHealth);
      fetchHealth();
    </script>
  </body>
</html>
