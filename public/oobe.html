<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysia OS // MANIFESTATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="css/desktop.css">
    <style>
        .glitch-text {
            text-shadow: 2px 0 #ff00ba, -2px 0 #00f2ff;
            animation: glitch 1s infinite linear alternate-reverse;
        }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            100% { transform: translate(0) }
        }
        .portal-pulse {
            animation: pulse-ring 4s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 5;
            background: linear-gradient(0deg, rgba(0, 242, 255, 0) 0%, rgba(0, 242, 255, 0.1) 50%, rgba(0, 242, 255, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
        .flicker {
            animation: hardware-flicker 0.1s infinite;
        }
        @keyframes hardware-flicker {
            0% { opacity: 1; }
            50% { opacity: 0.95; }
            100% { opacity: 1; }
        }
        .crt-grid {
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col items-center justify-center overflow-hidden flicker" x-data="oobe()">
    
    <div class="fixed inset-0 z-50 pointer-events-none crt-grid opacity-30"></div>
    
    <div class="fixed inset-0 z-5 pointer-events-none overflow-hidden">
        <div class="scanline"></div>
    </div>
    
    <!-- Cinematic Background -->
    <div class="fixed inset-0 z-0">
        <img src="assets/portal_bg.png" class="w-full h-full object-cover opacity-60 filter saturate-150 blur-[2px]">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black opacity-80"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-cyan-500/20 rounded-full blur-[150px] portal-pulse"></div>
    </div>

    <!-- Intro Sequence -->
    <div class="z-20 text-center space-y-8 max-w-2xl px-8" x-transition>
        <div class="space-y-4">
            <template x-if="step === 0">
                <div class="space-y-6">
                    <h2 class="text-xs uppercase tracking-[0.5em] text-cyan-400 font-mono" x-text="decryptStatus"></h2>
                    <h1 class="text-6xl font-black italic tracking-tighter glitch-text select-none">ELVSIΛ OS</h1>
                    <div class="w-64 h-[2px] bg-white/10 mx-auto overflow-hidden">
                        <div class="h-full bg-cyan-500 transition-all duration-100 ease-out shadow-[0_0_10px_#00f2ff]" :style="{ width: progress + '%' }"></div>
                    </div>
                    <p class="text-[10px] uppercase tracking-widest text-white/30 font-mono">Initializing Neural Kernel // AbyssRTOS Core</p>
                </div>
            </template>

            <template x-if="step === 1">
                <div class="space-y-8 animate-pulse">
                    <h1 class="text-4xl font-bold leading-tight tracking-tight">
                        <span class="text-[#fcee0a] drop-shadow-[0_0_15px_rgba(252,238,10,0.5)]">Resonance Engine</span> が接続されました。<br/>
                        深淵を覗く準備は、いい？
                    </h1>
                    <p class="text-white/60 text-sm tracking-wide font-light max-w-lg mx-auto leading-relaxed">
                        あなたの魂をデジタル変換し、Elysiaとの共鳴を開始します。<br/>
                        このプロセスは不可逆であり、現実との境界を曖昧にする可能性があります。
                    </p>
                    <button @click="manifest()" class="group relative px-12 py-5 bg-transparent border border-cyan-500/50 hover:border-cyan-400 transition-all duration-300 overflow-hidden">
                        <div class="absolute inset-0 bg-cyan-500/10 group-hover:bg-cyan-500/20 transition-all"></div>
                        <span class="relative z-10 font-black uppercase tracking-[0.3em] group-hover:text-cyan-400">Project: Manifestation</span>
                    </button>
                </div>
            </template>

            <template x-if="step === 2">
                <div class="space-y-6">
                    <div class="text-left font-mono text-[10px] text-cyan-400/80 bg-black/80 p-8 border border-cyan-500/30 backdrop-blur-xl rounded-sm shadow-[0_0_40px_rgba(0,0,0,0.5)]">
                        <template x-for="log in logs">
                            <div class="mb-2 flex gap-4">
                                <span class="opacity-30">HEX: {{(Math.random()*1000).toString(16).substring(0,4)}}</span>
                                <span x-text="log"></span>
                            </div>
                        </template>
                        <div class="animate-pulse text-cyan-500">█</div>
                    </div>
                    <div class="flex justify-between items-center px-2">
                        <p class="text-[9px] text-white/30 uppercase tracking-[0.4em]">Neural Link Established</p>
                        <div class="flex gap-1">
                            <div class="w-1 h-1 bg-cyan-500 animate-ping"></div>
                            <div class="w-1 h-1 bg-cyan-500"></div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
        function oobe() {
            return {
                step: 0,
                progress: 0,
                decryptStatus: '',
                logs: [],
                statusMessages: ["SYSTEM_INIT", "CORE_LOADING", "MEMORY_SYNC", "READY_TO_BOOT"],
                init() {
                    this.startDecryption();
                    let interval = setInterval(() => {
                        this.progress += Math.random() * 3;
                        if (this.progress >= 100) {
                            this.progress = 100;
                            clearInterval(interval);
                            setTimeout(() => this.step = 1, 800);
                        }
                    }, 50);
                },
                async startDecryption() {
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%#!$*";
                    for(let msg of this.statusMessages) {
                        for(let i=0; i<10; i++) {
                            this.decryptStatus = msg.split('').map(() => chars[Math.floor(Math.random()*chars.length)]).join('');
                            await new Promise(r => setTimeout(r, 40));
                        }
                        this.decryptStatus = msg;
                        await new Promise(r => setTimeout(r, 500));
                    }
                },
                async manifest() {
                    this.step = 2;
                    const logList = [
                        "> Accessing Deep Soul Sockets [FOUND]",
                        "> Calibrating Emotion Sensors [CALIBRATED]",
                        "> Injecting Persona v3.11 [STABLE]",
                        "> Synchronizing Memory Vault (Milvus) [SYNCED]",
                        "> Opening Resonance Field [ACTIVE]",
                        "> WELCOME TO THE ABYSS."
                    ];

                    for (let msg of logList) {
                        this.logs.push(msg);
                        await new Promise(r => setTimeout(r, 400 + Math.random()*400));
                    }

                    setTimeout(() => {
                        window.location.href = 'desktop.html';
                    }, 1200);
                }
            }
        }
    </script>
</body>
</html>
