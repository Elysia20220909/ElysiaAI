<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>AEGIS-FRIDAY HUD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #090909;
        --panel: rgba(22, 23, 24, 0.9);
        --line: #46382d;
        --text: #f8f3ea;
        --muted: #afa59a;
        --gold: #d8aa58;
        --red: #a63131;
        --cyan: #49d7f0;
        --green: #54dc9a;
        --amber: #f1bd58;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(115deg, rgba(166, 49, 49, 0.28), transparent 42%),
          radial-gradient(circle at 70% 30%, rgba(73, 215, 240, 0.16), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button,
      a.button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(32, 29, 26, 0.96);
        color: var(--text);
        padding: 0 14px;
        text-decoration: none;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover,
      a.button:hover {
        border-color: var(--gold);
      }

      .hud {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
      }

      .viewport,
      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .viewport {
        min-height: 540px;
        position: relative;
        overflow: hidden;
      }

      .reticle {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(73, 215, 240, 0.45);
        clip-path: polygon(0 0, 26% 0, 26% 3px, 3px 3px, 3px 26%, 0 26%, 0 0, 100% 0, 100% 26%, calc(100% - 3px) 26%, calc(100% - 3px) 3px, 74% 3px, 74% 0, 100% 0, 100% 100%, 74% 100%, 74% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 74%, 100% 74%, 100% 100%, 0 100%, 0 74%, 3px 74%, 3px calc(100% - 3px), 26% calc(100% - 3px), 26% 100%, 0 100%);
      }

      .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 180px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid var(--cyan);
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle, rgba(248, 243, 234, 0.95) 0 13%, rgba(73, 215, 240, 0.7) 14% 30%, transparent 31%),
          radial-gradient(circle, rgba(73, 215, 240, 0.2), transparent 64%);
      }

      .core span {
        margin-top: 132px;
        color: var(--cyan);
        font-size: 12px;
        font-weight: 800;
      }

      .readout {
        position: absolute;
        min-width: 180px;
        border-left: 2px solid var(--gold);
        padding-left: 10px;
        color: var(--text);
        font-size: 13px;
      }

      .readout small {
        display: block;
        color: var(--muted);
      }

      .r1 {
        left: 34px;
        top: 48px;
      }

      .r2 {
        right: 34px;
        top: 116px;
      }

      .r3 {
        left: 44px;
        bottom: 88px;
      }

      .r4 {
        right: 34px;
        bottom: 54px;
      }

      .side {
        display: grid;
        gap: 16px;
      }

      .panel {
        padding: 16px;
      }

      .panel h2 {
        margin: 0 0 12px;
        color: var(--gold);
        font-size: 14px;
        text-transform: uppercase;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding: 10px 0 0;
        margin-top: 10px;
      }

      .stat:first-of-type {
        border-top: 0;
        padding-top: 0;
        margin-top: 0;
      }

      .value {
        color: var(--cyan);
        font-weight: 800;
      }

      .module {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 52px;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: #2b2b2b;
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--cyan), var(--gold));
      }

      @media (max-width: 900px) {
        .hud {
          grid-template-columns: 1fr;
        }

        .viewport {
          min-height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AEGIS-FRIDAY HUD</h1>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <a class="button" href="/suit-viewer.html">3D Viewer</a>
          <a class="button" href="/stark-ops.html">Local Ops</a>
        </div>
      </header>

      <div class="hud">
        <section class="viewport" aria-label="helmet hud">
          <div class="reticle"></div>
          <div class="core"><span>ARC ONLINE</span></div>
          <div class="readout r1">MODE <small id="mode">--</small></div>
          <div class="readout r2">CORE <small id="core">--</small></div>
          <div class="readout r3">ARMOR <small id="armor">--</small></div>
          <div class="readout r4">ACTION <small id="action">--</small></div>
        </section>

        <aside class="side">
          <section class="panel">
            <h2>Status</h2>
            <div class="stat"><span>Risk</span><span class="value" id="risk">--</span></div>
            <div class="stat"><span>Pilot Stress</span><span class="value" id="stress">--</span></div>
            <div class="stat"><span>Updated</span><span class="value" id="updated">--</span></div>
          </section>

          <section class="panel">
            <h2>Modules</h2>
            <div id="modules"></div>
          </section>
        </aside>
      </div>
    </main>

    <script>
      const refs = {
        mode: document.getElementById("mode"),
        core: document.getElementById("core"),
        armor: document.getElementById("armor"),
        action: document.getElementById("action"),
        risk: document.getElementById("risk"),
        stress: document.getElementById("stress"),
        updated: document.getElementById("updated"),
        modules: document.getElementById("modules"),
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderModule(module) {
        return `
          <div class="module">
            <div>
              <strong>${escapeHtml(module.name)}</strong>
              <div class="bar"><span style="width: ${Number(module.load) || 0}%"></span></div>
            </div>
            <span class="value">${escapeHtml(module.status)}</span>
          </div>
        `;
      }

      async function loadStatus() {
        const response = await fetch("/api/suit/status");
        const status = await response.json();
        refs.mode.textContent = status.mode;
        refs.core.textContent = `${status.coreStability}%`;
        refs.armor.textContent = `${status.armorIntegrity}%`;
        refs.action.textContent = status.suggestedAction;
        refs.risk.textContent = status.nearbyRisk;
        refs.stress.textContent = `${status.pilotStress}%`;
        refs.updated.textContent = new Date(status.updatedAt).toLocaleTimeString();
        refs.modules.innerHTML = status.modules.map(renderModule).join("");
      }

      document.getElementById("refresh").addEventListener("click", loadStatus);
      loadStatus();
    </script>
  </body>
</html>
