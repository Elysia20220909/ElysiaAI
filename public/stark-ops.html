<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ElysiaAI Local Ops</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #101010;
        --band: #171717;
        --panel: #1f1f1f;
        --panel-strong: #292421;
        --line: #443b35;
        --text: #f6f1ea;
        --muted: #b8aea4;
        --red: #a83232;
        --gold: #d8ad5f;
        --cyan: #52d7e8;
        --green: #55d98f;
        --amber: #f2bb57;
        --danger: #ff6b7a;
        --disabled: #8d9299;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(168, 50, 50, 0.18), transparent 260px),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(1240px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 36px;
      }

      header {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        min-height: 80px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
      }

      .mark {
        width: 56px;
        height: 56px;
        border-radius: 8px;
        object-fit: cover;
        background: var(--panel);
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .subline {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      button,
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-strong);
        color: var(--text);
        cursor: pointer;
        padding: 0 14px;
        font-weight: 800;
        text-decoration: none;
      }

      button:hover,
      a.button:hover {
        border-color: var(--gold);
      }

      .grid {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 16px;
      }

      .section {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(31, 31, 31, 0.92);
        padding: 16px;
      }

      .section + .section {
        margin-top: 16px;
      }

      .section h2 {
        margin: 0 0 14px;
        font-size: 14px;
        color: var(--gold);
        text-transform: uppercase;
      }

      .readiness {
        display: grid;
        gap: 14px;
      }

      .score {
        display: grid;
        place-items: center;
        width: 180px;
        aspect-ratio: 1;
        margin: 0 auto;
        border: 1px solid var(--gold);
        border-radius: 50%;
        background:
          radial-gradient(circle, rgba(82, 215, 232, 0.2), transparent 58%),
          var(--band);
      }

      .score strong {
        display: block;
        font-size: 46px;
        line-height: 1;
      }

      .score span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .pill,
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .ready,
      .up {
        color: var(--green);
      }

      .partial,
      .degraded,
      .unknown {
        color: var(--amber);
      }

      .attention,
      .down {
        color: var(--danger);
      }

      .disabled {
        color: var(--disabled);
      }

      .services {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .service {
        min-height: 152px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .service-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }

      .service h3 {
        margin: 0;
        font-size: 16px;
      }

      .role {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .detail {
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-self: end;
      }

      .links a {
        color: var(--cyan);
        font-size: 12px;
        text-decoration: none;
      }

      .command {
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }

      .command:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .command code {
        display: block;
        margin-top: 5px;
        overflow-wrap: anywhere;
        color: var(--cyan);
        font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
      }

      .error {
        color: var(--danger);
      }

      @media (max-width: 980px) {
        .grid,
        .services {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 680px) {
        header {
          grid-template-columns: auto minmax(0, 1fr);
        }

        header .actions {
          grid-column: 1 / -1;
        }

        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="/logo.png" alt="" />
        <div>
          <h1>ElysiaAI Local Ops</h1>
          <div class="subline" id="summary">Loading house systems...</div>
        </div>
        <div class="actions">
          <button id="refresh" type="button">Refresh</button>
          <a class="button" href="/native-lite.html">Native Lite</a>
          <a class="button" href="/suit-hud.html">Suit HUD</a>
          <a class="button" href="/suit-viewer.html">3D Viewer</a>
        </div>
      </header>

      <div class="grid">
        <aside>
          <section class="section readiness" aria-labelledby="readiness-title">
            <h2 id="readiness-title">Readiness</h2>
            <div class="score">
              <div>
                <strong id="score">--</strong>
                <span id="score-label">standing by</span>
              </div>
            </div>
            <div class="meta" id="safety"></div>
          </section>

          <section class="section" aria-labelledby="commands-title">
            <h2 id="commands-title">Manual Launch</h2>
            <div id="commands"></div>
          </section>
        </aside>

        <section class="section" aria-labelledby="services-title">
          <h2 id="services-title">House Systems</h2>
          <div class="services" id="services"></div>
        </section>
      </div>
    </main>

    <script>
      const summary = document.getElementById("summary");
      const score = document.getElementById("score");
      const scoreLabel = document.getElementById("score-label");
      const safety = document.getElementById("safety");
      const commands = document.getElementById("commands");
      const services = document.getElementById("services");
      const refresh = document.getElementById("refresh");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function statusClass(value) {
        return value || "unknown";
      }

      function renderService(service) {
        const status = service.enabled ? service.status : "disabled";
        const timing = Number.isFinite(service.responseTime)
          ? `${Math.round(service.responseTime)} ms`
          : service.enabled
            ? "no timing"
            : "optional";
        const links = (service.links || [])
          .map(
            (link) =>
              `<a href="${escapeHtml(link.url)}">${escapeHtml(link.label)}</a>`,
          )
          .join("");
        const detail =
          service.detail || service.startCommand || service.url || "nominal";

        return `
          <article class="service">
            <div class="service-head">
              <div>
                <h3>${escapeHtml(service.name)}</h3>
                <div class="role">${escapeHtml(service.role)}</div>
              </div>
              <span class="badge ${statusClass(status)}">${escapeHtml(status)}</span>
            </div>
            <div class="detail">${escapeHtml(timing)} · ${escapeHtml(detail)}</div>
            <div class="links">${links}</div>
          </article>
        `;
      }

      function renderCommand(command) {
        return `
          <div class="command">
            <strong>${escapeHtml(command.label)}</strong>
            <code>${escapeHtml(command.command)}</code>
          </div>
        `;
      }

      function render(data) {
        summary.textContent = `${data.readiness.summary} · ${new Date(
          data.generatedAt,
        ).toLocaleString()}`;
        score.textContent = `${data.readiness.score}`;
        scoreLabel.innerHTML = `<span class="pill ${statusClass(
          data.readiness.status,
        )}">${escapeHtml(data.readiness.status)}</span>`;
        safety.innerHTML = `
          <span class="pill ready">manual</span>
          <span class="pill ready">local</span>
          <span class="pill ready">no automation</span>
        `;
        services.innerHTML = data.services.map(renderService).join("");
        commands.innerHTML = data.commands.map(renderCommand).join("");
      }

      async function loadOps() {
        summary.textContent = "Loading house systems...";
        try {
          const response = await fetch("/api/local-ops", {
            headers: { accept: "application/json" },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          summary.innerHTML = `<span class="error">${escapeHtml(message)}</span>`;
          services.innerHTML = "";
          commands.innerHTML = "";
        }
      }

      refresh.addEventListener("click", loadOps);
      loadOps();
    </script>
  </body>
</html>
