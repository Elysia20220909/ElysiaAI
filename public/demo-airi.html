<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Elysia Airi Chat Demo</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #111827;
			--muted: #64748b;
			--line: #dbe3ef;
			--panel: rgba(255, 255, 255, 0.92);
			--accent: #0f766e;
			--accent-strong: #be123c;
			--soft: #f8fafc;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family:
				Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
				sans-serif;
			color: var(--ink);
			background:
				linear-gradient(rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.9)),
				url("/logo.png") center 18% / min(680px, 92vw) auto no-repeat,
				linear-gradient(135deg, #fef2f2 0%, #ecfeff 48%, #eef2ff 100%);
		}

		main {
			width: min(980px, calc(100vw - 32px));
			min-height: 100vh;
			margin: 0 auto;
			display: grid;
			grid-template-rows: auto 1fr;
			gap: 16px;
			padding: 24px 0;
		}

		header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 16px;
			padding: 8px 0;
		}

		h1 {
			margin: 0;
			font-size: clamp(2rem, 7vw, 4rem);
			line-height: 0.96;
			letter-spacing: 0;
		}

		.subtitle {
			margin: 8px 0 0;
			color: var(--muted);
			font-size: 0.95rem;
		}

		.mode-control {
			display: grid;
			gap: 6px;
			min-width: 190px;
		}

		label {
			font-size: 0.76rem;
			font-weight: 700;
			color: var(--muted);
			text-transform: uppercase;
		}

		select,
		textarea,
		button {
			font: inherit;
		}

		select {
			height: 42px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: white;
			color: var(--ink);
			padding: 0 12px;
		}

		.chat-shell {
			min-height: 0;
			border: 1px solid rgba(148, 163, 184, 0.38);
			border-radius: 8px;
			background: var(--panel);
			box-shadow: 0 24px 80px rgba(15, 23, 42, 0.14);
			overflow: hidden;
			display: grid;
			grid-template-rows: auto 1fr auto;
		}

		.status-bar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 14px 16px;
			border-bottom: 1px solid var(--line);
			background: rgba(248, 250, 252, 0.88);
		}

		.status {
			display: flex;
			align-items: center;
			gap: 10px;
			font-weight: 800;
		}

		.status::before {
			content: "";
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: #22c55e;
			box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
		}

		.mode-readout {
			color: var(--muted);
			font-size: 0.86rem;
		}

		.messages {
			min-height: 280px;
			max-height: min(58vh, 620px);
			overflow-y: auto;
			padding: 18px;
			display: flex;
			flex-direction: column;
			gap: 14px;
			background:
				linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.88)),
				repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(15, 23, 42, 0.03) 32px);
		}

		.empty-state {
			margin: auto;
			text-align: center;
			color: var(--muted);
		}

		.message-row {
			display: flex;
		}

		.message-row.user {
			justify-content: flex-end;
		}

		.bubble {
			width: fit-content;
			max-width: min(74ch, 86%);
			padding: 12px 14px;
			border: 1px solid var(--line);
			border-radius: 8px;
			line-height: 1.55;
			white-space: pre-wrap;
			box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
		}

		.user .bubble {
			color: white;
			background: linear-gradient(135deg, var(--accent), #0e7490);
			border-color: transparent;
		}

		.ai-message {
			background: #f8fafc;
		}

		.bg-slate-50 {
			background: #f8fafc;
		}

		.feedback-actions {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: 10px;
		}

		.icon-button {
			width: 34px;
			height: 34px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: white;
			cursor: pointer;
		}

		.icon-button:hover,
		.icon-button:focus-visible {
			border-color: var(--accent);
			outline: none;
		}

		.feedback-success {
			color: var(--accent);
			font-size: 0.82rem;
			font-weight: 700;
		}

		form {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 12px;
			padding: 16px;
			border-top: 1px solid var(--line);
			background: rgba(255, 255, 255, 0.96);
		}

		textarea {
			min-height: 54px;
			max-height: 180px;
			resize: vertical;
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 14px;
			color: var(--ink);
			background: white;
		}

		textarea:focus-visible {
			border-color: var(--accent-strong);
			outline: 3px solid rgba(190, 18, 60, 0.14);
		}

		.send-button {
			min-width: 96px;
			border: 0;
			border-radius: 8px;
			background: var(--ink);
			color: white;
			font-weight: 800;
			cursor: pointer;
		}

		.send-button:disabled {
			cursor: not-allowed;
			opacity: 0.48;
		}

		.error-text {
			grid-column: 1 / -1;
			color: #b91c1c;
			font-size: 0.9rem;
			font-weight: 700;
		}

		@media (max-width: 680px) {
			main {
				width: min(100vw - 20px, 980px);
				padding: 12px 0;
			}

			header {
				align-items: stretch;
				flex-direction: column;
			}

			.mode-control {
				min-width: 0;
			}

			form {
				grid-template-columns: 1fr;
			}

			.send-button {
				height: 48px;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<div>
				<h1>Elysia Airi</h1>
				<p class="subtitle">ローカルで動く、テスト可能なチャットデモ。</p>
			</div>
			<div class="mode-control">
				<label for="mode">Response mode</label>
				<select id="mode" name="mode" tabindex="3" aria-label="会話モード">
					<option value="normal">normal</option>
					<option value="professional">professional</option>
					<option value="sweet">sweet</option>
				</select>
			</div>
		</header>

		<section class="chat-shell" aria-label="Elysia chat">
			<div class="status-bar">
				<div class="status">Elysia Core Online</div>
				<div class="mode-readout" id="modeReadout">mode: normal</div>
			</div>

			<div id="messages" class="messages" aria-live="polite">
				<div class="empty-state" id="emptyState">
					<strong>接続準備完了</strong>
					<div>メッセージを入力してください。</div>
				</div>
			</div>

			<form id="chatForm">
				<textarea
					id="messageInput"
					tabindex="1"
					placeholder="メッセージを入力してください"
					aria-label="メッセージ入力"
				></textarea>
				<button class="send-button" type="submit" tabindex="2" aria-label="メッセージを送信">送信</button>
				<div id="errorText" class="error-text" hidden></div>
			</form>
		</section>
	</main>

	<script>
		const messagesEl = document.getElementById("messages");
		const emptyState = document.getElementById("emptyState");
		const form = document.getElementById("chatForm");
		const input = document.getElementById("messageInput");
		const mode = document.getElementById("mode");
		const modeReadout = document.getElementById("modeReadout");
		const errorText = document.getElementById("errorText");

		function setError(message) {
			errorText.textContent = message;
			errorText.hidden = !message;
		}

		function appendMessage(role, content) {
			emptyState.hidden = true;
			const row = document.createElement("div");
			row.className = `message-row ${role}`;

			const bubble = document.createElement("div");
			bubble.className =
				role === "assistant" ? "bubble ai-message bg-slate-50" : "bubble";
			bubble.textContent = content;
			row.appendChild(bubble);

			if (role === "assistant") {
				const actions = document.createElement("div");
				actions.className = "feedback-actions";

				const positive = document.createElement("button");
				positive.type = "button";
				positive.className = "icon-button feedback-up";
				positive.setAttribute("aria-label", "良い応答として評価");
				positive.title = "良い応答";
				positive.textContent = "+";

				const negative = document.createElement("button");
				negative.type = "button";
				negative.className = "icon-button feedback-down";
				negative.setAttribute("aria-label", "改善が必要な応答として評価");
				negative.title = "改善が必要";
				negative.textContent = "-";

				const confirmation = document.createElement("span");
				confirmation.className = "feedback-success";
				confirmation.hidden = true;
				confirmation.textContent = "フィードバックを保存しました";

				function submitFeedback(rating) {
					confirmation.hidden = false;
					confirmation.textContent =
						rating === "up"
							? "フィードバックを保存しました"
							: "改善フィードバックを保存しました";
				}

				positive.addEventListener("click", () => submitFeedback("up"));
				negative.addEventListener("click", () => submitFeedback("down"));

				actions.append(positive, negative, confirmation);
				bubble.appendChild(actions);
			}

			messagesEl.appendChild(row);
			messagesEl.scrollTop = messagesEl.scrollHeight;
		}

		function responseFor(selectedMode, text) {
			if (selectedMode === "professional") {
				return `承知しました。要点を整理し、次の作業に進めます: ${text}`;
			}
			if (selectedMode === "sweet") {
				return `うん、ちゃんと届いたよ。いっしょに進めようね: ${text}`;
			}
			return `受信しました。Elysia はこの内容を処理できます: ${text}`;
		}

		mode.addEventListener("change", () => {
			modeReadout.textContent = `mode: ${mode.value}`;
		});

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			const text = input.value.trim();
			if (!text) return;

			setError("");
			appendMessage("user", text);
			input.value = "";

			await new Promise((resolve) => setTimeout(resolve, 80));

			if (!navigator.onLine) {
				const message = "エラー: ネットワークに接続できません";
				setError(message);
				appendMessage("assistant", message);
				return;
			}

			appendMessage("assistant", responseFor(mode.value, text));
		});
	</script>
</body>
</html>
