<div class="h-full flex flex-col bg-slate-950/60 backdrop-blur-2xl border border-cyan-500/30 rounded-[2.5rem] overflow-hidden shadow-[0_0_100px_rgba(0,242,255,0.05)] relative" 
     x-data="{ 
        phantoms: [], 
        loading: false, 
        dragOver: false,
        stats: { elysia: { soul_resonance: { unified_resonance: 0.98 } } },
        async fetchPhantoms() {
            this.loading = true;
            try {
                const res = await fetch('http://localhost:8000/abyss/files');
                const data = await res.json();
                this.phantoms = data.files;
            } finally { this.loading = false; }
        },
        async fetchStats() {
            const res = await fetch('http://localhost:8000/system/monitor');
            this.stats = await res.json();
        },
        async materialize(id) {
            this.showToast('Materializing from Abyss...', '🌌');
            window.open(`http://localhost:8000/abyss/materialize/${id}`);
        },
        async handleDrop(e) {
            this.dragOver = false;
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                 this.showToast('Submersion Protocol: Manual Path Required for Security.', '🛡️');
                 this.submergePrompt(files[0].name);
            }
        },
        async submergePrompt(hint = '') {
            const path = prompt('Abyssal Protocol: Enter absolute file path to shatter:', hint);
            if (!path) return;
            this.loading = true;
            try {
                const res = await fetch('http://localhost:8000/abyss/submerge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_path: path })
                });
                if (res.ok) {
                    this.showToast('File shattered and submerged.', '🛡️');
                    this.fetchPhantoms();
                    this.triggerShatterEffect();
                } else {
                    this.showToast('Submerge failed. Verify Aegis resonance.', '❌');
                }
            } finally { this.loading = false; }
        },
        triggerShatterEffect() {
            const canvas = document.getElementById('abyss-vortex-overlay');
            // Visual trigger logic could go here
        }
     }" x-init="fetchPhantoms(); setInterval(() => fetchStats(), 3000)">

    <!-- 🌌 Abyssal Canvas (Fluid Background) -->
    <canvas id="abyssalFluid" class="absolute inset-0 z-0 opacity-30"></canvas>

    <!-- 🌊 Immersive Header -->
    <div class="relative z-10 p-8 border-b border-white/5 flex items-center justify-between bg-gradient-to-b from-black/40 to-transparent">
        <div class="flex items-center gap-6">
            <div class="relative">
                <div class="w-14 h-14 rounded-2xl bg-cyan-500/10 flex items-center justify-center border border-cyan-500/30 bioluminescence">
                    <span class="text-2xl">🌌</span>
                </div>
                <!-- Shard Pulse -->
                <div class="absolute -right-2 -top-2 flex gap-1">
                    <div class="w-2 h-2 bg-cyan-400 rounded-full animate-ping"></div>
                </div>
            </div>
            <div>
                <h2 class="text-lg font-black tracking-[0.4em] text-white uppercase drop-shadow-2xl">Abyssal_Explorer</h2>
                <div class="flex items-center gap-2 mt-1">
                    <span class="px-2 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-[8px] text-cyan-400 font-bold uppercase tracking-widest">Protocol 2.9.5-Beyond</span>
                    <span class="text-[9px] text-white/30 font-mono" x-text="'RES_SYNC: ' + (stats.elysia?.soul_resonance?.status || 'HARMONIZED')"></span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-8">
             <div class="text-right">
                 <div class="text-[9px] text-white/40 uppercase tracking-[0.2em] mb-1">Resonance Index</div>
                 <div class="flex items-center justify-end gap-2">
                     <div class="w-24 h-1 bg-white/5 rounded-full overflow-hidden">
                         <div class="h-full bg-cyan-400 shadow-[0_0_10px_#00f2ff] transition-all duration-1000" 
                              :style="`width: ${(stats.elysia?.soul_resonance?.unified_resonance || 0.98) * 100}%` "></div>
                     </div>
                     <span class="text-xs font-black text-cyan-400 font-mono" x-text="Math.round((stats.elysia?.soul_resonance?.unified_resonance || 0.98) * 100) + '%'"></span>
                 </div>
             </div>
             <button @click="fetchPhantoms()" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center border border-white/10 transition-all hover:scale-110 active:scale-95">
                 <span class="text-lg" :class="loading ? 'animate-spin' : ''">💎</span>
             </button>
        </div>
    </div>

    <!-- 🌌 Explorer Workspace -->
    <div class="relative z-10 flex-1 flex">
        
        <!-- Left: Submersion Vortex (Drag & Drop) -->
        <div class="w-[320px] p-8 border-r border-white/5 flex flex-col items-center justify-center bg-black/20"
             @dragover.prevent="dragOver = true"
             @dragleave.prevent="dragOver = false"
             @drop.prevent="handleDrop($event)">
            
            <div class="relative group cursor-pointer" @click="submergePrompt()">
                <div class="w-48 h-48 rounded-full border-2 border-dashed border-cyan-500/20 flex flex-col items-center justify-center transition-all duration-500"
                     :class="dragOver ? 'scale-110 border-cyan-400 bg-cyan-500/10 rotate-90 shadow-[0_0_50px_rgba(0,242,255,0.2)]' : 'group-hover:border-cyan-500/40'">
                    
                    <div class="absolute inset-4 rounded-full border border-cyan-500/10 animate-[spin_20s_linear_infinite]"></div>
                    <div class="absolute inset-8 rounded-full border border-cyan-500/5 animate-[spin_15s_linear_infinite_reverse]"></div>
                    
                    <span class="text-4xl mb-4 group-hover:scale-125 transition-transform duration-500">⚓</span>
                    <p class="text-[10px] font-black text-cyan-400 uppercase tracking-widest">Shatter_Core</p>
                    <p class="text-[8px] text-white/30 uppercase mt-2 tracking-tighter">Drag to Submerge</p>
                </div>
                
                <!-- Vortex Pulse -->
                <div class="absolute inset-0 bg-cyan-500/5 rounded-full blur-3xl scale-125 animate-pulse"></div>
            </div>
            
            <div class="mt-12 space-y-4 w-full">
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 flex items-center gap-4">
                    <div class="w-2 h-2 bg-green-400 rounded-full"></div>
                    <div>
                        <div class="text-[9px] font-bold text-white/60 uppercase">Shard Sync</div>
                        <div class="text-[8px] text-white/30 truncate">Active Across 3 Void Sectors</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Phantom List -->
        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar relative">
            
            <!-- Abyssal Fog (Low resonance warning) -->
            <div class="absolute inset-0 z-50 backdrop-blur-md bg-black/60 flex flex-col items-center justify-center transition-opacity duration-1000"
                 x-show="(stats.elysia?.soul_resonance?.unified_resonance || 1.0) < 0.6">
                <div class="text-4xl mb-4">💨</div>
                <h3 class="text-sm font-black text-white uppercase tracking-widest">Fog of the Abyss</h3>
                <p class="text-[10px] text-white/40 mt-2">Resonance too low to materialize phantoms.</p>
            </div>

            <!-- Empty State -->
            <template x-if="phantoms.length === 0 && !loading">
                <div class="h-full flex flex-col items-center justify-center opacity-20 py-20">
                    <div class="text-6xl mb-8 animate-bounce">🌊</div>
                    <h3 class="text-lg font-black tracking-widest uppercase">The Deep is Calm</h3>
                    <p class="text-xs mt-2 font-medium">No phantoms detected in current resonance.</p>
                </div>
            </template>

            <!-- List Grid -->
            <div class="grid grid-cols-1 gap-4">
                <template x-for="file in phantoms" :key="file.id">
                    <div class="group bg-white/5 border border-white/5 rounded-3xl p-6 flex items-center justify-between hover:bg-white/[0.08] hover:border-cyan-500/30 transition-all cursor-pointer backdrop-blur-sm shadow-xl"
                         @click="materialize(file.id)">
                        <div class="flex items-center gap-6">
                            <div class="w-16 h-16 bg-black/60 rounded-2xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform duration-500 relative">
                                <span class="relative z-10">📄</span>
                                <div class="absolute inset-2 bg-cyan-500/20 rounded-full blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                            <div>
                                <div class="text-sm font-black text-white/90 group-hover:text-cyan-400 transition-colors tracking-wide" x-text="file.name"></div>
                                <div class="flex items-center gap-4 mt-2">
                                    <div class="text-[9px] text-white/20 font-mono tracking-widest" x-text="'PHANTOM::' + file.id.slice(0,12)"></div>
                                    <div class="flex gap-1">
                                        <template x-for="i in file.shard_count">
                                            <div class="w-3 h-1 rounded-full" 
                                                 :class="i <= file.healthy_count ? 'bg-cyan-500 shadow-[0_0_5px_#00f2ff]' : 'bg-red-900'"></div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end gap-2">
                            <div class="text-[9px] font-black uppercase text-cyan-400/60 tracking-widest" x-text="(file.integrity * 100).toFixed(0) + '% INTEGRITY'"></div>
                            <button class="px-6 py-2 bg-white/5 border border-white/10 rounded-full text-[10px] text-white/40 uppercase font-black tracking-widest group-hover:bg-cyan-500 group-hover:text-black group-hover:border-transparent transition-all shadow-2xl">
                                Materialize
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 🚢 Universal Protection Footer -->
    <div class="relative z-10 p-4 border-t border-white/5 text-center bg-black/40">
        <p class="text-[8px] text-white/20 uppercase tracking-[0.5em] font-medium">Sovereign_File_Submersion_Network // Node_Active</p>
    </div>

    <script>
        // Fluid Background Logic
        (function() {
            const canvas = document.getElementById('abyssalFluid');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            function init() {
                w = canvas.width = canvas.offsetWidth;
                h = canvas.height = canvas.offsetHeight;
                particles = [];
                for(let i=0; i<30; i++) particles.push({
                    x: Math.random() * w, 
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 80 + 20
                });
            }

            function draw() {
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#00f2ff';
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0 || p.x>w) p.vx *= -1;
                    if(p.y<0 || p.y>h) p.vy *= -1;
                    
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                    grad.addColorStop(0, 'rgba(0, 242, 255, 0.05)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', init);
            init();
            draw();
        })();
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.3); }
        .bioluminescence { box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); animation: bio-pulse 4s infinite; }
        @keyframes bio-pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; filter: brightness(1.2); } }
    </style>
</div>
