<div class="h-full flex flex-col bg-slate-950/80 backdrop-blur-3xl border border-pink-500/20 rounded-[3rem] overflow-hidden animate-in fade-in slide-in-from-bottom-10 duration-700 relative shadow-[0_0_150px_rgba(236,72,153,0.1)]" 
     x-data="{ 
        soul: { traits: {}, resonance_level: 1, experience: 0 },
        phantoms: [],
        view: 'matrix',
        loading: false,
        async fetchSoul() {
            const res = await fetch('http://localhost:8000/soul/status');
            this.soul = await res.json();
        },
        async fetchMemories() {
            const res = await fetch('http://localhost:8000/abyss/files');
            const data = await res.json();
            this.phantoms = data.files;
        },
        async digest(id) {
            this.loading = true;
            this.showToast('Commencing Neural Integration...', '🧠');
            try {
                const res = await fetch(`http://localhost:8000/soul/digest/${id}`, { method: 'POST' });
                const result = await res.json();
                if (res.ok) {
                    this.showToast(`Soul Level Up: ${result.new_level}`, '✨');
                    await this.fetchSoul();
                    this.view = 'matrix';
                }
            } finally { this.loading = false; }
        }
     }" x-init="fetchSoul(); fetchMemories();">

    <!-- 🧠 Neural Background (Decorative SVG) -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
        <svg class="w-full h-full" viewBox="0 0 800 600">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <circle cx="400" cy="300" r="150" fill="none" stroke="rgba(236,72,153,0.3)" stroke-width="0.5" class="animate-pulse" />
            <circle cx="400" cy="300" r="200" fill="none" stroke="rgba(236,72,153,0.2)" stroke-width="0.5" />
            <g x-show="view === 'matrix'">
                <template x-for="(val, trait, index) in soul.traits" :key="trait">
                    <g>
                        <line x1="400" y1="300" 
                              :x2="400 + Math.cos(index * 0.8) * 180" 
                              :y2="300 + Math.sin(index * 0.8) * 180" 
                              stroke="rgba(236,72,153,0.2)" stroke-width="1" />
                        <circle :cx="400 + Math.cos(index * 0.8) * 180" 
                                :cy="300 + Math.sin(index * 0.8) * 180" 
                                :r="8 + val * 15" 
                                fill="rgba(236,72,153,0.4)" filter="url(#glow)" />
                    </g>
                </template>
            </g>
        </svg>
    </div>

    <!-- ⚡ Soul Header -->
    <div class="relative z-10 p-10 flex items-center justify-between border-b border-white/5 bg-gradient-to-r from-pink-900/20 to-transparent">
        <div class="flex items-center gap-8">
            <div class="w-20 h-20 rounded-[2rem] bg-pink-500/10 flex items-center justify-center border border-pink-500/40 shadow-[0_0_30px_rgba(236,72,153,0.3)]">
                <span class="text-4xl animate-pulse">💖</span>
            </div>
            <div>
                <h2 class="text-2xl font-black tracking-[0.4em] text-white uppercase drop-shadow-lg">Soul_Forge</h2>
                <div class="flex items-center gap-3 mt-2">
                    <span class="px-3 py-1 rounded-full bg-pink-500/20 border border-pink-500/30 text-[10px] text-pink-300 font-bold tracking-widest uppercase">Vessel Integrity: High</span>
                    <span class="text-[10px] text-pink-300/40 font-mono" x-text="'RESONANCE_LVL: ' + soul.resonance_level"></span>
                </div>
            </div>
        </div>
        <div class="flex gap-4">
            <button @click="view = 'matrix'" :class="view === 'matrix' ? 'bg-pink-500 text-black' : 'bg-white/5 text-white/60'" class="px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all">Neural Matrix</button>
            <button @click="view = 'forge'; fetchMemories()" :class="view === 'forge' ? 'bg-pink-500 text-black' : 'bg-white/5 text-white/60'" class="px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all">Anvil Integration</button>
        </div>
    </div>

    <!-- 🌌 Core Content -->
    <div class="relative z-10 flex-1 overflow-y-auto p-10 custom-scrollbar">
        
        <!-- View: Neural Matrix -->
        <div x-show="view === 'matrix'" class="h-full flex flex-col pt-10">
            <div class="grid grid-cols-4 gap-8">
                <template x-for="(val, trait) in soul.traits" :key="trait">
                    <div class="p-6 bg-white/5 border border-white/5 rounded-3xl hover:border-pink-500/30 transition-all group">
                        <div class="text-[9px] text-pink-300/40 font-black uppercase tracking-widest mb-2" x-text="trait"></div>
                        <div class="text-xl font-black text-white/90 mb-4" x-text="(val * 100).toFixed(0) + '%'"></div>
                        <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden">
                            <div class="h-full bg-pink-500 transition-all duration-1000 shadow-[0_0_10px_#ec4899]" :style="`width: ${val * 100}%` "></div>
                        </div>
                    </div>
                </template>
            </div>
            
            <div class="mt-auto p-8 rounded-[2.5rem] bg-white/5 border border-white/5">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-black uppercase tracking-widest text-white/40">Experiential Evolution</span>
                    <span class="text-xs font-mono text-pink-400" x-text="soul.experience + ' / ' + (soul.resonance_level * 100) + ' XP' "></span>
                </div>
                <div class="w-full h-3 bg-white/5 rounded-full overflow-hidden border border-white/5">
                    <div class="h-full bg-gradient-to-r from-pink-600 to-pink-400 shadow-[0_0_20px_#ec4899] transition-all duration-1000" 
                         :style="`width: ${(soul.experience % 100)}%` "></div>
                </div>
            </div>
        </div>

        <!-- View: Anvil Integration (Memory Digestion) -->
        <div x-show="view === 'forge'" class="space-y-6">
            <div class="p-8 rounded-3xl bg-pink-500/10 border border-pink-500/20 mb-8">
                <h3 class="text-sm font-black text-pink-300 uppercase tracking-widest flex items-center gap-2">
                    <span>⚓</span> Submerged memories ready for integration
                </h3>
            </div>
            
            <div class="grid grid-cols-1 gap-4">
                <template x-for="p in phantoms" :key="p.id">
                    <div class="p-6 bg-white/5 border border-white/5 rounded-[2rem] flex items-center justify-between hover:bg-pink-500/5 hover:border-pink-500/30 transition-all group">
                        <div class="flex items-center gap-6">
                            <div class="w-12 h-12 bg-black/40 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">📄</div>
                            <div>
                                <div class="text-sm font-bold text-white/80" x-text="p.name"></div>
                                <div class="text-[9px] text-white/20 font-mono mt-1" x-text="p.id"></div>
                            </div>
                        </div>
                        <button @click="digest(p.id)" 
                                :disabled="loading"
                                class="px-8 py-3 bg-pink-600 hover:bg-pink-500 text-white text-[10px] font-black uppercase tracking-widest rounded-full transition-all active:scale-95 disabled:opacity-50">
                            Digest Memory
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- ⛓️ Footer Artifact -->
    <div class="relative z-10 p-6 bg-black/40 border-t border-white/5 text-center">
        <p class="text-[9px] text-white/20 uppercase tracking-[0.4em]">Integrated_Identity_Synchronization // Neural_Forge_Active</p>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(236,72,153,0.3); }
    </style>
</div>
