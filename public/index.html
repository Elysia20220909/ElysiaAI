<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ElysiaAI Daily Local Desk</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f7f8fb;
			--panel: #ffffff;
			--ink: #162033;
			--muted: #667085;
			--line: #d7dce5;
			--blue: #2563eb;
			--green: #15803d;
			--amber: #b45309;
			--red: #b91c1c;
			--soft-blue: #e8f0ff;
			--soft-green: #e8f7ee;
			--soft-amber: #fff3df;
			--soft-red: #feecec;
			font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: var(--bg);
			color: var(--ink);
		}

		button,
		input {
			font: inherit;
		}

		button {
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--panel);
			color: var(--ink);
			cursor: pointer;
			min-height: 40px;
			padding: 0 14px;
		}

		button.primary {
			background: var(--blue);
			border-color: var(--blue);
			color: #ffffff;
		}

		button:disabled {
			cursor: not-allowed;
			opacity: 0.55;
		}

		.app {
			display: grid;
			grid-template-columns: 280px minmax(0, 1fr) 340px;
			min-height: 100vh;
		}

		.sidebar,
		.workspace,
		.inspector {
			min-width: 0;
		}

		.sidebar {
			border-right: 1px solid var(--line);
			background: #fbfcff;
			padding: 20px;
		}

		.workspace {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr) auto;
			padding: 20px;
			gap: 14px;
		}

		.inspector {
			border-left: 1px solid var(--line);
			background: #fbfcff;
			padding: 20px;
			overflow: auto;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 22px;
		}

		.mark {
			display: grid;
			place-items: center;
			width: 40px;
			height: 40px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: linear-gradient(135deg, #ffffff, #e8f0ff);
			font-weight: 800;
			color: var(--blue);
		}

		h1,
		h2,
		h3,
		p {
			margin: 0;
		}

		h1 {
			font-size: 18px;
			letter-spacing: 0;
		}

		h2 {
			font-size: 15px;
			margin-bottom: 10px;
		}

		h3 {
			font-size: 13px;
			margin-bottom: 8px;
		}

		.muted {
			color: var(--muted);
			font-size: 12px;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
		}

		.section {
			margin-top: 18px;
		}

		.gate-list,
		.source-list,
		.memory-list,
		.search-list {
			display: grid;
			gap: 8px;
		}

		.gate {
			display: grid;
			grid-template-columns: 10px minmax(0, 1fr);
			gap: 10px;
			align-items: start;
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
		}

		.dot {
			width: 10px;
			height: 10px;
			margin-top: 4px;
			border-radius: 999px;
			background: var(--muted);
		}

		.gate.ready .dot {
			background: var(--green);
		}

		.gate.attention .dot {
			background: var(--amber);
		}

		.gate.blocked .dot {
			background: var(--red);
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
		}

		.status-pill {
			border-radius: 999px;
			border: 1px solid var(--line);
			padding: 7px 10px;
			background: var(--panel);
			color: var(--muted);
			font-size: 12px;
			white-space: nowrap;
		}

		.status-pill.ready {
			background: var(--soft-green);
			color: var(--green);
			border-color: #b7e3c4;
		}

		.status-pill.blocked {
			background: var(--soft-red);
			color: var(--red);
			border-color: #fac8c8;
		}

		.status-pill.attention {
			background: var(--soft-amber);
			color: var(--amber);
			border-color: #f1d29d;
		}

		.chat {
			overflow: auto;
			padding: 18px;
		}

		.message-list {
			display: grid;
			gap: 12px;
			max-width: 920px;
			margin: 0 auto;
		}

		.message {
			display: grid;
			gap: 5px;
			max-width: 76%;
		}

		.message.user {
			justify-self: end;
		}

		.message.assistant {
			justify-self: start;
		}

		.bubble {
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 12px 14px;
			line-height: 1.65;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
			background: var(--panel);
		}

		.message.user .bubble {
			background: var(--soft-blue);
			border-color: #bfd2ff;
		}

		.message.assistant .bubble {
			background: #ffffff;
		}

		.composer {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 10px;
			max-width: 920px;
			width: 100%;
			margin: 0 auto;
		}

		input {
			width: 100%;
			min-height: 42px;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--panel);
			color: var(--ink);
			padding: 0 12px;
			outline: none;
		}

		input:focus {
			border-color: var(--blue);
			box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
		}

		.search-box {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 8px;
		}

		.item {
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
		}

		.path {
			font-family: Consolas, "SFMono-Regular", ui-monospace, monospace;
			font-size: 11px;
			color: var(--blue);
			overflow-wrap: anywhere;
		}

		.snippet {
			margin-top: 6px;
			font-size: 12px;
			line-height: 1.55;
			color: var(--ink);
			overflow-wrap: anywhere;
		}

		.empty {
			display: grid;
			place-items: center;
			min-height: 100%;
			text-align: center;
			color: var(--muted);
			gap: 8px;
		}

		.empty strong {
			color: var(--ink);
			font-size: 18px;
		}

		.toolbar {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
		}

		.section-heading {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 10px;
		}

		.section-heading h2 {
			margin-bottom: 0;
		}

		button.small {
			min-height: 30px;
			padding: 0 9px;
			font-size: 12px;
		}

		button.danger {
			color: var(--red);
			border-color: #fac8c8;
			background: var(--soft-red);
		}

		.item-head {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 8px;
		}

		.summary-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 8px;
			margin-bottom: 8px;
		}

		.summary-pill {
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
			padding: 9px;
			min-width: 0;
		}

		.summary-pill.ok {
			background: var(--soft-green);
			border-color: #b7e3c4;
		}

		.summary-pill.attention {
			background: var(--soft-amber);
			border-color: #f1d29d;
		}

		.summary-pill.critical {
			background: var(--soft-red);
			border-color: #fac8c8;
		}

		@media (max-width: 1100px) {
			.app {
				grid-template-columns: 240px minmax(0, 1fr);
			}

			.inspector {
				grid-column: 1 / -1;
				border-left: 0;
				border-top: 1px solid var(--line);
				max-height: 38vh;
			}
		}

		@media (max-width: 760px) {
			.app {
				display: block;
			}

			.sidebar,
			.inspector {
				border: 0;
				border-bottom: 1px solid var(--line);
			}

			.workspace {
				min-height: 72vh;
				padding: 14px;
			}

			.topbar,
			.composer,
			.search-box {
				grid-template-columns: 1fr;
				display: grid;
				align-items: stretch;
			}

			.message {
				max-width: 100%;
			}
		}
	</style>
</head>
<body>
	<div class="app" data-app>
		<aside class="sidebar">
			<div class="brand">
				<div class="mark">E</div>
				<div>
					<h1>ElysiaAI</h1>
					<p class="muted">毎日使うローカルAIデスク</p>
				</div>
			</div>

			<div class="section">
				<h2>MVPの現在地</h2>
				<div class="gate-list" data-gates></div>
			</div>

			<div class="section">
				<div class="section-heading">
					<h2>記憶</h2>
					<button class="small" data-clear-memory type="button">Clear</button>
				</div>
				<div class="memory-list" data-memory></div>
			</div>
		</aside>

		<main class="workspace">
			<header class="topbar">
				<div>
					<h2>今日のAIデスク</h2>
					<p class="muted" data-session>session: starting</p>
				</div>
				<div class="toolbar">
					<span class="status-pill" data-auth>auth: checking</span>
					<span class="status-pill" data-mode>mode: idle</span>
				</div>
			</header>

			<section class="panel chat" data-chat>
				<div class="empty" data-empty>
					<strong>今日の席はまだ静かです。</strong>
					<span>質問、検索、記憶がここに整います。</span>
				</div>
				<div class="message-list" data-messages></div>
			</section>

			<form class="composer" data-composer>
				<input
					data-input
					type="text"
					autocomplete="off"
					placeholder="今日片づけたいことを聞く"
					maxlength="1200"
				/>
				<button class="primary" data-send type="submit">Ask</button>
			</form>
		</main>

		<aside class="inspector">
			<section>
				<h2>ローカルファイル</h2>
				<form class="search-box" data-search-form>
					<input
						data-search-input
						type="text"
						autocomplete="off"
						placeholder="探したいメモやコード"
						maxlength="400"
					/>
					<button data-search-button type="submit">Find</button>
				</form>
				<div class="section search-list" data-search-results></div>
			</section>

			<section class="section">
				<h2>参照した文脈</h2>
				<div class="source-list" data-sources></div>
			</section>

			<section class="section">
				<div class="section-heading">
					<h2>Security Agent</h2>
					<button class="small" data-security-refresh type="button">Scan</button>
				</div>
				<div class="source-list" data-security-status></div>
				<div class="section source-list" data-security-results></div>
			</section>
		</aside>
	</div>

	<script>
		const state = {
			sessionId:
				localStorage.getItem("elysia_mvp_session") ||
				`mvp-${Date.now().toString(36)}`,
			csrfToken:
				localStorage.getItem("elysia_csrf_token") ||
				readCookie("elysia_csrf_token") ||
				"",
			accessToken: "",
			messages: JSON.parse(localStorage.getItem("elysia_mvp_messages") || "[]"),
			loading: false,
			mode: "idle",
			sources: [],
		};

		localStorage.setItem("elysia_mvp_session", state.sessionId);

		const el = {
			auth: document.querySelector("[data-auth]"),
			chat: document.querySelector("[data-chat]"),
			clearMemory: document.querySelector("[data-clear-memory]"),
			composer: document.querySelector("[data-composer]"),
			empty: document.querySelector("[data-empty]"),
			gates: document.querySelector("[data-gates]"),
			input: document.querySelector("[data-input]"),
			memory: document.querySelector("[data-memory]"),
			messages: document.querySelector("[data-messages]"),
			mode: document.querySelector("[data-mode]"),
			searchButton: document.querySelector("[data-search-button]"),
			searchForm: document.querySelector("[data-search-form]"),
			searchInput: document.querySelector("[data-search-input]"),
			searchResults: document.querySelector("[data-search-results]"),
			securityRefresh: document.querySelector("[data-security-refresh]"),
			securityResults: document.querySelector("[data-security-results]"),
			securityStatus: document.querySelector("[data-security-status]"),
			send: document.querySelector("[data-send]"),
			session: document.querySelector("[data-session]"),
			sources: document.querySelector("[data-sources]"),
		};

		function readCookie(name) {
			return document.cookie
				.split(";")
				.map((part) => part.trim())
				.find((part) => part.startsWith(`${name}=`))
				?.split("=")
				.slice(1)
				.join("=") || "";
		}

		function escapeHtml(value) {
			return String(value)
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#039;");
		}

		function setPill(node, text, status) {
			node.textContent = text;
			node.className = `status-pill ${status || ""}`.trim();
		}

		function authHeaders(json = true) {
			const headers = {};
			if (json) headers["Content-Type"] = "application/json";
			if (state.accessToken)
				headers.Authorization = `Bearer ${state.accessToken}`;
			if (state.csrfToken) headers["X-CSRF-Token"] = state.csrfToken;
			return headers;
		}

		async function ensureAuth() {
			const cookieToken = readCookie("elysia_csrf_token");
			if (cookieToken && cookieToken !== state.csrfToken) {
				state.csrfToken = cookieToken;
				localStorage.setItem("elysia_csrf_token", state.csrfToken);
			}
			if (state.accessToken) {
				setPill(el.auth, "auth: local", "ready");
				return true;
			}
			if (state.csrfToken && cookieToken) {
				const sessionResponse = await fetch("/auth/session", {
					credentials: "same-origin",
				});
				const sessionData = await sessionResponse.json().catch(() => ({}));
				if (sessionResponse.ok && sessionData.authenticated) {
					setPill(el.auth, "auth: local", "ready");
					return true;
				}
			}
			state.csrfToken = "";
			localStorage.removeItem("elysia_csrf_token");
			const response = await fetch("/auth/dev-login", {
				method: "POST",
				credentials: "same-origin",
			});
			const data = await response.json().catch(() => ({}));
			if (!response.ok) {
				setPill(el.auth, "auth: locked", "blocked");
				throw new Error(data.error || "dev login is disabled");
			}
			state.csrfToken = data.csrfToken || readCookie("elysia_csrf_token") || "";
			state.accessToken = data.accessToken || "";
			localStorage.setItem("elysia_csrf_token", state.csrfToken);
			setPill(el.auth, `auth: ${data.username || "local"}`, "ready");
			return true;
		}

		function saveMessages() {
			localStorage.setItem("elysia_mvp_messages", JSON.stringify(state.messages));
		}

		function renderMessages() {
			el.empty.style.display = state.messages.length ? "none" : "grid";
			el.messages.innerHTML = state.messages
				.map(
					(message) => `
						<article class="message ${message.role}">
							<p class="muted">${message.role === "user" ? "You" : "ElysiaAI"}</p>
							<div class="bubble">${escapeHtml(message.content)}</div>
						</article>
					`,
				)
				.join("");
			el.chat.scrollTop = el.chat.scrollHeight;
		}

		function renderSources(sources) {
			state.sources = sources || [];
			if (!state.sources.length) {
				el.sources.innerHTML = `<div class="item muted">まだ参照元はありません。</div>`;
				return;
			}
			el.sources.innerHTML = state.sources
				.map(
					(source) => `
						<div class="item">
							<div class="path">${escapeHtml(source.path)}:${source.line}</div>
							<div class="snippet">${escapeHtml(source.snippet)}</div>
						</div>
					`,
				)
				.join("");
		}

		function renderSearch(results) {
			if (!results.length) {
				el.searchResults.innerHTML = `<div class="item muted">一致するローカル文脈はまだありません。</div>`;
				return;
			}
			el.searchResults.innerHTML = results
				.map(
					(result) => `
						<div class="item">
							<div class="path">${escapeHtml(result.path)}:${result.line}</div>
							<div class="snippet">${escapeHtml(result.snippet)}</div>
						</div>
					`,
				)
				.join("");
		}

		async function refreshReadiness() {
			const response = await fetch("/api/mvp/readiness", {
				credentials: "same-origin",
			});
			const data = await response.json();
			el.gates.innerHTML = data.gates
				.map(
					(gate) => `
						<div class="gate ${gate.status}">
							<span class="dot"></span>
							<div>
								<h3>${escapeHtml(gate.label)}</h3>
								<p class="muted">${escapeHtml(gate.detail)}</p>
							</div>
						</div>
					`,
				)
				.join("");
			setPill(
				el.mode,
				`mode: ${state.mode}`,
				data.status === "blocked" ? "blocked" : "ready",
			);
		}

		async function refreshMemory() {
			try {
				await ensureAuth();
				const response = await fetch(
					`/api/mvp/memory?sessionId=${encodeURIComponent(state.sessionId)}`,
					{ credentials: "same-origin", headers: authHeaders(false) },
				);
				const data = await response.json();
				if (!response.ok) throw new Error(data.error || "memory is locked");
				if (!data.recent?.length) {
					el.clearMemory.disabled = true;
					el.memory.innerHTML = `<div class="item muted">まだ記憶はありません。</div>`;
					return;
				}
				el.clearMemory.disabled = false;
				el.memory.innerHTML = data.recent
					.slice(-4)
					.reverse()
					.map(
						(memory) => `
							<div class="item">
								<div class="item-head">
									<div class="path">${escapeHtml(memory.role)} · ${escapeHtml(memory.createdAt)}</div>
									<button class="small danger" data-delete-memory="${escapeHtml(memory.id)}" type="button">削除</button>
								</div>
								<div class="snippet">${escapeHtml(memory.content)}</div>
							</div>
						`,
					)
					.join("");
			} catch {
				el.clearMemory.disabled = true;
				el.memory.innerHTML = `<div class="item muted">記憶はロックされています。</div>`;
			}
		}

		function renderSecurityAgent(report) {
			const summaries = Object.values(report.summary || {});
			el.securityStatus.innerHTML = `
				<div class="item">
					<div class="path">status: ${escapeHtml(report.status || "unknown")}</div>
					<div class="snippet">last scan: ${escapeHtml(report.generatedAt || "not yet")}</div>
				</div>
			`;
			const summaryHtml = summaries
				.map(
					(item) => `
						<div class="summary-pill ${escapeHtml(item.severity)}">
							<div class="path">${escapeHtml(item.label)}</div>
							<div class="snippet">${escapeHtml(item.severity)} · ${Number(item.count || 0)} alerts</div>
						</div>
					`,
				)
				.join("");
			const findings = (report.findings || [])
				.filter((finding) => finding.severity !== "ok")
				.slice(0, 6);
			const fallback = (report.findings || [])
				.filter((finding) => finding.severity === "ok")
				.slice(0, 4);
			const visibleFindings = findings.length ? findings : fallback;
			const findingHtml = visibleFindings
				.map(
					(finding) => `
						<div class="item">
							<div class="path">${escapeHtml(finding.severity)} · ${escapeHtml(finding.title)}</div>
							<div class="snippet">${escapeHtml(finding.detail)}</div>
							${
								finding.path
									? `<div class="snippet">${escapeHtml(finding.path)}${finding.line ? `:${finding.line}` : ""}</div>`
									: ""
							}
						</div>
					`,
				)
				.join("");
			const actionRuns = (report.actions?.runs || []).slice(0, 4);
			const actionHtml = actionRuns.length
				? `
					<div class="item">
						<div class="path">GitHub Actions · ${escapeHtml(report.actions.repository)}</div>
						${actionRuns
							.map(
								(run) => `
									<div class="snippet">
										${escapeHtml(run.workflowName)} · ${escapeHtml(run.status)}${run.conclusion ? ` / ${escapeHtml(run.conclusion)}` : ""}<br />
										${escapeHtml(run.title)} · ${escapeHtml(run.updatedAt || run.createdAt)}
									</div>
								`,
							)
							.join("")}
					</div>
				`
				: "";
			el.securityResults.innerHTML = `
				<div class="summary-grid">${summaryHtml}</div>
				${actionHtml}
				${findingHtml || `<div class="item muted">Security Agent is quiet.</div>`}
			`;
		}

		async function refreshSecurityAgent() {
			try {
				await ensureAuth();
				el.securityRefresh.disabled = true;
				el.securityStatus.innerHTML = `<div class="item muted">Security Agentが確認中です。</div>`;
				const response = await fetch("/api/mvp/security-agent", {
					credentials: "same-origin",
					headers: authHeaders(false),
				});
				const data = await response.json();
				if (!response.ok) throw new Error(data.error || "security scan failed");
				renderSecurityAgent(data);
			} catch (error) {
				el.securityStatus.innerHTML = `<div class="item muted">${
					error instanceof Error
						? escapeHtml(error.message)
						: "Security Agent is locked."
				}</div>`;
				el.securityResults.innerHTML = "";
			} finally {
				el.securityRefresh.disabled = false;
			}
		}

		async function deleteMemory(id) {
			if (!id) return;
			await ensureAuth();
			const response = await fetch(
				`/api/mvp/memory/${encodeURIComponent(id)}?sessionId=${encodeURIComponent(state.sessionId)}`,
				{
					method: "DELETE",
					credentials: "same-origin",
					headers: authHeaders(false),
				},
			);
			if (!response.ok) {
				const data = await response.json().catch(() => ({}));
				throw new Error(data.error || "memory delete failed");
			}
			await refreshMemory();
			await refreshReadiness();
		}

		async function clearMemory() {
			if (!window.confirm("このセッションの記憶をすべて削除します。よろしいですか？")) {
				return;
			}
			await ensureAuth();
			el.clearMemory.disabled = true;
			const response = await fetch(
				`/api/mvp/memory?sessionId=${encodeURIComponent(state.sessionId)}`,
				{
					method: "DELETE",
					credentials: "same-origin",
					headers: authHeaders(false),
				},
			);
			if (!response.ok) {
				const data = await response.json().catch(() => ({}));
				throw new Error(data.error || "memory clear failed");
			}
			await refreshMemory();
			await refreshReadiness();
		}

		async function sendMessage(event) {
			event.preventDefault();
			if (state.loading || !el.input.value.trim()) return;
			await ensureAuth();

			const content = el.input.value.trim();
			el.input.value = "";
			state.messages.push({ role: "user", content });
			const assistant = { role: "assistant", content: "" };
			state.messages.push(assistant);
			state.loading = true;
			state.mode = "thinking";
			el.send.disabled = true;
			setPill(el.mode, "mode: thinking", "");
			renderMessages();
			saveMessages();

			try {
				const response = await fetch("/api/elysia-core/chat", {
					method: "POST",
					credentials: "same-origin",
					headers: authHeaders(),
					body: JSON.stringify({
						messages: state.messages.slice(0, -1),
						sessionId: state.sessionId,
						stream: true,
					}),
				});

				if (!response.ok || !response.body) {
					const data = await response.json().catch(() => ({}));
					throw new Error(data.error || `chat failed: ${response.status}`);
				}

				state.mode = response.headers.get("x-elysia-core-mode") || "local";
				setPill(el.mode, `mode: ${state.mode}`, "ready");

				const reader = response.body.getReader();
				const decoder = new TextDecoder();
				let buffer = "";
				while (true) {
					const { done, value } = await reader.read();
					if (done) break;
					buffer += decoder.decode(value, { stream: true });
					const frames = buffer.split("\n\n");
					buffer = frames.pop() || "";
					for (const frame of frames) {
						const line = frame.split("\n").find((entry) => entry.startsWith("data: "));
						if (!line || line === "data: [DONE]") continue;
						const data = JSON.parse(line.slice(6));
						if (data.content) {
							assistant.content += data.content;
							renderMessages();
						}
						if (data.sources) renderSources(data.sources);
						if (data.mode) {
							state.mode = data.mode;
							setPill(el.mode, `mode: ${state.mode}`, "ready");
						}
					}
				}
				if (!assistant.content) assistant.content = "No response body was returned.";
				saveMessages();
				await refreshMemory();
				await refreshReadiness();
			} catch (error) {
				assistant.content =
					error instanceof Error ? error.message : "Local chat failed.";
				state.mode = "error";
				setPill(el.mode, "mode: error", "blocked");
				renderMessages();
				saveMessages();
			} finally {
				state.loading = false;
				el.send.disabled = false;
			}
		}

		async function searchFiles(event) {
			event.preventDefault();
			const query = el.searchInput.value.trim();
			if (!query) return;
			await ensureAuth();
			el.searchButton.disabled = true;
			try {
				const response = await fetch("/api/mvp/search", {
					method: "POST",
					credentials: "same-origin",
					headers: authHeaders(),
					body: JSON.stringify({ query, limit: 8 }),
				});
				const data = await response.json();
				if (!response.ok) throw new Error(data.error || "search failed");
				renderSearch(data.results || []);
			} catch (error) {
				renderSearch([
					{
						path: "search",
						line: 0,
						snippet:
							error instanceof Error ? error.message : "Local search failed.",
					},
				]);
			} finally {
				el.searchButton.disabled = false;
			}
		}

		async function boot() {
			el.session.textContent = `session: ${state.sessionId}`;
			renderMessages();
			renderSources([]);
			renderSearch([]);
			el.securityStatus.innerHTML = `<div class="item muted">Security Agentは待機中です。</div>`;
			el.securityResults.innerHTML = "";
			try {
				await ensureAuth();
			} catch {
				setPill(el.auth, "auth: locked", "blocked");
			}
			await refreshReadiness();
			await refreshMemory();
			await refreshSecurityAgent();
			window.setInterval(refreshReadiness, 15000);
		}

		el.composer.addEventListener("submit", sendMessage);
		el.clearMemory.addEventListener("click", () => {
			clearMemory().catch((error) => {
				el.memory.innerHTML = `<div class="item muted">${escapeHtml(error.message || "Memory clear failed.")}</div>`;
			});
		});
		el.memory.addEventListener("click", (event) => {
			const button = event.target.closest("[data-delete-memory]");
			if (!button) return;
			deleteMemory(button.dataset.deleteMemory).catch((error) => {
				el.memory.innerHTML = `<div class="item muted">${escapeHtml(error.message || "Memory delete failed.")}</div>`;
			});
		});
		el.searchForm.addEventListener("submit", searchFiles);
		el.securityRefresh.addEventListener("click", refreshSecurityAgent);
		boot();
	</script>
</body>
</html>
