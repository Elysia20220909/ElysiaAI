<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=../mark85-status-badge/" />
    <title>E.L.I.S.I.A. Mark XLVII Remote Link Badge</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f10;
        --text: #f4efe7;
        --line: #3e464b;
        --cyan: #64d8e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      a {
        color: var(--cyan);
      }

      .panel {
        width: min(520px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Mark XLVII Remote Link Badge</h1>
      <p>Opening the local simulator...</p>
      <p><a href="../mark85-status-badge/">Open simulator</a></p>
    </main>
  </body>
</html>
