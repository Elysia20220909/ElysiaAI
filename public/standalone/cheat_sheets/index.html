<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference Matrix // Cheat Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
        }
        /* Custom Scrollbar for Hacker Aesthetic */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000; 
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ec4899; 
        }
        
        /* Markdown Rendering Styles */
        .markdown-body {
            color: #cbd5e1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.6;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: #f472b6;
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            border-bottom: 1px solid rgba(244, 114, 182, 0.2);
            padding-bottom: 0.3em;
        }
        .markdown-body p {
            margin-top: 0;
            margin-bottom: 16px;
        }
        .markdown-body a {
            color: #22d3ee;
            text-decoration: none;
        }
        .markdown-body a:hover {
            text-decoration: underline;
        }
        .markdown-body code {
            background-color: rgba(255,255,255,0.1);
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-size: 85%;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }
        .markdown-body pre {
            background-color: #0f172a;
            padding: 16px;
            overflow: auto;
            border-radius: 6px;
            border: 1px solid #1e293b;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body blockquote {
            margin: 0;
            padding: 0 1em;
            color: #94a3b8;
            border-left: 0.25em solid #f472b6;
        }
        .markdown-body table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-top: 0;
            margin-bottom: 16px;
            width: 100%;
        }
        .markdown-body table th, .markdown-body table td {
            padding: 6px 13px;
            border: 1px solid #334155;
        }
        .markdown-body table tr {
            background-color: #0f172a;
            border-top: 1px solid #334155;
        }
        .markdown-body table tr:nth-child(2n) {
            background-color: #1e293b;
        }
        
        .tree-node {
            cursor: pointer;
            padding: 2px 0;
            transition: all 0.2s;
        }
        .tree-node:hover {
            color: #f472b6;
            padding-left: 4px;
        }
        .tree-active {
            color: #22d3ee;
            font-weight: bold;
        }
        .tree-active::before {
            content: "> ";
        }
    </style>
</head>
<body x-data="referenceMatrix()">
    <div class="flex h-screen w-full">
        <!-- Sidebar Navigation -->
        <div class="w-1/3 max-w-xs border-r border-white/10 bg-black/60 backdrop-blur-md flex flex-col h-full">
            <div class="p-4 border-b border-pink-500/20 bg-pink-500/5">
                <h1 class="text-xs font-black tracking-[0.2em] text-pink-400 uppercase flex items-center gap-2">
                    <span class="text-lg">📚</span> Matrix Index
                </h1>
                <input type="text" x-model="searchQuery" placeholder="Filter references..." 
                       class="mt-3 w-full bg-white/5 border border-white/10 rounded-md px-3 py-1.5 text-[10px] text-white focus:outline-none focus:border-pink-500/50 focus:bg-white/10 transition-colors">
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-1">
                <template x-if="loading">
                    <div class="text-[10px] text-pink-400/60 animate-pulse text-center mt-10">
                        Scanning Synaptic Archives...
                    </div>
                </template>
                <template x-for="file in filteredFiles" :key="file">
                    <div class="text-[11px] truncate tree-node"
                         :class="{ 'tree-active': currentFile === file }"
                         @click="loadFile(file)"
                         :title="file"
                         x-text="file.replace('README.md', '📄 README.md').replace('.md', '')">
                    </div>
                </template>
                <template x-if="!loading && filteredFiles.length === 0">
                    <div class="text-[10px] text-white/30 text-center mt-10">
                        No records found.
                    </div>
                </template>
            </div>
        </div>

        <!-- Content Viewer -->
        <div class="flex-1 flex flex-col h-full bg-[#030303] relative">
            <div class="h-10 border-b border-white/5 flex items-center px-6 justify-between bg-black/40">
                <div class="text-[10px] text-white/50 tracking-widest uppercase font-bold" x-text="currentFile || 'Awaiting Input...'"></div>
                <div class="flex gap-2">
                    <div class="w-2 h-2 rounded-full animate-pulse" :class="fileLoading ? 'bg-cyan-500' : 'bg-pink-500'"></div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-8 relative">
                <!-- Background Decoration -->
                <div class="absolute inset-0 pointer-events-none flex justify-center items-center opacity-5">
                    <div class="text-[200px]">⚙️</div>
                </div>
                
                <template x-if="!currentFile && !fileLoading">
                    <div class="h-full flex flex-col items-center justify-center text-white/20">
                        <div class="text-6xl mb-4">🗃️</div>
                        <p class="text-xs uppercase tracking-widest font-bold">Select a module to initiate transfer</p>
                    </div>
                </template>
                
                <template x-if="fileLoading">
                    <div class="h-full flex flex-col items-center justify-center text-cyan-400/60 space-y-4">
                        <div class="text-4xl animate-spin">🌀</div>
                        <p class="text-[10px] uppercase tracking-[0.2em]">Decoupling Data Stream...</p>
                    </div>
                </template>
                
                <div x-show="currentFile && !fileLoading" 
                     class="markdown-body relative z-10 max-w-4xl mx-auto" 
                     x-html="markdownContent">
                </div>
            </div>
        </div>
    </div>

    <script>
        function referenceMatrix() {
            return {
                files: [],
                searchQuery: '',
                currentFile: null,
                markdownContent: '',
                loading: true,
                fileLoading: false,

                get filteredFiles() {
                    if (!this.searchQuery) return this.files;
                    const q = this.searchQuery.toLowerCase();
                    return this.files.filter(f => f.toLowerCase().includes(q));
                },

                async init() {
                    try {
                        const res = await fetch('tree.json');
                        if (!res.ok) throw new Error('Tree not found');
                        this.files = await res.json();
                        // Sort files to put README.md first
                        this.files.sort((a, b) => {
                            const aIsReadme = a.endsWith('README.md');
                            const bIsReadme = b.endsWith('README.md');
                            if (aIsReadme && !bIsReadme) return -1;
                            if (!aIsReadme && bIsReadme) return 1;
                            return a.localeCompare(b);
                        });
                    } catch (e) {
                        console.error('Failed to load matrix tree:', e);
                        this.files = ['Error: tree.json not found. Did you build the index?'];
                    } finally {
                        this.loading = false;
                    }
                },

                async loadFile(path) {
                    if (this.currentFile === path) return;
                    this.currentFile = path;
                    this.fileLoading = true;
                    this.markdownContent = '';
                    
                    try {
                        const res = await fetch(`repo/${path}`);
                        if (!res.ok) throw new Error('Failed to fetch module payload');
                        const text = await res.text();
                        
                        // Parse markdown using marked
                        this.markdownContent = marked.parse(text);
                        
                        // Scroll to top
                        document.querySelector('.overflow-y-auto.p-8').scrollTop = 0;
                    } catch (e) {
                        console.error(e);
                        this.markdownContent = `<div class="text-red-500 border border-red-500/30 bg-red-500/10 p-4 rounded-md">
                            <h3 class="font-bold">🚨 Data Retrieval Error</h3>
                            <p class="text-sm mt-2">${e.message}</p>
                        </div>`;
                    } finally {
                        this.fileLoading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
