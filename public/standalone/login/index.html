<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElysiaAI Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="auth-shell" aria-labelledby="auth-title">
        <section class="auth-panel">
            <div class="brand-row">
                <img src="/logo.png" alt="ElysiaAI" class="brand-mark">
                <div>
                    <p class="eyebrow">ElysiaAI</p>
                    <h1 id="auth-title">サインイン</h1>
                </div>
            </div>

            <p class="lead">
                いつもの合鍵で、静かにローカルの作業場へ戻ります。
            </p>

            <form id="login-form" class="auth-form" novalidate>
                <label class="field">
                    <span>ユーザー名</span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        inputmode="text"
                        required
                    >
                </label>

                <label class="field">
                    <span>パスワード</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <div id="error-msg" class="message message-error" role="alert" hidden></div>

                <button type="submit" id="login-btn" class="primary-action">
                    <span class="btn-text">ログイン</span>
                </button>
            </form>

            <dl class="session-list" aria-label="Session status">
                <div>
                    <dt>セッション</dt>
                    <dd id="token-lattice">待機中</dd>
                </div>
                <div>
                    <dt>見張り</dt>
                    <dd id="intrusion-sentinel">静穏</dd>
                </div>
                <div>
                    <dt>署名</dt>
                    <dd id="signature-hash">----</dd>
                </div>
            </dl>

            <p class="core-status" aria-live="polite">未接続</p>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
