<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysia OS // NIGHT CITY EDITION 🌃</title>
    <script src="assets/js/tailwind.min.js"></script>
    <script src="assets/js/alpine.min.js" defer></script>
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/blackwall.css">
    <link rel="stylesheet" href="css/aegis.css">
    <link rel="stylesheet" href="css/sparkle.css">
    <style>
        :root {
            --resonance-hue: 340; /* Default Elysia Pink */
            --resonance-glow: 20px;
            --pulse-opacity: 0.1;
        }
        .resonance-pulse {
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow {
            from { filter: drop-shadow(0 0 5px hsla(var(--resonance-hue), 100%, 50%, 0.3)); }
            to { filter: drop-shadow(0 0 20px hsla(var(--resonance-hue), 100%, 50%, 0.6)); }
        }
        .bg-resonance {
            background: radial-gradient(circle at 50% 50%, hsla(var(--resonance-hue), 100%, 50%, var(--pulse-opacity)) 0%, transparent 70%);
            transition: all 0.5s ease;
        }
        /* 🚨 Blackwall Protocol Styles */
        .blackwall-terminal {
            background: rgba(20, 0, 0, 0.95);
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            animation: blackwall-shake 0.1s infinite;
        }
        @keyframes blackwall-shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(0,0); }
        }
        .blackwall-active .bg-resonance {
            background: radial-gradient(circle at 50% 50%, rgba(255,0,0,0.3) 0%, transparent 70%);
            animation: blackwall-pulse 1s infinite alternate;
        }
        @keyframes blackwall-pulse {
            from { opacity: 0.3; }
            to { opacity: 0.7; }
        }

        body {
            background: radial-gradient(circle at center, hsl(var(--resonance-hue), 30%, 15%) 0%, #0a0a0c 100%);
            transition: background 2s ease;
        }

        .resonance-border {
            border-color: hsla(var(--resonance-hue), 80%, 70%, 0.3);
            box-shadow: 0 0 var(--resonance-glow) hsla(var(--resonance-hue), 80%, 60%, 0.1);
        }
    </style>
</head>
<body x-data="elysiaOS()" 
      @mousemove="handleDrag($event)" 
      @mouseup="stopDrag()"
      :class="{ 
          'blackwall-active': blackwallActive,
          ['layer-depth-' + netDepth]: blackwallActive && netDepth > 0 
      }">
    <!-- 🌌 Omega Backdrop: Neural Synapse Canvas -->
    <canvas id="synapseCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>
    
    <!-- ✨ Starfall Container -->
    <div id="starfall" class="sparkle-container"></div>
    
    <div class="fixed inset-0 pointer-events-none z-[1] bg-resonance"></div>
    <div class="fixed inset-0 pointer-events-none z-[2] bg-black/20 backdrop-blur-[2px]"></div>

    <!-- 🔒 Visual Aegis Lock Overlay -->
    <div class="fixed inset-0 z-[15000] backdrop-blur-3xl transition-all duration-1000 flex items-center justify-center"
         x-show="visualLock"
         x-transition:enter="opacity-0 scale-110"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-110"
         x-cloak>
        <div class="absolute inset-0 bg-black/60 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
        
        <div class="relative text-center space-y-8 p-12 glass-omega border-red-500/30">
            <div class="w-32 h-32 mx-auto rounded-full border-2 border-red-500/50 flex items-center justify-center animate-pulse">
                <div class="text-6xl">🔒</div>
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-black text-red-500 tracking-[0.5em] uppercase">Visual_Aegis_Lock</h2>
                <p class="text-[10px] text-white/40 uppercase tracking-widest">Scanning for authorized resonance signature...</p>
            </div>
            <div class="flex gap-2 justify-center">
                <div class="w-1 h-3 bg-red-500/20 animate-bounce"></div>
                <div class="w-1 h-3 bg-red-500/40 animate-bounce delay-75"></div>
                <div class="w-1 h-3 bg-red-500/60 animate-bounce delay-150"></div>
            </div>
        </div>
    </div>

    <!-- 🚨 Blackwall Alert HUD -->
    <div class="fixed inset-0 z-[10000] pointer-events-none flex items-center justify-center opacity-0 transition-opacity duration-500"
         :class="blackwallActive ? 'opacity-100' : ''">
        <div class="absolute inset-0 bg-red-900/40 mix-blend-overlay animate-pulse"></div>
        <div class="relative bg-black border-4 border-red-600 p-8 text-center text-red-600 font-black tracking-widest shadow-[0_0_50px_rgba(255,0,0,0.8)]">
            <h1 class="text-6xl uppercase animate-bounce">Blackwall_Protocol_Active</h1>
            <p class="mt-4 text-xl">Sovereign Defense Mode: ENGAGED</p>
            <div class="mt-8 flex gap-4 justify-center">
                <div class="w-4 h-4 bg-red-600 animate-ping"></div>
                <div class="w-4 h-4 bg-red-600 animate-ping delay-100"></div>
                <div class="w-4 h-4 bg-red-600 animate-ping delay-200"></div>
            </div>
        </div>
    </div>
    
    <!-- 🔊 Voice Broadcast -->
    <audio id="elysia-voice-broadcast" class="hidden"></audio>
    
    <!-- 📊 Status Bar (Omega Edition) -->
    <header class="fixed top-0 left-0 right-0 z-[1000] glass-omega h-10 flex items-center justify-between px-6 border-b border-white/5">
        <div class="flex items-center gap-4">
            <span class="text-[12px] font-black tracking-[0.2em] text-cyan-400">Ω_MEGA_PROTOCOL.v3</span>
            <div class="flex items-center gap-3 bg-black/40 px-3 py-1 rounded-sm border border-white/5 cursor-pointer" @click="openDiagnostics()">
               <div class="flex items-center gap-1.5">
                   <div class="w-1.5 h-1.5 rounded-full" :class="systemHealth.brain ? 'bg-cyan-400 shadow-[0_0_8px_#00f2ff]' : 'bg-red-500'"></div>
                   <span class="text-[9px] text-white/50 uppercase">Neural</span>
               </div>
               <div class="flex items-center gap-1.5">
                   <div class="w-1.5 h-1.5 rounded-full" :class="systemHealth.voice ? 'bg-pink-400 shadow-[0_0_8px_#ff00ba]' : 'bg-red-500'"></div>
                   <span class="text-[9px] text-white/50 uppercase">Vocal</span>
               </div>
            </div>
        </div>
        <div class="text-[10px] font-mono text-white/60 tracking-widest" x-text="currentTime"></div>
    </header>

    <!-- 📟 Side HUD (Kernel Logs) -->
    <aside class="fixed right-6 top-16 bottom-24 w-64 glass-omega z-[900] p-4 flex flex-col gap-4 border border-white/5 select-none" x-show="!blackwallActive">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <h3 class="text-[9px] font-bold tracking-widest text-cyan-400">KERNEL_RESONANCE_HUD</h3>
            <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        </div>
        <div class="flex-1 overflow-hidden font-mono text-[8px] space-y-2 opacity-70">
            <template x-for="log in logHistory" :key="log.id">
                <div class="flex gap-2">
                    <span class="text-white/30" x-text="log.time"></span>
                    <span class="text-white/80" x-text="log.msg"></span>
                </div>
            </template>
        </div>
        <div class="mt-auto pt-2 border-t border-white/10 text-[9px]">
            <div class="flex justify-between">
                <span class="opacity-40">CPU_CORE:</span>
                <span class="text-white/80" x-text="(stats.system?.cpu || 0) + '%'"></span>
            </div>
            <div class="flex justify-between">
                <span class="opacity-40">MEM_VALVE:</span>
                <span class="text-white/80" x-text="(stats.system?.ram || 0) + '%'"></span>
            </div>
        </div>
    </aside>

    <!-- 🧬 Resonance Soul Core Overlay -->
    <div class="fixed bottom-24 right-6 w-64 h-80 z-[800] pointer-events-auto"
         x-show="apps.soul_core && apps.soul_core.open"
         x-transition:enter="transition ease-out duration-500"
         x-transition:enter-start="opacity-0 scale-95 translate-y-8"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-html="appContents.soul_core">
    </div>

    <!-- 🖥️ Workspace (Windows) -->
    <main class="relative w-full h-full pt-8 pb-20 px-4">
        
        <!-- Dynamic Workspace (Modular Apps) -->
        <template x-for="(app, id) in apps" :key="id">
            <template x-if="app.open">
                <div class="window" 
                     :style="`left: ${app.x}px; top: ${app.y}px; z-index: ${app.zIndex}`"
                     :class="id === 'messenger' ? 'w-[480px] h-[600px]' : (id === 'monitor' ? 'w-[640px] h-[400px]' : 'w-[500px] h-[400px]')"
                     @mousedown="focusApp(id)"
                     x-html="appContents[id] || '<div class=\"p-8 text-center text-white/20\">Loading Resonance Module...</div>'">
                </div>
            </template>
        </template>

    </main>

    <!-- 🔔 Notification Toast Layer -->
    <div class="fixed top-6 right-6 z-[9999] pointer-events-none flex flex-col gap-3">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="bg-black/60 backdrop-blur-xl border border-white/20 rounded-2xl p-4 shadow-2xl pointer-events-auto transform transition-all duration-500 flex items-center gap-4"
                 x-show="toast.visible"
                 x-transition:enter="translate-x-full opacity-0"
                 x-transition:enter-end="translate-x-0 opacity-100"
                 x-transition:leave="translate-x-full opacity-0">
                <div class="w-10 h-10 rounded-full bg-pink-500/20 flex items-center justify-center text-xl" x-text="toast.icon || '🌸'"></div>
                <div>
                    <div class="text-[10px] text-white/40 font-bold uppercase tracking-widest">Resonance Alert</div>
                    <div class="text-sm text-white/90" x-text="toast.msg"></div>
                </div>
            </div>
        </template>
    </div>

    <!-- ⚓ Dock -->
    <nav class="dock-container">
        <template x-for="(meta, id) in appsRegistry" :key="id">
            <template x-if="userRole === 'root' || !['divine_console', 'soul_forge', 'evolution_ledger', 'kernel_workbench'].includes(id)">
                <div class="dock-item" 
                     :class="apps[id]?.open ? 'active' : ''" 
                     @click="toggleApp(id)" 
                     :title="meta.title"
                     x-text="meta.icon">
                </div>
            </template>
        </template>
        <div class="h-10 w-px bg-white/10 mx-2"></div>
        <template x-if="maintenanceMode">
            <div class="dock-item border border-red-500/50 bg-red-500/10 animate-pulse" title="SIP_BYPASSED">☣️</div>
        </template>
        <div class="dock-item" @click="location.href='index.html'" title="Classic View">🌸</div>
    </nav>

    <script>
        function elysiaOS() {
            return {
                currentTime: '',
                kernelAlive: true,
                loading: false,
                chatInput: '',
                messages: JSON.parse(localStorage.getItem('elysia_chat_history') || '[]'),
                stats: {},
                logHistory: [],
                terminalOutput: [],
                maxZ: 100,
                dragApp: null,
                offsetX: 0,
                offsetY: 0,
                kernelHost: 'http://localhost:8000',

                appContents: {},
                appsRegistry: {},
                apps: {}, // { id: {open: boolean, zIndex: number} }
                activeApp: null,
                blackwallActive: false,
                visualLock: false, // New Phase 20
                userEmotion: 'neutral', // New Phase 21
                userRole: 'guest', // New Phase 24
                currentTheme: 'cyberpunk', // New Phase 23
                maintenanceMode: false, // New Phase 25
                netDepth: 0,
                systemHealth: { voice: false, brain: true },
                diagnostics: { open: false, report: '' },
                toasts: [],

                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    setInterval(() => this.fetchMonitor(), 5000); // UI Symmetry Refresh
                    this.fetchStats();
                    setInterval(() => this.fetchStats(), 5000);
                    this.fetchApps();
                    setInterval(() => this.fetchApps(), 10000);
                    this.initSynapse();
                    this.initStarfall();
                    this.fetchTheme();
                    
                    // JARVIS Wake Up Sequence
                    this.fetchApps().then(() => {
                        this.apps.soul_core.open = true;
                        this.loadApp('soul_core');
                        setTimeout(() => this.greetUser(), 3000);
                    });

                    // Sovereign Listeners
                    window.addEventListener('keydown', (e) => {
                        // Void Sequence: Ctrl+Alt+Shift+E
                        if (e.ctrlKey && e.altKey && e.shiftKey && e.key === 'E') {
                            this.triggerVoidSequence();
                        }
                    });

                    // Hot Manifest Sync (Phase 19)
                    window.addEventListener('elysia-manifest-stable', () => {
                        this.fetchApps();
                        this.showToast("Registry Synchronized", "🧬");
                    });

                    // Sensory Presence Listeners (Phase 20)
                    window.addEventListener('elysia-presence-sync', (e) => {
                        const { present, authorized } = e.detail;
                        if (authorized && !present) {
                            if (!this.visualLock) {
                                this.visualLock = true;
                                this.showToast("Visual Aegis: TARGET LOST. LOCKING.", "🔒");
                            }
                        } else {
                            if (this.visualLock) {
                                this.visualLock = false;
                                this.showToast("Visual Aegis: AUTHORIZED.", "🔓");
                            }
                        }
                        // Auto-Identify as Root if authorized present
                        if (authorized && present) this.userRole = 'root';
                    });

                    window.addEventListener('elysia-security-breach', () => {
                        this.blackwallActive = true;
                        this.showToast("CRITICAL: UNAUTHORIZED ACCESS DETECTED", "🚨");
                    });

                    // Emotional Resonance (Phase 21)
                    window.addEventListener('elysia-emotion-update', (e) => {
                        const { emotion } = e.detail;
                        this.userEmotion = emotion;
                        
                        let hue = 340; 
                        if (emotion === 'happy') hue = 350; 
                        if (emotion === 'tired') hue = 210; 
                        
                        document.documentElement.style.setProperty('--resonance-hue', hue);
                        this.showToast(`Resonance Shift: ${emotion.toUpperCase()}`, "🎭");
                        
                        if (emotion === 'tired') {
                            setTimeout(async () => {
                                if (this.userEmotion === 'tired') {
                                    const res = await fetch('http://localhost:8000/system/resonance/reflect?mode=CONVERSATIONAL');
                                    const data = await res.json();
                                    this.speak(data.reflection);
                                }
                            }, 5000);
                        }
                    });
                },

                async fetchTheme() {
                    const res = await fetch('http://localhost:8000/system/theme');
                    const data = await res.json();
                    this.currentTheme = data.theme;
                    this.maintenanceMode = data.maintenance;
                    document.body.dataset.theme = this.currentTheme;
                },

                async applyTheme(theme) {
                    await fetch('http://localhost:8000/system/theme', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ theme })
                    });
                    this.currentTheme = theme;
                    document.body.dataset.theme = theme;
                    this.showToast(`Aesthetic Re-Manifested: ${theme.toUpperCase()}`, "🎨");
                },

                async triggerVoidSequence() {
                    this.showToast("VOID_SEQUENCE_DETECTED", "☣️");
                    // Glitch Effect Simulation
                    this.blackwallActive = true;
                    setTimeout(() => {
                        this.blackwallActive = false;
                        this.unlockMaintenance();
                    }, 1000);
                },

                async unlockMaintenance() {
                    const res = await fetch('http://localhost:8000/system/maintenance/unlock', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ secret: 'elysia-singularity-overdrive-2026' })
                    });
                    const data = await res.json();
                    if (data.status === 'unlocked') {
                        this.maintenanceMode = true;
                        this.applyTheme('singularity');
                        this.showToast("SIP_OVERRIDDEN. MAINTENANCE_ON.", "🔓");
                    }
                },
                async greetUser() {
                    const res = await fetch('http://localhost:8000/system/monitor');
                    const data = await res.json();
                    const greeting = `システムのスキャンが完了したよ。オールシステム、ノーミナル、お兄ちゃん。今の共鳴度は ${data.elysia.soul_resonance?.affinity?.value || 50} パーセントだよ。`;
                    this.playVoice(greeting);
                    this.showToast("Resonance Link: ESTABLISHED", "💠");
                },
                initStarfall() {
                    const container = document.getElementById('starfall');
                    const starCount = 30;
                    for (let i = 0; i < starCount; i++) {
                        const star = document.createElement('div');
                        star.className = 'star' + (Math.random() > 0.8 ? ' star-sparkle' : '');
                        const size = Math.random() * 3 + 1;
                        star.style.width = `${size}px`;
                        star.style.height = `${size}px`;
                        star.style.left = `${Math.random() * 100}vw`;
                        star.style.animationDuration = `${Math.random() * 5 + 5}s`;
                        star.style.animationDelay = `${Math.random() * 10}s`;
                        container.appendChild(star);
                    }
                },
                initSynapse() {
                    const canvas = document.getElementById('synapseCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    let particles = [];
                    for(let i=0; i<50; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
                    const animate = () => {
                        ctx.clearRect(0,0,canvas.width,canvas.height);
                        ctx.fillStyle = this.blackwallActive ? 'rgba(255,0,0,0.5)' : 'rgba(0,242,255,0.5)';
                        particles.forEach(p => {
                            p.x += p.vx; p.y += p.vy;
                            if(p.x<0 || p.x>canvas.width) p.vx *= -1;
                            if(p.y<0 || p.y>canvas.height) p.vy *= -1;
                            ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
                        });
                        requestAnimationFrame(animate);
                    };
                    animate();
                },
                        this.messages.push({id: Date.now(), role: 'assistant', content: 'ฅ(՞៸៸> ᗜ <៸៸՞)ฅ おにいちゃん、待ってたよ！Elysia OS 2.0へようこそ。あたし、あなたのことをもっとよく知りたいな♡'});
                    }
                },

                async fetchMonitor() {
                    try {
                        const res = await fetch('http://localhost:8000/system/monitor');
                        const data = await res.json();
                        this.stats = data;
                        
                        // Update Resonance Heartbeat
                        this.updateResonancePulse();

                        // Update Resonance Theme
                        const resonance = data.elysia.soul_resonance || {};
                        const affinity = parseInt(resonance.affinity?.value || "50");
                        
                        // OOBE Check: 初回起動プロセスの誘発
                        if (Object.keys(resonance).length === 0 && !window.location.href.includes('oobe.html')) {
                            console.log("Resonance Void detected. Redirecting to OOBE...");
                            window.location.href = 'oobe.html';
                            return;
                        }
                        
                        // Update Health State
                        this.systemHealth.voice = data.elysia.voice_active;
                        
                        // Spontaneous Voice Playback
                        if (data.system?.voice_broadcast) {
                            const audio = document.getElementById('elysia-voice-broadcast');
                            audio.src = data.system.voice_broadcast;
                            audio.play().catch(e => console.log("Autoplay blocked/failed", e));
                        }

                        // Sync Blackwall Protocol
                        if (data.system?.blackwall_active !== undefined) {
                             this.blackwallActive = data.system.blackwall_active;
                        }
                        
                        // Sync Net Depth
                        if (data.elysia.net_depth !== undefined) {
                            this.netDepth = data.elysia.net_depth;
                        }
                        
                        // Affinity 0 (Blue) -> 100 (Deep Pink)
                        const hue = 200 + (affinity * 1.4); // 200 (Blue) to 340 (Pink)
                        document.documentElement.style.setProperty('--resonance-hue', hue);
                        document.documentElement.style.setProperty('--resonance-glow', `${10 + (affinity/2)}px`);
                        
                    }
                },
                updateResonancePulse() {
                    const cpu = this.stats.system?.cpu || 0;
                    const root = document.documentElement;
                    if (cpu > 40) {
                        // High Resonance (Excited/Intense)
                        root.style.setProperty('--pulse-opacity', '0.25');
                        root.style.setProperty('--resonance-glow', '40px');
                    } else {
                        // Normal Resonance (Calm)
                        root.style.setProperty('--pulse-opacity', '0.08');
                        root.style.setProperty('--resonance-glow', '15px');
                    }
                },

                async openDiagnostics() {
                    try {
                        const res = await fetch('http://localhost:8000/system/monitor');
                        const data = await res.json();
                        this.diagnostics.report = `[NIGHT CITY] ELVSIΛ OS Pulse Diagnostic\n` + 
                                               `----------------------------------------\n` +
                                               `Resonance Version: ${data.elysia.version}\n` +
                                               `Neural Core (Ollama): ONLINE\n` +
                                               `Vocal Engine (VOICEVOX): ${data.elysia.voice_active ? 'ACTIVE' : 'OFFLINE'}\n\n` +
                                               `[Resource Metrics]\n` +
                                               `CPU: ${data.system.cpu}%\n` +
                                               `RAM: ${data.system.ram}%\n` +
                                               `Disk: ${data.system.disk.percent}%\n\n` +
                                               `Resonance Affinity: ${data.elysia.soul_resonance?.affinity?.value || 50}%`;
                        this.diagnostics.open = true;
                    } catch (e) {
                        this.showToast("Cannot connect to kernel.", "❌");
                    }
                },

                async fetchApps() {
                    try {
                        const res = await fetch("http://127.0.0.1:8000/system/apps/list");
                        if (res.ok) {
                            this.appsRegistry = await res.json();
                            // Initialize runtime state for new apps
                            Object.keys(this.appsRegistry).forEach(id => {
                                if (!this.apps[id]) {
                                    this.apps[id] = { open: false, zIndex: 100, x: 100, y: 100 };
                                }
                            });
                            // Special case for messenger
                            if (this.apps.messenger) this.apps.messenger.open = true;
                            this.loadApp('messenger');
                        }
                    } catch (e) {
                        console.error("Failed to load app registry", e);
                    }
                },

                showToast(msg, icon = '🌸') {
                    const id = Date.now();
                    this.toasts.push({ id, msg, icon, visible: true });
                    setTimeout(() => {
                        const t = this.toasts.find(t => t.id === id);
                        if(t) t.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 500);
                    }, 5000);
                },

                async loadApp(appId) {
                    if (this.appContents[appId]) return;
                    try {
                        const res = await fetch(`http://127.0.0.1:8000/system/apps/${appId}.component.html`);
                        if (res.ok) {
                            this.appContents[appId] = await res.text();
                        }
                    } catch (e) {
                        console.error(`Failed to load app ${appId}`, e);
                    }
                },

                updateTime() {
                    const now = new Date();
                    this.currentTime = now.toLocaleString('ja-JP', { 
                        weekday: 'short', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', second: '2-digit' 
                    });
                },

                async fetchStats() {
                    try {
                        const res = await fetch("http://127.0.0.1:8000/system/monitor");
                        if (res.ok) {
                            this.stats = await res.json();
                            this.kernelAlive = true;
                            // Add to history
                            this.logHistory.unshift({ 
                                id: Date.now(), 
                                time: new Date().toLocaleTimeString(), 
                                msg: `Heartbeat: CPU ${this.stats.system.cpu}% | RAM ${this.stats.system.ram}%`
                            });
                            if (this.logHistory.length > 20) this.logHistory.pop();
                        } else {
                            this.kernelAlive = false;
                        }
                    } catch (e) {
                        this.kernelAlive = false;
                    }
                },

                // Settings Persistence (Resonance Sync)
                async saveConfig(newConfig) {
                    this.addLog("Synchronizing system resonance...");
                    try {
                        const res = await fetch("http://127.0.0.1:8000/system/config", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(newConfig)
                        });
                        if (res.ok) {
                            this.addLog("Config synced to etc/elysia/config.json");
                            this.stats.config = { ...this.stats.config, ...newConfig };
                        }
                    } catch (e) {
                        console.error("Sync failed", e);
                        localStorage.setItem('elysia_os_config', JSON.stringify({ ...this.stats.config, ...newConfig }));
                    }
                },

                async startSTT() {
                    this.addLog("Listening to your soul...");
                    try {
                        // For a real standalone, we'd use a media recorder
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const mediaRecorder = new MediaRecorder(stream);
                        const audioChunks = [];

                        mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
                        mediaRecorder.onstop = async () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                            const formData = new FormData();
                            formData.append("file", audioBlob, "resonance.wav");

                            this.loading = true;
                            const res = await fetch("http://127.0.0.1:8000/stt", { method: "POST", body: formData });
                            const data = await res.json();
                            if (data.text) {
                                this.chatInput = data.text;
                                this.addLog(`Transcribed: "${data.text}"`);
                            }
                            this.loading = false;
                        };

                        mediaRecorder.start();
                        setTimeout(() => mediaRecorder.stop(), 5000); // Record 5s for now
                    } catch (e) {
                        this.addLog("Microphone access denied.");
                    }
                },

                toggleApp(appId) {
                    this.apps[appId].open = !this.apps[appId].open;
                    if(this.apps[appId].open) {
                        this.loadApp(appId);
                        this.focusApp(appId);
                    }
                },

                closeApp(appId) {
                    this.apps[appId].open = false;
                },

                focusApp(appId) {
                    this.maxZ++;
                    this.apps[appId].zIndex = this.maxZ;
                },

                startDrag(appId, e) {
                    this.focusApp(appId);
                    this.dragApp = appId;
                    this.offsetX = e.clientX - this.apps[appId].x;
                    this.offsetY = e.clientY - this.apps[appId].y;
                    e.preventDefault();
                },

                handleDrag(e) {
                    if (!this.dragApp) return;
                    this.apps[this.dragApp].x = e.clientX - this.offsetX;
                    this.apps[this.dragApp].y = e.clientY - this.offsetY;
                },

                stopDrag() {
                    this.dragApp = null;
                },

                async sendMessage() {
                    if (!this.chatInput.trim() || this.loading) return;
                    const content = this.chatInput.trim();
                    this.messages.push({ id: Date.now(), role: 'user', content });
                    this.chatInput = '';
                    this.loading = true;
                    this.scrollToBottom();

                    let assistantMsg = { id: Date.now() + 1, role: 'assistant', content: '' };
                    this.messages.push(assistantMsg);

                    try {
                        const response = await fetch(`${this.kernelHost}/chat`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                messages: this.messages.slice(0, -1),
                                stream: true,
                                session_id: "desktop_user"
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = JSON.parse(line.substring(6));
                                    if (data.content) {
                                        assistantMsg.content += data.content;
                                    }
                                    if (data.skills) {
                                        data.skills.forEach(s => {
                                            if (s.data) assistantMsg.content += `\n\n${s.data}`;
                                            if (s.error) assistantMsg.content += `\n\n⚠️ Error (${s.skill}): ${s.error}`;
                                            this.addLog(`Skill ${s.skill} executed.`);
                                            
                                            // Trigger registry refresh on install
                                            if (s.skill === 'install_app' && s.status === 'success') {
                                                this.fetchApps();
                                                this.showToast(`New Module Integrated: ${s.id}`, '📦');
                                            }
                                            
                                            // Soul update feedback
                                            if (s.skill === 'update_soul' && s.status === 'success') {
                                                this.showToast(`Soul Resonance Deepened`, '💖');
                                            }

                                            // Visual perception feedback
                                            if (s.skill === 'capture_screen' && s.path) {
                                                this.showToast(`Visual Sync Complete`, '👀');
                                            }
                                        });
                                    }
                                    if (data.emotion) {
                                        this.currentEmotion = data.emotion;
                                        this.addLog(`Emotion Shift: ${data.emotion}`);
                                    }
                                }
                            }
                        }
                        
                        // Speak after message completes
                        if (assistantMsg.content) {
                            this.playVoice(assistantMsg.content);
                        }
                        
                        localStorage.setItem('elysia_chat_history', JSON.stringify(this.messages));
                    } catch (e) {
                        assistantMsg.content = '⚠️ Resonance Failure: ' + e.message;
                    } finally {
                        this.loading = false;
                        this.scrollToBottom();
                    }
                },

                async playVoice(text) {
                    try {
                        const res = await fetch("http://127.0.0.1:8000/tts", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ text, speaker_id: 2 })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const audio = new Audio("data:audio/wav;base64," + data.audio);
                            audio.play();
                        }
                    } catch (e) {
                        console.error("Voice failed", e);
                    }
                },

                addLog(msg) {
                    this.logHistory.unshift({ id: Date.now(), time: new Date().toLocaleTimeString(), msg });
                    if(this.logHistory.length > 50) this.logHistory.pop();
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = document.getElementById('chatContainer');
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                }
            }
        }
    </script>
    <!-- 🧬 Diagnostics Modal (OS Pulse) -->
    <div x-show="diagnostics.open" class="fixed inset-0 z-[10000] flex items-center justify-center p-8 bg-black/80 backdrop-blur-md" x-transition x-cloak>
        <div class="glass max-w-2xl w-full p-8 border border-white/10 space-y-6 shadow-2xl">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold tracking-tighter text-[#fcee0a]">SYSTEM PULSE DIAGNOSTIC</h2>
                <button @click="diagnostics.open = false" class="text-white/50 hover:text-white">✕</button>
            </div>
            <pre class="bg-black/60 p-6 rounded font-mono text-xs text-cyan-400 overflow-auto max-h-[400px] whitespace-pre-wrap" x-text="diagnostics.report"></pre>
            <div class="flex justify-end">
                <button @click="diagnostics.open = false" class="bg-white/10 hover:bg-white/20 px-6 py-2 text-xs font-bold uppercase tracking-widest transition-colors">Close</button>
            </div>
        </div>
    </div>

    <!-- 🔔 Toasts -->
    <div class="fixed top-4 right-4 z-[9999] space-y-2 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-x-8"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="glass px-6 py-3 border-l-4 border-cyan-400 flex items-center gap-3 shadow-xl pointer-events-auto">
                <span x-text="toast.icon"></span>
                <span class="text-xs font-bold tracking-tight" x-text="toast.msg"></span>
            </div>
        </template>
    </div>

</body>
</html>
