<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysia OS - Resonance Desktop 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="css/desktop.css">
</head>
<body x-data="elysiaOS()" @mousemove="handleDrag($event)" @mouseup="stopDrag()">
    
    <!-- 🌠 Desktop Wallpaper -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 opacity-80"></div>
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-pink-500 rounded-full mix-blend-screen filter blur-[128px] opacity-30 animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500 rounded-full mix-blend-screen filter blur-[128px] opacity-30 animate-pulse" style="animation-delay: 2s"></div>
    </div>

    <!-- 📊 Status Bar -->
    <header class="status-bar">
        <div class="flex items-center gap-4">
            <span class="font-bold tracking-widest text-pink-400">ELYSIΛ OS</span>
            <div class="h-4 w-px bg-white/20"></div>
            <div class="flex items-center gap-2 text-[10px] text-white/60">
                <span>CPU: <span class="text-blue-400" x-text="(stats.system?.cpu || 0) + '%'"></span></span>
                <span>RAM: <span class="text-purple-400" x-text="(stats.system?.ram || 0) + '%'"></span></span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full" :class="kernelAlive ? 'bg-green-500 animate-pulse' : 'bg-red-500'"></span>
                <span class="text-[10px] text-white/50" x-text="kernelAlive ? 'RESONANCE_OK' : 'OFFLINE'"></span>
            </div>
            <div class="text-[12px] font-mono tracking-tighter" x-text="currentTime"></div>
        </div>
    </header>

    <!-- 🖥️ Workspace (Windows) -->
    <main class="relative w-full h-full pt-8 pb-20 px-4">
        
        <!-- Dynamic Workspace (Modular Apps) -->
        <template x-for="(app, id) in apps" :key="id">
            <template x-if="app.open">
                <div class="window" 
                     :style="`left: ${app.x}px; top: ${app.y}px; z-index: ${app.zIndex}`"
                     :class="id === 'messenger' ? 'w-[480px] h-[600px]' : (id === 'monitor' ? 'w-[640px] h-[400px]' : 'w-[500px] h-[400px]')"
                     @mousedown="focusApp(id)"
                     x-html="appContents[id] || '<div class=\"p-8 text-center text-white/20\">Loading Resonance Module...</div>'">
                </div>
            </template>
        </template>

    </main>

    <!-- ⚓ Dock -->
    <nav class="dock-container">
        <div class="dock-item" :class="apps.messenger.open ? 'active' : ''" @click="toggleApp('messenger')" title="Resonance Messenger">💬</div>
        <div class="dock-item" :class="apps.monitor.open ? 'active' : ''" @click="toggleApp('monitor')" title="System Monitor">📊</div>
        <div class="dock-item" :class="apps.explorer.open ? 'active' : ''" @click="toggleApp('explorer')" title="FHS Explorer">📂</div>
        <div class="dock-item" :class="apps.terminal.open ? 'active' : ''" @click="toggleApp('terminal')" title="Elysia Shell">🐚</div>
        <div class="dock-item" :class="apps.settings.open ? 'active' : ''" @click="toggleApp('settings')" title="OS Settings">⚙️</div>
        <div class="h-10 w-px bg-white/10 my-auto"></div>
        <div class="dock-item" @click="location.href='index.html'" title="Classic View">🌸</div>
    </nav>

    <script>
        function elysiaOS() {
            return {
                currentTime: '',
                kernelAlive: true,
                loading: false,
                chatInput: '',
                messages: JSON.parse(localStorage.getItem('elysia_chat_history') || '[]'),
                stats: {},
                logHistory: [],
                terminalOutput: [],
                maxZ: 100,
                dragApp: null,
                offsetX: 0,
                offsetY: 0,

                appContents: {},
                apps: {
                    messenger: { open: true, zIndex: 101, x: 50, y: 50 },
                    monitor: { open: false, zIndex: 100, x: 550, y: 80 },
                    terminal: { open: false, zIndex: 99, x: 200, y: 400 },
                    explorer: { open: false, zIndex: 98, x: 100, y: 150 },
                    settings: { open: false, zIndex: 97, x: 300, y: 200 },
                },

                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    this.fetchStats();
                    setInterval(() => this.fetchStats(), 5000);
                    
                    // Pre-load essential apps
                    this.loadApp('messenger');
                    
                    if(this.messages.length === 0) {
                        this.messages.push({id: Date.now(), role: 'assistant', content: 'ฅ(՞៸៸> ᗜ <៸៸՞)ฅ おにいちゃん、待ってたよ！Elysia OS 2.0へようこそ。あたし、あなたのことをもっとよく知りたいな♡'});
                    }
                },

                async loadApp(appId) {
                    if (this.appContents[appId]) return;
                    try {
                        const res = await fetch(`http://127.0.0.1:8000/system/apps/${appId}.component.html`);
                        if (res.ok) {
                            this.appContents[appId] = await res.text();
                        }
                    } catch (e) {
                        console.error(`Failed to load app ${appId}`, e);
                    }
                },

                updateTime() {
                    const now = new Date();
                    this.currentTime = now.toLocaleString('ja-JP', { 
                        weekday: 'short', month: 'short', day: 'numeric', 
                        hour: '2-digit', minute: '2-digit', second: '2-digit' 
                    });
                },

                async fetchStats() {
                    try {
                        const res = await fetch("http://127.0.0.1:8000/system/monitor");
                        if (res.ok) {
                            this.stats = await res.json();
                            this.kernelAlive = true;
                            // Add to history
                            this.logHistory.unshift({ 
                                id: Date.now(), 
                                time: new Date().toLocaleTimeString(), 
                                msg: `Heartbeat: CPU ${this.stats.system.cpu}% | RAM ${this.stats.system.ram}%`
                            });
                            if (this.logHistory.length > 20) this.logHistory.pop();
                        } else {
                            this.kernelAlive = false;
                        }
                    } catch (e) {
                        this.kernelAlive = false;
                    }
                },

                // New App: Settings Logic (Partial Implementation)
                async saveConfig(newConfig) {
                    this.addLog("Config update requested...");
                    // In a real OS, would call a /system/config endpoint
                    this.stats.config = { ...this.stats.config, ...newConfig };
                    localStorage.setItem('elysia_os_config', JSON.stringify(this.stats.config));
                },

                toggleApp(appId) {
                    this.apps[appId].open = !this.apps[appId].open;
                    if(this.apps[appId].open) {
                        this.loadApp(appId);
                        this.focusApp(appId);
                    }
                },

                closeApp(appId) {
                    this.apps[appId].open = false;
                },

                focusApp(appId) {
                    this.maxZ++;
                    this.apps[appId].zIndex = this.maxZ;
                },

                startDrag(appId, e) {
                    this.focusApp(appId);
                    this.dragApp = appId;
                    this.offsetX = e.clientX - this.apps[appId].x;
                    this.offsetY = e.clientY - this.apps[appId].y;
                    e.preventDefault();
                },

                handleDrag(e) {
                    if (!this.dragApp) return;
                    this.apps[this.dragApp].x = e.clientX - this.offsetX;
                    this.apps[this.dragApp].y = e.clientY - this.offsetY;
                },

                stopDrag() {
                    this.dragApp = null;
                },

                async sendMessage() {
                    if (!this.chatInput.trim() || this.loading) return;
                    const content = this.chatInput.trim();
                    this.messages.push({ id: Date.now(), role: 'user', content });
                    this.chatInput = '';
                    this.loading = true;
                    this.scrollToBottom();

                    let assistantMsg = { id: Date.now() + 1, role: 'assistant', content: '' };
                    this.messages.push(assistantMsg);

                    try {
                        const response = await fetch("http://127.0.0.1:8000/chat", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                messages: this.messages.slice(0, -1),
                                stream: true,
                                session_id: "desktop_user"
                            })
                        });

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = JSON.parse(line.substring(6));
                                    if (data.content) {
                                        assistantMsg.content += data.content;
                                    }
                                    if (data.emotion) {
                                        this.currentEmotion = data.emotion;
                                        this.addLog(`Emotion Shift: ${data.emotion}`);
                                    }
                                }
                            }
                        }
                        
                        // Speak after message completes
                        if (assistantMsg.content) {
                            this.playVoice(assistantMsg.content);
                        }
                        
                        localStorage.setItem('elysia_chat_history', JSON.stringify(this.messages));
                    } catch (e) {
                        assistantMsg.content = '⚠️ Resonance Failure: ' + e.message;
                    } finally {
                        this.loading = false;
                        this.scrollToBottom();
                    }
                },

                async playVoice(text) {
                    try {
                        const res = await fetch("http://127.0.0.1:8000/tts", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ text, speaker_id: 2 })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const audio = new Audio("data:audio/wav;base64," + data.audio);
                            audio.play();
                        }
                    } catch (e) {
                        console.error("Voice failed", e);
                    }
                },

                addLog(msg) {
                    this.logHistory.unshift({ id: Date.now(), time: new Date().toLocaleTimeString(), msg });
                    if(this.logHistory.length > 50) this.logHistory.pop();
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = document.getElementById('chatContainer');
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                }
            }
        }
    </script>
</body>
</html>
