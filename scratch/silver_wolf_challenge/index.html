<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Wolf Challenge - Local Reproduction</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="background-overlay"></div>
        <div class="scanlines"></div>
        
        <div id="game-container" class="glass-panel">
            <header>
                <h1 class="glitch" data-text="SILVER WOLF">SILVER WOLF</h1>
                <p class="subtitle">CONTINUOUS TAPPING CHALLENGE</p>
            </header>

            <main>
                <!-- Start Screen -->
                <section id="start-screen" class="active">
                    <div class="wolf-icon">
                        <svg viewBox="0 0 100 100" class="neon-svg">
                            <path d="M50 10 L20 40 L30 45 L10 70 L40 65 L50 90 L60 65 L90 70 L70 45 L80 40 Z" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <button id="btn-start" class="btn-neon">INITIALIZE SESSION</button>
                    <div class="settings">
                        <label class="switch-container">
                            <input type="checkbox" id="defeat-mode">
                            <span class="slider"></span>
                            <span class="label-text">DEFEAT MODE (AUTO-TAP)</span>
                        </label>
                    </div>
                </section>

                <!-- Countdown Screen -->
                <section id="countdown-screen">
                    <div id="countdown-timer" class="big-number">3</div>
                </section>

                <!-- Play Screen -->
                <section id="play-screen">
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">TIME</span>
                            <span id="game-timer" class="stat-value">5.00</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">SCORE</span>
                            <span id="game-score" class="stat-value">1024</span>
                        </div>
                    </div>
                    <div class="game-area">
                        <button id="tap-target" class="tap-circle" aria-label="射撃">
                            <span class="tap-text">TAP</span>
                            <div class="ripple-container"></div>
                        </button>
                    </div>
                </section>

                <!-- Result Screen -->
                <section id="result-screen">
                    <h2 class="result-title">SESSION COMPLETE</h2>
                    <div class="final-score-container">
                        <span class="label">FINAL SCORE</span>
                        <span id="final-score" class="big-number">1024</span>
                    </div>
                    <div class="token-container">
                        <span class="label">SECURE TOKEN (JWT)</span>
                        <code id="result-token" class="token-text">------------------</code>
                    </div>
                    <button id="btn-restart" class="btn-neon outline">RE-INITIALIZE</button>
                </section>
            </main>

            <footer>
                <div class="system-status">
                    <span class="blink">●</span> SYSTEM ONLINE | ENCRYPTION: ACTIVE
                </div>
            </footer>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
