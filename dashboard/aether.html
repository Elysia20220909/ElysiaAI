<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER Shroud | Stealth Vault</title>
    <link rel="stylesheet" href="aether.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <h1>AETHER SHROUD</h1>
            <p class="subtitle">Video Fragmentation & Stealth Cryptography Interface</p>
        </header>

        <div class="vault-grid">
            <div class="side-panel">
                <div class="vault-card">
                    <div class="card-title">
                        <span class="icon">🌪️</span> SHROUD TARGET
                    </div>
                    
                    <div class="form-group">
                        <label>Select Video File</label>
                        <input type="file" id="video-file" accept="video/*">
                    </div>

                    <div class="form-group">
                        <label>Fragmentation Size (MB)</label>
                        <input type="number" id="chunk-size" value="10" min="1" max="100">
                    </div>

                    <div class="form-group">
                        <label>Camouflage Protocol</label>
                        <select id="camo-type">
                            <option value="dll">DLL Injection (.dll)</option>
                            <option value="bmp">Bitmap Obfuscation (.bmp)</option>
                            <option value="zip">Archive Shadow (.zip)</option>
                            <option value="dat">Generic Data Cache (.dat)</option>
                        </select>
                    </div>

                    <button class="btn" id="shroud-btn">INITIATE SHROUDING</button>
                </div>

                <div class="vault-card" style="margin-top: 20px;">
                    <div class="card-title">
                        <span class="icon">✨</span> MATERIALIZE
                    </div>
                    <div class="form-group">
                        <label>Phantom ID</label>
                        <input type="text" id="reveal-id" placeholder="e.g. 8a3f8b1c" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: white;">
                    </div>
                    <button class="btn" id="reveal-btn" style="background: linear-gradient(45deg, #a855f7, #ec4899);">MATERIALIZE FROM ABYSS</button>
                </div>
            </div>

            <div class="main-panel">
                <div class="vault-card" style="height: 100%; display: flex; flex-direction: column;">
                    <div class="card-title">
                        <span class="icon">📟</span> OPERATION LOGS
                    </div>
                    <div class="log-window" id="logs">
                        <div class="log-entry info">[SYSTEM] AETHER Core initialized. Ready for encryption sequence...</div>
                    </div>
                    
                    <div class="shard-list" id="shard-list">
                        <!-- Shards will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="aether.js"></script>
</body>
</html>
