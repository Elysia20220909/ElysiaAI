name: elisia-core

x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *security-defaults
    image: ${CADDY_IMAGE:-caddy:2}
    container_name: caddy
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - open-webui
      - uptime-kuma
      - homepage
      - gitea
      - n8n
      - grafana
      - prometheus
    ports:
      - "${BIND_IP:-10.10.20.30}:80:80"
      - "${BIND_IP:-10.10.20.30}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - core

  ollama:
    <<: *security-defaults
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ollama
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - core

  open-webui:
    <<: *security-defaults
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - TZ=${TZ}
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=false
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - core

  uptime-kuma:
    <<: *security-defaults
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:1}
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - core

  docker-socket-proxy:
    <<: *security-defaults
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.3.0}
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - SERVICES=1
      - TASKS=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  homepage:
    <<: *security-defaults
    image: ${HOMEPAGE_IMAGE:-ghcr.io/gethomepage/homepage:latest}
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN_DASH},${BIND_IP}
    volumes:
      - ./homepage/config:/app/config
    networks:
      - core
      - socket

  gitea-db:
    <<: *security-defaults
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: gitea-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
      - POSTGRES_DB=gitea
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    networks:
      - core

  gitea:
    <<: *security-defaults
    image: ${GITEA_IMAGE:-gitea/gitea:latest}
    container_name: gitea
    restart: unless-stopped
    depends_on:
      - gitea-db
    environment:
      - TZ=${TZ}
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=https://${DOMAIN_GIT}/
      - GITEA__server__SSH_DOMAIN=${DOMAIN_GIT}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__START_SSH_SERVER=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    ports:
      - "${BIND_IP:-10.10.20.30}:2222:22"
    volumes:
      - gitea_data:/data
    networks:
      - core

  n8n-db:
    <<: *security-defaults
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: n8n-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - core

  n8n:
    <<: *security-defaults
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    container_name: n8n
    restart: unless-stopped
    depends_on:
      - n8n-db
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=${DOMAIN_N8N}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN_N8N}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - core

  mosquitto:
    <<: *security-defaults
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${BIND_IP:-10.10.20.30}:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - core

  prometheus:
    <<: *security-defaults
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - core

  node-exporter:
    <<: *security-defaults
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    read_only: true
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - core

  grafana:
    <<: *security-defaults
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: grafana
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=${DOMAIN_GRAFANA}
      - GF_SERVER_ROOT_URL=https://${DOMAIN_GRAFANA}/
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - core

networks:
  edge:
  core:
  socket:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  ollama_data:
  open_webui_data:
  uptime_kuma_data:
  gitea_data:
  gitea_db_data:
  n8n_data:
  n8n_db_data:
  prometheus_data:
  grafana_data:
