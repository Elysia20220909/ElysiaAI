<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysia OS | The Experience</title>
  </head>
  <body>
    <div id="app">
      <!-- 1. Linux Kernel Boot Screen -->
      <div id="boot-screen">
        <div class="boot-terminal" id="boot-log"></div>
      </div>

      <!-- 2. Elysia OS Desktop Environment (Aurora Flagship Style) -->
      <div id="desktop" class="hidden">
        
        <!-- Top Status Bar (Aurora Shell) -->
        <div class="top-bar">
          <div class="activities-btn" id="activities-btn">ELYSIOS</div>
          <div class="system-time" id="system-time">ELYSIALAB CORE 7.0</div>
          <div class="system-status">
            <span class="status-icon">📶</span>
            <span class="status-icon">🌐</span>
            <span class="status-icon">📡</span>
            <span class="status-icon">⏻</span>
          </div>
        </div>

        <div class="desktop-main">
          <!-- Left Floating Sidebar (Glass Pill Dash) -->
          <div class="dash-container">
            <div class="dash">
              <div class="dash-item active-app" data-app="sandbox" title="Sovereign Gauntlet">
                 <div class="icon-grid" style="background-position: 0px -54px;"></div>
              </div>
              <div class="dash-item" data-app="nexus" title="Nexus Intelligence">
                 <div class="icon-grid" style="background-position: 0px 0px;"></div>
              </div>
              <div class="dash-item" data-app="swarm" title="Swarm Intelligence Hub">
                 <img src="/assets/icons/swarm-core.png" style="width:38px; height:38px; border-radius:50%;" />
              </div>
              <div class="dash-item" data-app="vault" title="Secure Vault">
                 <div class="icon-grid" style="background-position: -108px 0px;"></div>
              </div>
              <div class="dash-item" data-app="aegis" title="Aegis Sentinel">
                 <img src="/assets/icons/aegis-sentinel.png" style="width:38px; height:38px; border-radius:50%;" />
              </div>
              <div class="dash-item" data-app="gauntlet" title="Sovereign Gauntlet">
                 <img src="/assets/icons/gauntlet.png" style="width:38px; height:38px; border-radius:50%;" />
              </div>
              <div class="dash-item" data-app="forge" title="Sovereign Forge">
                 <img src="/assets/icons/forge.png" style="width:38px; height:38px; border-radius:50%;" />
              </div>
              <div class="dash-item" data-app="settings" title="Core Settings">
                 <div class="icon-grid" style="background-position: -54px -54px;"></div>
              </div>
              
              <div style="flex-grow: 1;"></div>

              <div class="dash-item" data-app="all-apps" title="Grid View">
                <div class="grid-icon">
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Desktop Space -->
          <div id="desktop-area">
             <div class="desktop-icons">
               <div class="desktop-icon-item" data-app="home">
                 <div class="glass-icon">🏠</div>
                 <span>ELYSIASYS</span>
               </div>
               <div class="desktop-icon-item" data-app="trash">
                 <div class="glass-icon">🗑️</div>
                 <span>RECOVERY</span>
               </div>
             </div>
             
              <!-- Window Layer (Top level for floating windows) -->
              <div id="window-layer"></div>
           </div>
        </div>
      </div>

      <!-- Window Templates (Hidden) -->
      <template id="window-template">
        <div class="window" style="z-index: 100;">
          <div class="window-header">
            <div class="window-title">App Name</div>
            <div class="gnome-window-controls">
              <button class="gnome-btn minimize-btn">_</button>
              <button class="gnome-btn maximize-btn">□</button>
              <button class="gnome-btn close-btn">✕</button>
            </div>
          </div>
          <div class="window-body">
            <!-- App Content Injected Here -->
          </div>
        </div>
      </template>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
