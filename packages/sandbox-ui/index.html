<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysia OS | The Experience</title>
  </head>
  <body>
    <div id="app">
      <!-- 1. Security Lock Screen (iOS Style) -->
      <div id="lock-screen">
        <div id="face-id-ui" class="faceid-scanner">
          <div class="faceid-line"></div>
        </div>
        <div id="status-text" class="status-label">FaceID 認証中...</div>
        <div class="passcode-input" id="passcode-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- 2. Elysia OS Desktop Environment -->
      <div id="desktop" class="hidden">
        
        <!-- Top Menu Bar (GNOME Style) -->
        <div class="menu-bar">
          <div class="menu-left">
            <span class="menu-item bold" id="menu-view" style="cursor:pointer;" title="Activities (Full Screen Toggle)">Activities</span>
          </div>
          <div class="menu-center">
            <span class="menu-item bold" id="system-time">12:00</span>
          </div>
          <div class="menu-right">
            <span class="menu-item">📶</span>
            <span class="menu-item">🔋 100%</span>
            <span class="menu-item">⏻</span>
          </div>
        </div>

        <!-- Desktop Workspace & Dash Layer -->
        <div class="desktop-content">
          <!-- Left Dash (Dock) -->
          <div class="dock-container">
            <div class="dock">
              <div class="dock-item" data-app="chat" title="Elysia Intelligence">
                <img src="/assets/icons/chat.png" alt="Chat" />
              </div>
              <div class="dock-item" data-app="sandbox" title="Sandbox Orchestra">
                <img src="/assets/icons/sandbox.png" alt="Sandbox" />
              </div>
              <div class="dock-item" data-app="vault" title="Memory Vault">
                <img src="/assets/icons/vault.png" alt="Vault" />
              </div>
              <div class="dock-item" data-app="sovereign" title="Sovereign Link">
                <img src="/assets/icons/sovereign.png" alt="Sovereign" />
              </div>
              <div class="dock-divider"></div>
              <div class="dock-item" data-app="settings" title="System Settings">
                <img src="/assets/icons/settings.png" alt="Settings" />
              </div>
            </div>
          </div>

          <!-- Window Layer -->
          <div id="window-layer">
            <!-- Windows will be injected here by WindowManager -->
          </div>
        </div>
      </div>

      <!-- Window Templates (Hidden) -->
      <template id="window-template">
        <div class="window" style="z-index: 100;">
          <div class="window-header">
            <div class="window-title">App Name</div>
            <div class="gnome-window-controls">
              <button class="gnome-btn minimize-btn">_</button>
              <button class="gnome-btn maximize-btn">□</button>
              <button class="gnome-btn close-btn">✕</button>
            </div>
          </div>
          <div class="window-body">
            <!-- App Content Injected Here -->
          </div>
        </div>
      </template>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
