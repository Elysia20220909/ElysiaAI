[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["shinsati1234 <shinsati1234@gmail.com>"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", features = ["json"] }
lazy_static = "1.4"
thiserror = "2.0"
rand = "0.8"
winapi = { version = "0.3", features = ["memoryapi", "winbase", "winnt"] }
sysinfo = "0.38"
libc = "0.2"
