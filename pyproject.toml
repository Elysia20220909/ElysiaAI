[project]
name = "elysia-ai"
version = "3.1.0"
description = "The Ultimate Cyber-Dystopian AI Operating System."
readme = "README.md"
authors = [{ name = "chloeamethyst", email = "chloe@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "numpy>=1.26.3",
    "psutil>=5.9.8",
    "python-multipart>=0.0.9",
    "pymilvus>=2.3.5",
    "sentence-transformers>=2.3.1",
    "torch>=2.1.2",
    "faster-whisper>=0.10.0",
    "rich>=13.7.0",
    "duckduckgo-search>=4.3.0",
    "beautifulsoup4>=4.12.3",
    "Pillow>=10.2.0",
    "pyautogui>=0.9.54",
    "networkx>=3.2.1",
    "matplotlib>=3.8.2",
    "inputimeout>=1.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
